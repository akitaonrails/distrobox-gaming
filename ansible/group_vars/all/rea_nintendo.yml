---
# Nintendo arcade series — REA launcher (Dolphin for Triforce + windowsarcadeloader
# for Mario Kart DX / Luigi's Mansion; no TeknoParrot). Linux tarball, no game
# data included. F-Zero AX, Mario Kart GP 2, Mario Kart DX and Luigi's Mansion
# are found and start.
dg_nintendo_repo: akitaonrails/rea-teknoparrot-nintendo-series
dg_nintendo_version: 0.5.3
dg_nintendo_asset_name: "NintendoArcadeLauncher-{{ dg_nintendo_version }}-linux-x86_64.tar.gz"
dg_nintendo_asset_url: "https://github.com/{{ dg_nintendo_repo }}/releases/download/v{{ dg_nintendo_version }}/{{ dg_nintendo_asset_name }}"
dg_nintendo_asset_sha256: 1fd512b994eb6e7cf75e3c61a99e952b5a88209e62a518e5616061b42cc57f81
dg_nintendo_archive: "{{ dg_roms_final_root }}/PC/releases/{{ dg_nintendo_asset_name }}"

dg_nintendo_root: "{{ dg_box_home }}/tools/rea-nintendo"
dg_nintendo_app_dir: "{{ dg_nintendo_root }}/NintendoArcadeLauncher-{{ dg_nintendo_version }}-linux-x86_64"
dg_nintendo_launcher: "{{ dg_box_home }}/bin/nintendo-arcade"
dg_nintendo_data: "{{ dg_box_home }}/.local/share/rea-nintendo"
dg_nintendo_main_output: DP-1
dg_nintendo_revert: false

dg_nintendo_library: "{{ dg_emudeck_root }}/roms_rare/TeknoParrot"
dg_nintendo_packages:
  - gamescope
  - bubblewrap
  - cabextract
