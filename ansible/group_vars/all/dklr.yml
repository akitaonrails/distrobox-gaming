# Donkey Kong Land Remake (DKLR) — kasquez's free Unity fangame remake of the
# GameBoy Donkey Kong Land in the SNES DKC style. Opt-in role install_dklr.
#
# It's a Windows Unity (IL2CPP) build -> runs under Wine + DXVK. Native
# resolution is 256x224 (pixel art), so the launcher integer-scales it to the
# panel with gamescope. The game is KEYBOARD-ONLY (README: no controller
# support), so the launcher runs an evsieve pad->keyboard bridge using the
# README's SNES key map, giving real controller play without the bundled
# Windows JoyToKey. See docs/dklr.md.

dg_dklr_source_dir: "{{ dg_roms_final_root }}/PC/DKLR"
dg_dklr_install_root: "{{ dg_box_home }}/Games/dklr"
dg_dklr_prefix: "{{ dg_box_home }}/wineprefixes/dklr"
dg_dklr_bin: "{{ dg_box_home }}/bin/dklr"
dg_dklr_exe: "DKLR.exe"
dg_dklr_winearch: win64
dg_dklr_wine_bin: /usr/bin/wine
dg_dklr_wineboot_bin: /usr/bin/wineboot
dg_dklr_wineserver_bin: /usr/bin/wineserver
dg_dklr_wine_esync: "0"
dg_dklr_wine_fsync: "0"

# Presentation: 256x224 game, integer-scaled to the panel via gamescope.
dg_dklr_gamescope_enabled: true
dg_dklr_game_width: 256
dg_dklr_game_height: 224
dg_dklr_output_width: 3840
dg_dklr_output_height: 2160
dg_dklr_main_output: DP-1

# Unity IL2CPP: DXVK only (native code, no .NET runtime needed).
dg_dklr_winetricks_components:
  - dxvk

# NOTE: evsieve (the pad->keyboard bridge) is an AUR package, already installed
# for the CMR1 / Sega Rally launchers; the launcher degrades to keyboard-only if
# it's absent. Keep it out of this pacman list (AUR, not in the repos).
dg_dklr_packages:
  - lib32-vulkan-icd-loader
  - rsync
  - sdl2
  - vulkan-icd-loader
  - wine
  - winetricks

dg_dklr_revert: false
