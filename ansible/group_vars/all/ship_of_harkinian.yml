# Ship of Harkinian native Linux Ocarina of Time PC port.

dg_ship_of_harkinian_version: "9.3.1"
dg_ship_of_harkinian_asset_name: SoH-Dewey-Bravo.appimage
dg_ship_of_harkinian_asset_url: "https://github.com/HarbourMasters/Shipwright/releases/download/{{ dg_ship_of_harkinian_version }}/{{ dg_ship_of_harkinian_asset_name }}"
dg_ship_of_harkinian_asset_sha256: e4bb775c9a0c3629ebac57e4b6ccba6d0b621d71ab201e9105aceef9141ad1f4

dg_ship_of_harkinian_hd_pack_version: v11.0.0
dg_ship_of_harkinian_hd_pack_name: oot-reloaded-v11.0.0-soh-o2r-hd.7z
dg_ship_of_harkinian_hd_pack_url: "https://github.com/GhostlyDark/OoT-Reloaded-SoH/releases/download/{{ dg_ship_of_harkinian_hd_pack_version }}/{{ dg_ship_of_harkinian_hd_pack_name }}"
dg_ship_of_harkinian_hd_pack_sha256: a6a551e880739de7f5313888f6cf4eea2eb9d2f04274697fe8ad524ea3c30161
dg_ship_of_harkinian_hd_pack_o2r_name: OoT_Reloaded_v11.0.0_HD.o2r

dg_ship_of_harkinian_root: "{{ dg_box_home }}/tools/ship-of-harkinian"
dg_ship_of_harkinian_install_dir: "{{ dg_ship_of_harkinian_root }}/current"
dg_ship_of_harkinian_cache_dir: "{{ dg_ship_of_harkinian_root }}/cache"
dg_ship_of_harkinian_bin: "{{ dg_box_home }}/bin/ship-of-harkinian"

# Local ROM is byte-swapped (.n64 / v64 order). The role converts it to a
# canonical big-endian z64 copy in the install directory and verifies the
# Ocarina of Time USA Rev B (v1.2) SHA1 before launch.
# The pristine dump was moved into n64/originals/ to separate it from the
# Ocarina of Time Redux romhack that now sits at the n64/ top level.
dg_ship_of_harkinian_rom_source: "{{ dg_rom_mid_root }}/n64/originals/Legend of Zelda, The - Ocarina of Time (USA) (Rev B).n64"
dg_ship_of_harkinian_rom_name: oot.z64
dg_ship_of_harkinian_rom_sha1: 41b3bdc48d98c48529219919015a1af22f5057c2

dg_ship_of_harkinian_install_id: "{{ dg_ship_of_harkinian_version }}-{{ dg_ship_of_harkinian_asset_sha256 }}"
dg_ship_of_harkinian_hd_pack_id: "{{ dg_ship_of_harkinian_hd_pack_version }}-{{ dg_ship_of_harkinian_hd_pack_sha256 }}"

dg_ship_of_harkinian_pacman_packages:
  - unzip
  - p7zip
  - fuse2
  - zenity
