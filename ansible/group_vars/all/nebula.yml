---
# Super Mario Galaxy recompilation. The local disc is an NKit ISO, so extract
# its game partition before passing it to Nebula's Windows-only setup.
dg_nebula_repo: keepvaibin/nebula
dg_nebula_version: 1.0.2
dg_nebula_setup_url: "https://github.com/{{ dg_nebula_repo }}/releases/download/v{{ dg_nebula_version }}/Nebula-Setup.exe"
dg_nebula_setup_sha256: d216f131cf4ad0169e96f1b8c4e892b82e94b3985887d744616076dacad25c28
dg_nebula_nkit_version: 3.1.0
dg_nebula_nkit_url: "https://github.com/Nanook/NKit/releases/download/v{{ dg_nebula_nkit_version }}/NKit_linux-x64_CLI_{{ dg_nebula_nkit_version }}.zip"
dg_nebula_nkit_sha256: f541d05361e8911d0f2236c0813a136e320798d7398488ae2a7cf97b9fe9d4ac
dg_nebula_game_image: "{{ dg_emudeck_root }}/roms_heavy/wii/Super Mario Galaxy (USA) (En,Fr,Es)/Super Mario Galaxy (USA) (En,Fr,Es).iso"
dg_nebula_cache_dir: "{{ dg_box_home }}/cache/nebula"
dg_nebula_nkit_dir: "{{ dg_nebula_cache_dir }}/nkit-{{ dg_nebula_nkit_version }}"
dg_nebula_extract_root: "{{ dg_nebula_cache_dir }}/extracted"
dg_nebula_extracted_game_dir: "{{ dg_nebula_extract_root }}/{{ dg_nebula_game_image | basename | regex_replace('[.]iso$', '') }}/DATA"
dg_nebula_prefix: "{{ dg_box_home }}/tools/nebula/.compatdata"
dg_nebula_install_dir: "{{ dg_nebula_prefix }}/pfx/drive_c/Nebula"
dg_nebula_exe: "{{ dg_nebula_install_dir }}/versions/{{ dg_nebula_version }}/Nebula.exe"
dg_nebula_compile_jobs: 4
dg_nebula_launcher: "{{ dg_box_home }}/bin/nebula-galaxy"
