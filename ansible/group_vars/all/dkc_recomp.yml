---
# Donkey Kong Country SNES recompilations (elliotttate/DKC{1,2,3}Recomp) —
# static recomps of the SNES trilogy into native widescreen PC ports (SDL2,
# shared "snesrecomp" engine). Upstream ships NO Linux binaries (macOS, and
# Windows for DKC2 only), so this role builds from source at a pinned commit,
# with our small Linux-port patches (see files/*.patch; DKC3's newer desktop
# host is upstream-portable and needs only _GNU_SOURCE). Opt-in role
# install_dkc_recomp. See docs/dkc-recomp.md.
#
# Each game generates its recompiled C sources from the user's OWN ROM
# (scripts/generate_snesrecomp.py); the exact revision is enforced by sha256.
# DKC2 is ROM-BLOCKED on this box: the runtime requires the USA v1.0 dump
# (sha256 35421a9a...) and only Rev 1 dumps are present — add the entry once a
# matching dump exists.

dg_dkc_build_packages: [base-devel, cmake, ninja, sdl2, python, git, unzip]

dg_dkc_games:
  - key: dkc1
    name: "Donkey Kong Country"
    repo: https://github.com/elliotttate/DKC1Recomp.git
    ref: ee6d662b75021acfdd0592324aab0acf01344f57
    src_dir: "{{ dg_box_home }}/tools/dkc1-src"
    # patch fixes: mach-time shim, cocoa window ptr, QoS guard, _GNU_SOURCE,
    # and adds the dkc1_linux CMake target; linux_stubs.c stubs the macOS
    # presenter/picker/display-link API (SDL fallback paths take over).
    patch: dkc1-linux-port.patch
    extra_files: { "dkc1-linux_stubs.c": "runner/linux_stubs.c" }
    build_target: dkc1_linux
    binary: build/linux/dkc1_recomp
    rom: "{{ dg_roms_final_root }}/snes/Donkey Kong Country.smc"   # USA v1.0 (the EmuDeck Rev 2 does NOT match)
    rom_sha256: fa8cacf5bbfc39ee6bbaa557adf89133d60d42f6cf9e1db30d5a36a469f74d15
    wmclass: dkc1_recomp
  - key: dkc3
    name: "Donkey Kong Country 3"
    repo: https://github.com/elliotttate/DKC3Recomp.git
    ref: 5afdacbd284144a92521d5219250d39ddca167c3
    src_dir: "{{ dg_box_home }}/tools/dkc3-src"
    # DKC3's desktop host supports Linux upstream; the patch only adds
    # _GNU_SOURCE for the strict-C11 POSIX declarations.
    patch: dkc3-linux-port.patch
    extra_files: {}
    build_target: dkc3_snesrecomp_sdl
    binary: build/linux/DKC3Recomp
    rom: "{{ dg_emudeck_root }}/roms/snes/Donkey Kong Country 3 - Dixie Kong's Double Trouble! (USA) (En,Fr).sfc"
    rom_sha256: 2277a2d8dddb01fe5cb0ae9a0fa225d42b3a11adccaeafa18e3c339b3794a32b
    wmclass: DKC3Recomp

dg_dkc_main_output: "DP-1"
dg_dkc_revert: false
