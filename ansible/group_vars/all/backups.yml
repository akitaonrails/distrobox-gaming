  - { name: lichii-system-save,   src: "tools/lichii/profile/data/eden/nand/system/save" }
  - { name: cemu,                 src: ".local/share/Cemu" }
  - { name: shadps4-savedata,     src: ".local/share/shadPS4/home" }   # per-user <uid>/savedata lives under home/
  - { name: supermodel-nvram,     src: ".supermodel/NVRAM" }
  - { name: dolphin-gba-saves,    src: ".local/share/dolphin-emu/GBA/Saves" }
  - { name: rpcs3-savedata,       src: ".config/rpcs3/dev_hdd0/savedata" }
