  - { name: rea-sega-rally-revo,  src: [".local/share/srr-launcher/prefix/drive_c/users/{{ ansible_facts.user_id }}/Documents/SEGA Rally/Saved Games",
                                       "file:.local/share/srr-launcher/prefix/drive_c/users/{{ ansible_facts.user_id }}/AppData/Local/SRRLauncher/launcher.cfg"] }
  # CMR04 writes loose save/settings files inside the launcher's private runtime
  # copy (CMR4/); back up those persistent names, not the ~1 GB game copy.
  - { name: rea-colin-mcrae-4,    src: ["file:.local/share/cmr4-launcher/prefix/drive_c/users/{{ ansible_facts.user_id }}/AppData/Local/CMR4Launcher/CMR4/OPTIONS",
                                       "file:.local/share/cmr4-launcher/prefix/drive_c/users/{{ ansible_facts.user_id }}/AppData/Local/CMR4Launcher/CMR4/CHAMPIONSHIP_SLOT_1",
                                       "file:.local/share/cmr4-launcher/prefix/drive_c/users/{{ ansible_facts.user_id }}/AppData/Local/CMR4Launcher/CMR4/BESTTIMES_GHOSTS",
                                       "file:.local/share/cmr4-launcher/prefix/drive_c/users/{{ ansible_facts.user_id }}/AppData/Local/CMR4Launcher/launcher.cfg"] }
  # CMR2005 keeps the saves in their own folder in the prefix, outside the game
  # and the private copy; back up that folder plus the launcher.cfg (not the
  # ~3.6 GB unpacked game copy, which rebuilds from the GOG source on first run).
  - { name: rea-colin-mcrae-2005, src: [".local/share/cmr2005-launcher/prefix/drive_c/users/{{ ansible_facts.user_id }}/AppData/Local/CMR2005Launcher/saves",
                                       "file:.local/share/cmr2005-launcher/prefix/drive_c/users/{{ ansible_facts.user_id }}/AppData/Local/CMR2005Launcher/launcher.cfg"] }
  # DiRT Rally is a native Linux game (no Wine prefix): the Feral port keeps its
  # settings in feral-interactive/, and this pre-activated copy keeps the career
  # /profile saves in the Steam-emu's remote folder. Back up both plus the
  # launcher.cfg (not the ~43 GB private copy, which rebuilds from the source).
  - { name: rea-dirt-rally,       src: [".local/share/Steam/ACTiVATED/310560/remote",
