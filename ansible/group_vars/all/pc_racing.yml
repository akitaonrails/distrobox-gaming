# Optional Windows PC racing games managed with Wine inside the distrobox.

dg_pc_racing_source_root: "{{ dg_roms_final_root }}/PC/games"
dg_pc_racing_install_root: "{{ dg_box_home }}/Games/pc-racing"
dg_pc_racing_prefix_root: "{{ dg_box_home }}/wineprefixes/pc-racing"
dg_pc_racing_media_root: "{{ dg_box_home }}/tools/pc-racing/media"
dg_pc_racing_cache_root: "{{ dg_box_home }}/cache/pc-racing"
dg_pc_racing_wine_runner_root: "{{ dg_box_home }}/tools/wine-runners"
# Older Wine builds extracted as sidecar runners for games that regress
# on the current release. Each entry resolves to an Arch pkg.tar.zst,
# pulled from /var/cache/pacman/pkg if present, else from
# archive.archlinux.org. A game opts in via wine_binary/wine_path.
dg_pc_racing_pinned_wine_runners:
  - version: "11.8"
    release: "1"
dg_pc_racing_directx_jun2010_redist: "{{ dg_roms_final_root }}/PC/ports/Project 06 - Silver Release (Patch v1.45)/Sonic the Hedgehog (P-06)/Redist/directx_Jun2010_redist.exe"
dg_pc_racing_xidi_version: v4.3.1
dg_pc_racing_xidi_url: "https://github.com/samuelgr/Xidi/releases/download/{{ dg_pc_racing_xidi_version }}/Xidi-{{ dg_pc_racing_xidi_version }}.zip"
dg_pc_racing_xidi_archive: "{{ dg_pc_racing_cache_root }}/Xidi-{{ dg_pc_racing_xidi_version }}.zip"
dg_pc_racing_wine_path: /usr/local/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
dg_pc_racing_winearch: win64
dg_pc_racing_gamescope_enabled: true
dg_pc_racing_gamescope_width: 3840
dg_pc_racing_gamescope_height: 2160
# Top-left logical position of the gaming monitor (Samsung Odyssey G8,
# DP-1) in the Hyprland layout from ~/.config/hypr/monitors.conf.
dg_pc_racing_target_monitor_x: 4000
dg_pc_racing_target_monitor_y: 619
dg_pc_racing_gamepad_device: /dev/input/js0
# SDL allow-list (comma-separated VID/PID) for the racing games. Keeps
# phantom pads (the 8BitDo dongle's extra keyboard/mouse interfaces,
# idle dongles) invisible to old games while admitting every real pad
# the user plays with:
#   0x2dc8/0x310b  8BitDo Ultimate 2 Wireless (XInput mode via dongle)
#   0x045e/0x0b12  Microsoft Xbox Series X|S pad (xone/GIP via Wireless Adapter)
dg_pc_racing_gamepad_only: "0x2dc8/0x310b,0x045e/0x0b12"
dg_pc_racing_sdl_hidapi: "0"
dg_pc_racing_dinput_disabled_joysticks:
  - ZSA Technology Labs Moonlander Mark I
  - ZSA Technology Labs Moonlander Mark I System Control
  - ZSA Technology Labs Moonlander Mark I Consumer Control
  - ZSA Technology Labs Moonlander Mark I Keyboard
  # Only the dongle's phantom keyboard/mouse pseudo-joysticks. Do NOT
  # disable the bare "8BitDo ..." names: since the host xpad fix the
  # real gamepad enumerates under exactly
  # "8BitDo 8BitDo Ultimate 2 Wireless Controller for PC", and disabling
  # it hides the pad from DirectInput games (bit OutRun 2006 on
  # 2026-07-12; XInput games never noticed).
  - 8BitDo 8BitDo Ultimate 2 Wireless Controller for PC Keyboard
  - 8BitDo 8BitDo Ultimate 2 Wireless Controller for PC Mouse

# Names that must NOT be disabled and are actively removed from every
# prefix: these are the REAL gamepad's names (dinput/hidraw name and the
# evdev/js device name). They were in the disable list during the CMR2
# era (ee2d33e..ea4ba35), so prefixes configured then still carried the
# values — the role only ever added disables. Hit OutRun 2006
# (2026-07-12) and Sega Rally 2 (2026-07-15): DirectInput games saw no
# pad at all; XInput games never noticed.
dg_pc_racing_dinput_removed_joysticks:
  - 8BitDo 8BitDo Ultimate 2 Wireless Controller for PC
  - 8BitDo Ultimate 2 Wireless Controller

dg_pc_racing_winebus_registry:
  - name: DisableHidraw
    value: 1
  - name: DisableInput
    value: 1
  - name: Enable SDL
    value: 1
  - name: Map Controllers
    value: 0
dg_pc_racing_run_installers: false
dg_pc_racing_copy_unpacked: true
dg_pc_racing_export_desktop: false
dg_pc_racing_selected_slugs: []
dg_pc_racing_cleanup_legacy: true

dg_pc_racing_legacy_packages:
  - lutris
  - umu-launcher

dg_pc_racing_legacy_paths:
  - "{{ dg_box_home }}/.cache/lutris"
  - "{{ dg_box_home }}/.cache/umu"
  - "{{ dg_box_home }}/.cache/umu-protonfixes"
  - "{{ dg_box_home }}/.config/lutris"
  - "{{ dg_box_home }}/.local/share/lutris"
  - "{{ dg_box_home }}/.local/share/umu"
  - "{{ dg_box_home }}/cache/pc-racing/lutris-runners"

dg_pc_racing_packages:
  - wine
  - winetricks
  - wine-mono
  - wine-gecko
  - sdl2
  - gamescope
  - joyutils
  - p7zip
  - innoextract
  - rsync

dg_pc_racing_games:
  - slug: colin-mcrae-rally-2
    name: "Colin McRae Rally 2.0"
    install_mode: installer
    source_dir: "{{ dg_pc_racing_source_root }}/Colin-McRae-Rally-2-0_Win_EN-FR-ES_US_CD_Extracted"
    installer: Setup.exe
    install_args: []
    launch_exe: "CMR2.exe"
    installed_path: "{{ dg_pc_racing_prefix_root }}/colin-mcrae-rally-2/drive_c/Program Files (x86)/Codemasters/Colin McRae Rally 2"
    # Wine virtual desktop is REQUIRED for CMR2. Without it the game's
    # D3D7 3D menu surface never composites to the window — intro
    # video plays, audio works, screen freezes on the last video frame
    # while the menu is silently rendered into a backbuffer wine can't
    # display. The fullscreen mode-switch path the game uses to swap
    # from video to 3D rendering interacts badly with the wlroots /
    # Xwayland / NVIDIA combination on this host stack; wrapping the
    # process in `wine explorer /desktop=...` keeps everything inside a
    # plain X11 child window and bypasses the broken handoff.
    # Referenced fix: https://www.patrickmin.com/linux/tip.php?name=cmr2
    wine_desktop:
      name: cmr2
      # 1440p render + Hyprland 1.5x upscale to the 4K panel. Native 4K
      # was tried first (commit 8110a9e) but the game's WineD3D path
      # drops to low fps at 2160p, so render at SilentPatch's 1440p
      # sweet spot and stretch. The stretch only works because the host
      # wrapper disables xwayland:force_zero_scaling for the session
      # (see host_pre_launch_commands below): with zero-scaling ON,
      # XWayland surfaces map 1:1 to PHYSICAL pixels and a 1440p
      # desktop covers 2/3 of the panel with black bars; with it OFF,
      # 2560x1440 equals the monitor's LOGICAL size at scale=1.5 and
      # Hyprland scales it to full panel.
      width: 2560
      height: 1440
    # Wrap the gameplay session with a host-side Hyprland windowrule so
    # the wine virtual desktop (title "cmr2") opens fullscreen on the
    # current monitor. Honors whatever scale the user has configured —
    # Hyprland handles the upscale from the wine_desktop's 1440p X11
    # surface to physical pixels. `hyprctl reload` after the game exits
    # removes the temporary keyword override. NEVER add a monitor scale
    # override here: the user's scale=1.5 on DP-1 is intentional.
    # Wine's virtual desktop window is titled "cmr2 - Wine Desktop"
    # (the bare "cmr2" title regex stopped matching after a Wine title
    # format change), and windowrulev2 is deprecated in current
    # Hyprland — plain windowrule with a prefix match.
    host_pre_launch_commands:
      # Session-scoped: hyprctl reload in post restores omarchy's
      # force_zero_scaling=true (other XWayland apps render blurry
      # while the game runs — acceptable during a gameplay session).
      # NEVER touch monitor scale here.
      - hyprctl keyword xwayland:force_zero_scaling false >/dev/null
      - hyprctl keyword windowrule 'fullscreen on, match:title ^cmr2.*' >/dev/null
    host_post_launch_commands:
      - hyprctl reload >/dev/null 2>&1
    # Defensive pin: this game broke during the May 2026 host upgrade
    # window (wine 11.8→11.9, mesa 26.0.5→.6, NVIDIA 595.58→.71, libdrm
    # 2.4.131→.133, vulkan-icd 1.4.341→.350). Once the wine_desktop
    # workaround above is in place, system wine 11.9 may also work —
    # this pin just keeps us on the wine version where it was last
    # verified end-to-end (intro + menu + race). Drop these two lines
    # to fall back to system Wine; the sidecar runner is still extracted
    # by the install_pc_racing role from dg_pc_racing_pinned_wine_runners.
    wine_binary: "{{ dg_pc_racing_wine_runner_root }}/wine-11.8/usr/bin/wine"
    wine_path: "{{ dg_pc_racing_wine_runner_root }}/wine-11.8/usr/bin:{{ dg_pc_racing_wine_path }}"
    patches:
      - name: silentpatch
        source: "{{ dg_pc_racing_cache_root }}/silentpatch_cmr2.zip"
        backup_exe: "CMR2.exe"
        creates: "SPCMR2.dll"
      # Official WRC Liveries (Nexus colinmcraerally2 mod 1): replaces car
      # textures, liveries, HUD and localized credits. The archive wraps
      # everything in a "Colin McRae Rally 2.0/" folder whose Game/, FrontEnd/
      # and CountrySpecific/ subtrees mirror the installed game layout — so
      # strip_prefix overlays them directly over the install (no re-master of
      # the .exe; pure data replacement). Preserved on the NAS under
      # NexusMods/cmr2/; re-stage there on a from-scratch rebuild.
      - name: wrc-liveries
        source: "{{ dg_roms_final_root }}/PC/mods/NexusMods/cmr2/Official WRC Liveries-1-1-0-1703499888.zip"
        strip_prefix: "Colin McRae Rally 2.0"
        creates: ".dg-wrc-liveries"
    ini:
      - file: "SPCMR2.ini"
        key: Region
        value: AMERICA
      - file: "SPCMR2.ini"
        key: Window
        value: "0"
      - file: "SPCMR2.ini"
        key: Borderless
        value: "0"
      # 1440p — matches wine_desktop; Hyprland stretches to the panel
      # (see wine_desktop comment). 4K rendered too slowly in-game.
      - file: "SPCMR2.ini"
        key: Width
        value: "2560"
      - file: "SPCMR2.ini"
        key: Height
        value: "1440"
    winebus_registry:
      - name: Map Controllers
        value: 1
    env:
      - name: WINEDLLOVERRIDES
        value: "dinput=n,b"
    # gamescope on top of wine_desktop produces the same green/red/pink
    # solid-color symptom that bypassing gamescope entirely cured: the
    # Xwayland → gamescope → Wayland presentation path apparently can't
    # composite wine's X11 virtual-desktop window correctly. Run the
    # game directly under Hyprland — the 2560x1440 wine_desktop window
    # is comfortable on a 4K display; revisit 4K upscale later if
    # gamescope ever ships a fix or we find the right -w / -h shape.
    gamescope_enabled: false
    xidi:
      # CMR2 is DirectInput 7-era (no DX8) so the wrapper is dinput.dll,
      # not dinput8.dll like CMR3/CMR04. Without Xidi the in-game
      # controller options page lists the 8BitDo but greys most rows
      # out — modern controllers don't pass the partial DI7 device-type
      # checks the game does. StandardGamepad template gives CMR2 a
      # full virtual DI joystick and re-enables the options.
      source: "{{ dg_pc_racing_xidi_archive }}"
      url: "{{ dg_pc_racing_xidi_url }}"
      archive_root: "Xidi-{{ dg_pc_racing_xidi_version }}"
      architecture: Win32
      wrappers:
        - dinput.dll
      config: |
        [Mapper]
        Type = CMR2Gamepad

        [CustomMapper:CMR2Gamepad]
        Template = StandardGamepad
        StickLeftX = Axis(X)
        StickLeftY = Null
        TriggerRT = Axis(Y, -)
        TriggerLT = Axis(Y, +)
        DpadUp = Keyboard(UpArrow)
        DpadDown = Keyboard(DownArrow)
        DpadLeft = Keyboard(LeftArrow)
        DpadRight = Keyboard(RightArrow)
        ButtonStart = Keyboard(Enter)
        ButtonBack = Keyboard(Esc)

        [Properties]
        UseBuiltInProperties = yes
        DeadzonePercentStickLeft = 5
        DeadzonePercentStickRight = 5
        DeadzonePercentTriggerLT = 0
        DeadzonePercentTriggerRT = 0
        SaturationPercentStickLeft = 100
        SaturationPercentStickRight = 100
        SaturationPercentTriggerLT = 100
        SaturationPercentTriggerRT = 100

        [Log]
        Enabled = no
        Level = 1

        [Import]
        dinput.dll = C:\Windows\system32\dinput.dll

        [Workarounds]
        ActiveVirtualControllerMask = 0x01
    notes: "Source is a pre-extracted copy of the original BIN/CUE media; the converted ISO is kept beside it. Xidi is required for the controller options page to ungrey: CMR2's DirectInput 7 controller-class detection rejects modern gamepads' partial subtype reports, so Xidi presents a virtual StandardGamepad-derived DI device and the menu re-enables analog binding rows. CMR2 only binds throttle/brake to the virtual left-stick Y axis (no native trigger axes in DI7), so the mapper sends physical RT to Y- (throttle) and physical LT to Y+ (brake) and silences physical left-stick Y to avoid accidental throttle on steering."

  # Colin McRae: DiRT — REMOVED 2026-11-01, replaced by the REA launcher
  # (akitaonrails/rea-dirt, install_rea_dirt): self-contained AppImage with
  # its own Wine + DXVK, private runtime copy of the owned v1.22 source in
  # ROMS_FINAL/PC/games/DiRT-2007. The old interactive InstallShield install,
  # official patch chain, MTFix and per-game prefix are all retired; history
  # in docs/pc-racing.md and docs/rea-dirt.md.

  # DiRT 3 Complete Edition — parked, no working controller path found
  # (wine crashes at the green light with any pad; GE-Proton crashes at
  # the loading screen even with no pad). See docs/pc-racing.md. Entry
  # removed 2026-07-10; NAS source kept for a future retry.

  - slug: colin-mcrae-dirt-2
    name: "Colin McRae: DiRT 2"
    # ElAmigos repack (InnoSetup + ISDone/FreeArc .bin payloads —
    # innoextract cannot unpack these; the installer must run under
    # wine). 2009 EGO-engine DX9 title: DXVK for rendering, native
    # XInput for controllers (no Xidi needed — the engine reads
    # XInput directly, wine xinput -> winebus SDL handles it).
    install_mode: installer
    source_dir: "{{ dg_pc_racing_source_root }}/CMD2"
    installer: "setup.exe"
    install_args:
      - /VERYSILENT
      - /SUPPRESSMSGBOXES
      - /NORESTART
      - /SP-
      - "/DIR=G:\\colin-mcrae-dirt-2"
    launch_exe: "dirt2.exe"
    installed_path: "{{ dg_pc_racing_install_root }}/colin-mcrae-dirt-2"
    winebus_registry:
      - name: Map Controllers
        value: 1
    winetricks_components:
      - dxvk
    gamescope_enabled: true
    gamescope_game_width: "{{ dg_pc_racing_gamescope_width }}"
    gamescope_game_height: "{{ dg_pc_racing_gamescope_height }}"
    gamescope_output_width: "{{ dg_pc_racing_gamescope_width }}"
    gamescope_output_height: "{{ dg_pc_racing_gamescope_height }}"

  # Colin McRae Rally 3 moved to its own self-contained REA launcher
  # (install_rea_colin_mcrae_3, docs/rea-colin-mcrae-3.md) — the AppImage
  # bundles its own Wine + DXVK + SilentPatch + Xidi, so it no longer rides
  # the pc-racing Wine pipeline.

  - slug: richard-burns-rally
    name: "Richard Burns Rally (RSF)"
    install_mode: installer
    source_dir: "{{ dg_pc_racing_source_root }}/Richard Burns Rally"
    installer: "Rallysimfans_Installer.exe"
    launch_exe: "rsf_launcher/RSF_Launcher.exe"
    # RSF installs to its hardcoded default C:\Richard Burns Rally (inside the
    # prefix) and bakes that path into the registry + inis, so we point the
    # launcher there rather than G:\ (moving it would break RSF). C: here is the
    # local NVMe (/mnt/data), same disk as G: — nothing gained by relocating.
    installed_path: "{{ dg_pc_racing_prefix_root }}/richard-burns-rally/drive_c/Richard Burns Rally"
    # DX9 game driven through DXVK/Vulkan. Pin the NVIDIA-only Vulkan ICD so
    # DXVK cannot land on the AMD iGPU (= black screen on this dual-GPU box),
    # and force the x11 SDL video driver (Wayland needs it for the .NET RSF
    # launcher window and the game). Set "Graphics mode = Vulkan" in the RSF
    # launcher (Screen & Graphics) on first run.
    game_env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/nvidia_icd.json
      SDL_VIDEODRIVER: x11
    # Native (no gamescope): DXVK/Vulkan under gamescope routes to the AMD
    # 7950X3D iGPU on this box (same iGPU-grab that black-screens Sega Rally
    # Revo / Supermodel). Native, DXVK picks the RTX 5090.
    gamescope_enabled: false
    winetricks_components:
      - d3dx9
      - vcrun2022
      - dxvk
      # The RSF launcher is a .NET 10 WPF app (AdonisUI). With no Windows fonts
      # in the prefix, WPF hard-crashes (Environment.FailFast in
      # TypefaceMap.MapUnresolvedCharacters) while laying out a TextBox — it
      # initializes fully (debug.log "Completed reading all configuration
      # options") then dies before the window maps. corefonts + tahoma + the
      # Segoe-UI-> Arial substitution below give WPF real fonts and fix it. The
      # .NET 10 desktop runtime itself is installed into the prefix by the RSF
      # installer, so no winetricks dotnet verb is needed.
      - corefonts
      - tahoma
    # RBR reads wheels/pads through DirectInput; native dinput8 is the
    # community-proven override for the RSF launcher + game.
    env:
      - name: WINEDLLOVERRIDES
        value: "dinput8=n,b"
    # Map WPF's default UI font (Segoe UI, absent under Wine) onto an installed
    # corefont so text shaping resolves instead of FailFast-ing.
    registry_values:
      - key: "HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows NT\\CurrentVersion\\FontSubstitutes"
        name: "Segoe UI"
        value: Arial
      - key: "HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows NT\\CurrentVersion\\FontSubstitutes"
        name: "Segoe UI (TrueType)"
        value: Arial
    notes: >-
      RallySimFans (RSF) Richard Burns Rally. Sources are consolidated under
      ROMS_FINAL/PC/games/Richard Burns Rally/ (retail installer, the
      rsf_installer_files torrent payload, and Rallysimfans_Installer.exe). The
      RSF installer is a native-Win32 GUI wizard with no silent flags, so the
      install is interactive: run bin/install-richard-burns-rally, point the
      installer's Source folder at Z:\...\Richard Burns Rally\rsf_installer_files
      and accept the default destination C:\Richard Burns Rally (RSF hardcodes
      that path; installed_path above points there). Around 1% the RSF installer
      launches Microsoft's dxwebsetup, which page-faults under Wine — this is
      harmless (d3dx9 is already in the prefix); dismiss the crash window and the
      install continues. First launch of the RSF launcher needs a free
      rallysimfans.hu account + internet (it downloads cars on demand). See
      docs/richard-burns-rally.md.

  - slug: prince-of-persia-sot
    name: "Prince of Persia: The Sands of Time"
    install_mode: innoextract
    source_dir: "{{ dg_pc_racing_source_root }}/prince of persia"
    installer: "setup_prince_of_persia_-_the_sands_of_time_181_gog_v2_(92028).exe"
    # GOG v2 lays the game files at the extraction root; app/ holds only an ico +
    # webcache, so extract the whole tree ("." - the default "app" grabs only those).
    # __redist/__support/gog/tmp come along but are inert.
    innoextract_root: "."
    # Launch the ORIGINAL exe, not GOG's PrinceOfPersia_gog.EXE wrapper: that wrapper
    # draws a Nuklear overlay whose font-atlas init asserts under Wine (its WMI GPU
    # probe returns nothing, leaving the temporary allocator null -> abort). The plain
    # exe renders fine, and the registry Product_Executable points here too.
    launch_exe: "PrinceOfPersia.EXE"
    installed_path: "{{ dg_pc_racing_install_root }}/prince-of-persia-sot"
    gamescope_enabled: false
    # GOG's installer writes these; innoextract skips them, and the game reads
    # Product_Path to locate its data (POPData.BF / prince.bf) - without them it
    # inits D3D then exits. See project_gog_innoextract_registry. G: = install root.
    registry_values:
      - { key: 'HKLM\SOFTWARE\Ubisoft\Prince of Persia The Sands of Time\1.00.181', name: Product_Path, value: 'G:\prince-of-persia-sot' }
      - { key: 'HKLM\SOFTWARE\Ubisoft\Prince of Persia The Sands of Time\1.00.181', name: Product_Executable, value: 'PrinceOfPersia.exe' }
      - { key: 'HKLM\SOFTWARE\Ubisoft\Prince of Persia The Sands of Time\1.00.181', name: Product_Language, value: '9' }
      - { key: 'HKLM\SOFTWARE\Ubisoft\Prince of Persia The Sands of Time\1.00.181', name: Product_Release, value: 'Retail EMEA' }
    # Legacy DirectDraw7/D3D9 exclusive fullscreen: on the real 4K multi-monitor X
    # server the game thrashes display modes (640x480 <-> desktop) and dies. Route it
    # to a dedicated rootful Xwayland (the CMR1 pattern) that Hyprland composites as
    # one fullscreen surface on the focused monitor (DP-1).
    host_pre_launch_commands:
      - hyprctl dispatch focusmonitor DP-1 >/dev/null 2>&1 || true
      - pgrep -f "Xwayland :12" >/dev/null 2>&1 || { Xwayland :12 -geometry 640x480 -fullscreen -noreset >/dev/null 2>&1 & sleep 1; }
    host_post_launch_commands:
      - pkill -f "Xwayland :12" >/dev/null 2>&1 || true
    # Renders via wined3d -> OpenGL; pin GLX to the RTX 5090 (not the iGPU/llvmpipe).
    game_env:
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    env:
      # Route to the rootful X server from host_pre_launch_commands. force: distrobox
      # always exports DISPLAY, so the :-default form would never override it.
      - name: DISPLAY
        value: ":12"
        force: true
      # Force builtin wined3d for D3D9. DXVK's Vulkan/EGL presenter fails on the
      # rootful Xwayland (dri2 screen / nvidia driver null); wined3d on GLX is clean.
      - name: WINEDLLOVERRIDES
        value: "d3d9=b"
    notes: >-
      GOG v2 (build 92028) of the 2003 Ubisoft game, extracted with innoextract (no
      Wine install step). Self-contained: bundles the VC7.1 runtime, SDL3 controller
      detection and a DirectInput remap layer (dixi.ini, incl. an Xbox 360 profile the
      8BitDo dongle matches). Launched via the plain PrinceOfPersia.EXE - GOG's _gog
      wrapper Nuklear-asserts under Wine. Runs on a rootful Xwayland :12 with wined3d
      (GLX, DXVK bypassed via d3d9=b): the exclusive-fullscreen mode-switch crashes on
      the real 4K multi-monitor X. Verified in-game (Options > Graphics, 1600x1200)
      2026-08-19. The GOG controller remap (dinput8_wrap.dll, gog.toml
      [DllSubstitution]) only loads under the _gog exe; the plain exe uses Wine's
      native DirectInput for the pad - verify 8BitDo mapping in-game.
