---
# NexusMods mod set for STAR WARS Episode I: Racer (GOG classic 1999),
# installed by install_pc_racing (slug star-wars-racer). Opt-in role
# install_swracer_mods. See docs/star-wars-racer-mods.md.
#
# The game is a Wine title under distrobox (NOT Steam/Proton), so there is
# no appid / launch-options / protontricks step -- mods are loose-file
# drop-ins into the extracted game dir.

dg_swracer_mods_game_dir: "{{ dg_pc_racing_install_root }}/star-wars-racer"
dg_swracer_mods_game_exe: "{{ dg_swracer_mods_game_dir }}/SWEP1RCR.EXE"
dg_swracer_mods_required_version: "1.0.0.0"          # GOG 1.0 hotfix3 (build 20791)
# Canonical NexusMods preserve dir on the NAS (staged archives live here;
# reused on retry, never deleted).
dg_swracer_mods_staging_root: "{{ dg_roms_final_root }}/PC/NexusMods/star-wars-racer"
dg_swracer_mods_backup_dir: "{{ dg_swracer_mods_game_dir }}/.dg-mod-backups"
dg_swracer_mods_revert: false

# Ordered, installable catalog. Loose-file drop-ins overwrite files under
# the game's data/ tree; each is marker-guarded + backs up originals.
dg_swracer_mods:
  - id: audio-overhaul
    nexus_id: 5
    name: "Starfighter's Audio Overhaul"
    type: audio
    archive: "StarfightersAudioOverhaul-5-1-1774307193.zip"
    # Files are nested under this dir inside the zip.
    archive_subdir: "StarfightersAudioOverhaul"
    # 22 kHz set: the mod's .wav files are 22050 Hz, matching data/wavs/22K
    # (the game's high-quality audio set; the 11K set is 11025 Hz and would
    # play these at the wrong pitch). Requires the game's audio quality set
    # to high (the default).
    dest_subdir: "data/wavs/22K"
    pattern: "*.wav"
    marker: ".dg-mod-audio-overhaul"

# EXCLUDED by policy -- present for documentation + so the preserved archive
# is tracked, but NOT installed. StixsworldHD's "HD-4K Experience" (mod 2) is
# a ReShade preset (+ dgVoodoo2 wrapper), NOT a texture pack: the archive is
# just ReShadePreset.ini. ReShade is unsupported on this distrobox/Wine box
# (see memory feedback_avoid_reshade_mods and the nexus-mod-set skill's hard
# ReShade exclusion). The .rar is preserved under the staging root.
dg_swracer_mods_excluded:
  - nexus_id: 2
    name: "StixsworldHD's HD-4K Experience"
    archive: "Stixsworld'sHD4K.rar-2-v1-0-1629299218.rar"
    reason: >-
      ReShade preset + dgVoodoo2 (post-process sharpening, not textures);
      ReShade is avoided under distrobox/Wine. Preserved but not installed.
