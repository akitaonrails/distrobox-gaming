---
# Banjo-Tooie Recompiled (some-scurvy-dog/banjo-tooie-scurvy-dog-port) — an
# N64Recomp + N64ModernRuntime + RT64 static recomp PC port of Banjo-Tooie
# (NTSC-U 1.0). Opt-in role install_banjotooie_recomp.
# See docs/banjotooie-recomp.md.
#
# Upstream ships WINDOWS x64 alpha builds only (no Linux/macOS yet) ->
# wine-11.8 with the established recipe (UseEGL=N GLX pin + WineBus SDL for
# the 8BitDo), fullscreen via gamescope. The release zip is hash-pinned on
# the NAS. NOTE: upstream only marks prereleases so far, so the GitHub
# "latest release" API is empty — update checks must list all releases.

dg_btooie_repo: some-scurvy-dog/banjo-tooie-scurvy-dog-port
dg_btooie_version: "0.1.0-alpha.4.5"
dg_btooie_release_tag: "v{{ dg_btooie_version }}"
dg_btooie_asset_name: "BanjoTooieScurvyDogPort-Alpha4.5-Windows-x64.zip"
dg_btooie_zip_url: "https://github.com/{{ dg_btooie_repo }}/releases/download/{{ dg_btooie_release_tag }}/{{ dg_btooie_asset_name }}"
dg_btooie_zip_sha256: "a7cd5c8289090da28b48698fd17bb436c89b389dff1554b5c79af396be0ad771"

dg_btooie_root: "{{ dg_roms_final_root }}/PC/ports/banjotooie-recomp"
dg_btooie_zip: "{{ dg_btooie_root }}/{{ dg_btooie_asset_name }}"
dg_btooie_install_dir: "{{ dg_box_home }}/Games/banjotooie-recomp-{{ dg_btooie_release_tag }}"
dg_btooie_exe: "BanjoTooieScurvyDogPort.exe"

# ROM: Banjo-Tooie NTSC-U 1.0 ONLY (big-endian z64 sha256
# 9ec37fba...3583 — the launcher hard-rejects anything else). The NAS dump
# (roms_final zip, "Banjo-Tooie (U) [!].v64") is byte-swapped; the role
# normalizes it to .z64, verifies the sha256 and keeps it next to the zip,
# plus a copy inside the install dir so the launcher's ROM picker defaults
# next to it. After the first "Choose ROM..." the launcher stores its own
# validated copy in the profile.
dg_btooie_rom_zip: "{{ dg_roms_final_root }}/n64/Banjo-Tooie (USA).zip"
dg_btooie_rom_z64: "{{ dg_btooie_root }}/Banjo-Tooie (USA).z64"
dg_btooie_rom_sha256: "9ec37fba6890362eba86fb855697a9cff1519275531b172083a1a6a045483583"

dg_btooie_launcher: "{{ dg_box_home }}/bin/banjotooie-recomp"
dg_btooie_prefix: "{{ dg_box_home }}/wineprefixes/banjotooie-recomp"
dg_btooie_profile_dir: "{{ dg_box_home }}/.config/banjotooie-recomp"
dg_btooie_wine_bin_dir: "{{ dg_pc_racing_wine_runner_root }}/wine-11.8/usr/bin"
dg_btooie_gamescope_args: "-W 3840 -H 2160 -f"

dg_btooie_winebus_registry:
  - { name: DisableHidraw, value: 1 }
  - { name: DisableInput, value: 1 }
  - { name: "Enable SDL", value: 1 }
  - { name: "Map Controllers", value: 1 }

dg_btooie_main_output: "DP-1"
dg_btooie_revert: false
