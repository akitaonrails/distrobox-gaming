---
# Generic per-game Steam launch options for the IN-BOX Steam, applied by the
# steam_launch_options role (data-driven: add an appid entry, re-run). Written to
# userdata/<id>/config/localconfig.vdf via scripts/set-steam-launch-options.py —
# only while Steam is CLOSED (Steam rewrites that file on exit). When Steam is
# running the role warns and skips; set the option manually in the meantime.
# Keep game-specific mod roles' own launch options where they are; this map is
# for standalone fixes that need no other install step.

dg_steam_launch_options_steam_root: "{{ dg_box_home }}/.local/share/Steam"
dg_steam_launch_options_localconfig: ""   # auto-discovered when empty

dg_steam_launch_options_by_appid:
  # Castlevania Anniversary Collection (Konami/M2). The M2 emulation layer ties
  # its game speed to the DISPLAY REFRESH RATE: on DP-1 at 240 Hz the menus and
  # games run ~4x speed ("permanent fast-forward"). game.exe is D3D9 -> DXVK
  # under Proton, so DXVK's limiter caps presentation at 60 -> correct speed.
  # Never fix this by changing the monitor mode. Verified diagnosis 2026-08-29.
  "1018010":
    name: "Castlevania Anniversary Collection"
    options: "DXVK_FRAME_RATE=60 %command%"
  # Same Konami/M2 layer as above -> same refresh-rate speed coupling. All are
  # D3D9/D3D11 -> DXVK under Proton, so the limiter applies (verified imports).
  "1018020":
    name: "Contra Anniversary Collection"        # game.exe, d3d9
    options: "DXVK_FRAME_RATE=60 %command%"
  "1018000":
    name: "Arcade Classics Anniversary Collection" # AA_AC_ArcadeClassics.exe, d3d11
    # + the SensApi MTA-keepalive shim (install_mta_shim): without it the game
    # crashes on launch under every Proton (CO_E_NOTINITIALIZED null-deref
    # creating the WIC factory from a worker thread). See docs/mta-shim.md.
    options: 'WINEDLLOVERRIDES="sensapi=n,b" DXVK_FRAME_RATE=60 %command%'
  "1552550":
    name: "Castlevania Advance Collection"       # game.exe, d3d9
    options: "DXVK_FRAME_RATE=60 %command%"
  "2369900":
    name: "Castlevania Dominus Collection"       # game.exe, d3d11
    options: "DXVK_FRAME_RATE=60 %command%"
  "2897590":
    name: "GRADIUS origin collection"            # d3d11
    options: "DXVK_FRAME_RATE=60 %command%"
  # Darius Cozmic Collection Arcade is an M2 port too (Taito/M2) — same layer.
  "1638330":
    name: "Darius Cozmic Collection Arcade"
    options: "DXVK_FRAME_RATE=60 %command%"
  # Splinter Cell (2002, UE2/D3D8). The Wine WAYLAND driver (GE-Proton) fixes
  # the menu mouse cursor snapping to corners (XWayland fractional-scale
  # mismatch); -nointro skips the Bink intros that render tiny in a corner.
  # Pair with per-game compat tool GE-Proton11-5 (Steam UI) and the ini fixes
  # from install_splinter_cell_fixes. See docs/splinter-cell.md.
  "13560":
    name: "Tom Clancy's Splinter Cell"
    options: 'PROTON_ENABLE_WAYLAND=1 PROTON_USE_NTSYNC=1 %command% -nointro'
  # Sonic Mania: the Mania Mod Loader proxy (d3d9.dll in the game dir,
  # installed by install_sonic_mania_mods) needs the native override to load —
  # this is what activates Megamix Mania and other DLL mods.
  "584400":
    name: "Sonic Mania"
    options: 'WINEDLLOVERRIDES="d3d9=n,b" %command%'
  # Sonic Origins renders in a tiny bottom-left window under Proton (the
  # Wine X11 driver mis-sizes its fullscreen); the Wine WAYLAND driver fixes
  # it (Splinter Cell lesson). Set the in-game Display to Fullscreen at <=1080p
  # — ProtonDB: >1920x1080 fullscreen crashes with a memory access violation.
  "1794960":
    name: "Sonic Origins"
    options: 'PROTON_ENABLE_WAYLAND=1 %command%'
