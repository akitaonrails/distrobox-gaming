---
# Switch 2 Ocarina of Time runtime: **Fritchii** — Frizti's OoT-specialised
# Lichii fork (zortos293/Lichii lineage, Eden-derived), shipped as a prebuilt
# Linux AppDir (a linuxdeploy tree: bundled Qt6 + ~200 libs, RPATH'd). No source
# build and no third-party shader-sync tool (Fritchii prepares and keeps its own
# shaders, including on NVIDIA/Linux). It shares Eden's `eden/qt-config.ini`
# format and the `eden/` config+data dirs, so the isolated profile, saves and
# controller mapping below are unchanged from the retired source build. The old
# Lichii source build, shader-sync tool and restricted-runtime pilot are all
# retired (see dg_lichii_retired_paths). See docs/lichii.md.

dg_fritchii_repo: Frizti/Fritchii
dg_fritchii_version: "6.2"
dg_fritchii_tag: "fritchii-v{{ dg_fritchii_version }}"
dg_fritchii_asset_name: "Fritchii-v{{ dg_fritchii_version }}-Linux-x86_64.tar.gz"
dg_fritchii_asset_url: "https://github.com/{{ dg_fritchii_repo }}/releases/download/{{ dg_fritchii_tag }}/{{ dg_fritchii_asset_name }}"
dg_fritchii_asset_sha256: 5bf3e6d9d42daff308a4b748aede88fe5c114841b290fb4458cb78e514711428
dg_fritchii_archive: "{{ dg_roms_final_root }}/PC/releases/{{ dg_fritchii_asset_name }}"

dg_lichii_root: "{{ dg_box_home }}/tools/lichii"
# The tarball unpacks a top-level fritchii/ AppDir under this version dir.
dg_fritchii_unpack_root: "{{ dg_lichii_root }}/fritchii-v{{ dg_fritchii_version }}"
dg_fritchii_app_dir: "{{ dg_fritchii_unpack_root }}/fritchii"
# The launcher execs the AppDir's AppRun (bundled Qt6, no system Qt/FUSE).
dg_lichii_bin: "{{ dg_fritchii_app_dir }}/AppRun"
dg_lichii_launcher: "{{ dg_box_home }}/bin/lichii"
dg_lichii_profile: "{{ dg_lichii_root }}/profile"
dg_lichii_config: "{{ dg_lichii_profile }}/config/eden/qt-config.ini"
dg_lichii_game: "{{ dg_roms_final_root }}/switch2/The Legend of Zelda Ocarina of Time [0400486024dec000][v131072].nup"
dg_lichii_game_size: 25622267860
# SDL GUID of the USB 8BitDo Ultimate 2 (2dc8:310b), matching the existing
# Eden mapping. Another machine can override it in host_vars/localhost.yml.
dg_lichii_controller_guid: 03000000c82d00000b31000014010000
# 1x internal. Fritchii drives the 4K OUTPUT with DLSS (its NVIDIA default is
# the "Automatic" model) plus the one-time "Max Resolution" add-on accepted on
# first launch — raising the raw multiplier instead would cost the 60 fps hold.
dg_lichii_resolution_setup: 3
# Seeded into a fresh profile by templates/qt-config.ini.j2 (the Ocarina
# baseline below re-applies it to existing profiles).
dg_lichii_memory_layout_mode: 2  # Memory_8Gb, the game's own memory size
# Ocarina-tuned baseline (this IS the Frizti/Fritchii recommended profile): 8 GB
# memory (the game's own size), GPU accuracy Low ("Fast"), GPU video decoding,
# asynchronous shaders and presentation, mailbox pacing, docked, disk shader
# cache. The in-game settings win afterwards; the role only seeds keys that do
# not exist yet. Fritchii's own GPU-aware graphics (DLSS, Max Resolution) are
# accepted once in its first-launch prompts — see docs/lichii.md.
dg_lichii_profile_settings:
  memory_layout_mode: "2"     # Memory_8Gb
  gpu_accuracy: "0"           # Low / Fast
  nvdec_emulation: "2"        # GPU video decoding
  use_asynchronous_shaders: "true"
  async_presentation: "true"
  vsync_mode: "1"             # Mailbox
  use_docked_mode: "1"
  resolution_setup: "{{ dg_lichii_resolution_setup }}"
  use_disk_shader_cache: "true"
# Older Fritchii versions to clean up (their unpack dirs and NAS archives).
dg_fritchii_superseded_versions: []

# --- Retired artifacts (removed from the box on the next run) ---
# The old source build tree, the third-party shader-sync tool + launcher, and
# the retired restricted-runtime pilot (stock Lichii build-88 AppImage tree and
# its NAS archive). The host-side pieces of the pilot (the docker image, the
# ~/.local/bin/lichii-sandbox launcher and its desktop entry) are removed out of
# band. The shared profile (saves, keys, config) is never touched.
dg_lichii_retired_paths:
  - "{{ dg_lichii_root }}/build-b8e3fd8"
  - "{{ dg_lichii_root }}/lichii-sync"
  - "{{ dg_box_home }}/bin/lichii-shaders"
  - "{{ dg_roms_final_root }}/PC/ports/lichii"
  - "{{ dg_lichii_root }}/build-88"
  - "{{ dg_roms_final_root }}/PC/releases/lichii-build-88-linux-x86_64.AppImage"
