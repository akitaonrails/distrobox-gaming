---
# Spider-Man Remastered + Miles Morales Nexus mods via Overstrike CLI.
# Opt-in role install_spiderman_mods. See docs/nexusmods.md.
#
# History: parked in issue #11 ("Overstrike is GUI-only, no headless path") —
# WRONG: Overstrike has a headless CLI since v1.7.2 (2025-04). Unblocked
# 2026-10-03, both games modded manually, then codified here.
#
# Mechanism: Overstrike bakes mods into the game's asset_archive/toc (creates
# asset_archive/mods/mod* + toc.BAK backup). No runtime loader — the game
# just runs through Steam afterwards. Run this role with Steam STOPPED.
#
# Headless recipe (hard-won, do not re-derive):
# - Run the pinned Overstrike via Proton 11 `runinprefix` in each game's own
#   compatdata prefix (.NET 7 Desktop Runtime already installed in both).
# - `env -u DOTNET_ROOT -u DOTNET_ROOT_X86 -u DOTNET_CLI_HOME` is REQUIRED —
#   the host's mise dotnet-root leaks into Wine and breaks hostfxr.
# - The CLI's add-mod/enable-mod Assert on library-absolute paths and are
#   useless for automation; instead write the profile JSON `mods` array
#   directly ([[library-relative-name, true], ...]) and run `install-mods`.
#   Exit code 0 = success.

dg_smmods_overstrike_version: "1.8.1"
dg_smmods_overstrike_url: "https://github.com/Tkachov/Overstrike/releases/download/OS/v{{ dg_smmods_overstrike_version }}/Overstrike_v{{ dg_smmods_overstrike_version }}.zip"
dg_smmods_overstrike_sha256: "db63705e85c60777ea13d4d4107d3977e55f550c946e5adc6ef0ff3959981ce6"

dg_smmods_nexus_root: "{{ dg_roms_final_root }}/PC/mods/NexusMods"
dg_smmods_overstrike_zip: "{{ dg_smmods_nexus_root }}/_loaders/overstrike/Overstrike_v{{ dg_smmods_overstrike_version }}.zip"
dg_smmods_work_root: "{{ dg_box_home }}/tools/overstrike"

# The shared library on the external STEAM drive (both host + box Steam use
# it). Personal-path default is intentional (central var).
dg_smmods_steamapps: "/run/media/akitaonrails/STEAM/steamapps"
dg_smmods_proton: "{{ dg_smmods_steamapps }}/common/Proton 11.0/proton"
dg_smmods_compat_client_install: "/home/akitaonrails/.local/share/Steam"

# Per-game data. mods entries: archive = NAS archive under the game's mods
# dir, member = path inside the extracted archive, lib = flat name staged in
# Overstrike's "Mods Library" (and referenced by the profile JSON).
dg_smmods_games:
  - id: msmr
    appid: "1817070"
    profile: MSM
    game_dir: "Marvel's Spider-Man Remastered"
    mods_src: spiderman-r
    mods:
      - { archive: "634/NYC Natural Lighting Overhaul-634-1-0-1661026334.rar",
          member: "NYC Natural Lighting Overhaul - Day.smpcmod" }
