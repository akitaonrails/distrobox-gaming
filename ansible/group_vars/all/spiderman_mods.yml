      - { archive: "2868/Traversal And Momentum Tweaks-2868-Ultimate-1670949433.zip",
          member: "TaMT - Ultimate Edition Release/2. PICK ONE Traversal Module/TaMT - Traversal Module.smpcmod" }
      - { archive: "2868/Traversal And Momentum Tweaks-2868-Ultimate-1670949433.zip",
