      - { archive: "3550/TENACIOUS COMBAT ALL-in_ONE (Modular) Part1-3550-Definitive-v1-1737668934.rar",
          member: "TENACIOUS COMBAT MODULAR AiO Part1.modular" }
      - { archive: "2524/Friendly Neighborhood Ultimate Spidaman-2524-1-1-1-1686328580.zip",
