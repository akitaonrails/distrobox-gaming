---
# Star Fox Enhanced (kandowontu/starfox-enhanced) — a native SDL3 hybrid source
# port of the SNES Star Fox (1993, SuperFX), built on the open-source
# UltraStarFox codebase. Selectable 20-360 FPS, widescreen (up to 32:9), HUD
# customization, mouse camera, God Mode. NOT the same as our Star Fox 64 port
# (Starship). Managed by install_starfox_enhanced. See docs/starfox-enhanced.md.
#
# It IS a portable SDL3 C++ engine and builds natively on Linux, but the runtime
# only exercises the EMBEDDED-ROM path (the external-file loader mis-reads the
# ROM). So we run the upstream **prebuilt exe**, which is a single self-contained
# file — its assembled UltraStarFox ROM + symbol map are embedded — under Wine.
# It's SDL3, so it runs cleanly under Wine on the RTX (GLX-pinned).

# Pinned prebuilt (file from the repo at a fixed commit — no GitHub release
# exists). Reproducible by commit sha + sha256. The exe is stored via Git LFS
# since ~2026-09 — raw.githubusercontent serves only the 133-byte LFS pointer,
# so the URL must use media.githubusercontent.com (serves the real binary).
dg_sfe_commit: "e85a66d220ea22e7ef72c6d1a2401f7fd32c793b"
dg_sfe_exe_name: starfox_pc.exe
dg_sfe_exe_url: "https://media.githubusercontent.com/media/kandowontu/starfox-enhanced/{{ dg_sfe_commit }}/dist/StarFoxEnhanced/{{ dg_sfe_exe_name }}"
dg_sfe_exe_sha256: 62859c4bac9c9e31a1ac27146473f96d4b987476db978f594be060afd9de0090

dg_sfe_root: "{{ dg_box_home }}/tools/starfox-enhanced"
dg_sfe_game_dir: "{{ dg_sfe_root }}/game"            # exe runs from here (writes nothing critical)
dg_sfe_bin: "{{ dg_box_home }}/bin/starfox-enhanced"
dg_sfe_prefix: "{{ dg_box_home }}/wineprefixes/starfox-enhanced"
dg_sfe_winearch: win64

# Reuse the pc_racing wine-11.8 sidecar (proven on this box) + SDL controller env.
dg_sfe_wine_bin: "{{ dg_pc_racing_wine_runner_root }}/wine-11.8/usr/bin/wine"
dg_sfe_wine_path: "{{ dg_pc_racing_wine_runner_root }}/wine-11.8/usr/bin:{{ dg_pc_racing_wine_path }}"

# WineBus: route controllers through SDL so the 8BitDo reaches the game's SDL3.
dg_sfe_winebus_registry:
  - { name: DisableHidraw, value: 1 }
  - { name: DisableInput, value: 1 }
  - { name: Enable SDL, value: 1 }
  - { name: Map Controllers, value: 1 }

dg_sfe_main_output: "DP-1"
