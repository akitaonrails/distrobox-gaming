---
# MGSV: The Phantom Pain Nexus mods via mgsv-mod-installer (headless
# SnakeBite). Opt-in role install_mgsvtpp_mods. See docs/nexusmods.md.
#
# History: parked in issue #12 ("SnakeBite is GUI-only, no headless CLI").
# Unblocked 2026-10-03 by mkaflowski/mgsv-mod-installer (2026-09-16): pure
# Python stdlib, output byte-identical to SnakeBite 0.9.2.5 (snakebite.xml,
# FPK merges) — driven via its snakebite_lib API from a small driver script.
#
# Flow (hard-won, do not re-derive): the game was in the OLD SnakeBite 0.8
# layout (foxpatch.dat inside 00.dat, no a_chunk7/a_texture7). The tool
# wants the 0.9.x layout, so: restore 00.dat/01.dat from *.original (0.8
# backups), delete snakebite.xml, inspect -> "clean" -> setup_game (makes
# its own *.original backups incl. chunk0.dat, writes a_chunk7/a_texture7 +
# new foxfs) -> install_mods. A full pre-change backup of
# 00.dat/01.dat/chunk0.dat/snakebite.xml is on the NAS at
# NexusMods/mgsvtpp/_backup-pre-mods/.
#
# Mod 316 (No Development Requirements) is MISSING from the NAS archives
# (empty dir) — the role installs the 4 present mods; add 316's archive and
# its entry below when downloaded.

dg_mgsvmods_tool_commit: "7053368d02373d2c85d19ab9ea3d18afbd4c6de8"
dg_mgsvmods_tool_url: "https://github.com/mkaflowski/mgsv-mod-installer/archive/{{ dg_mgsvmods_tool_commit }}.tar.gz"
dg_mgsvmods_tool_sha256: "869c2824a9557f27c9bcc5cef08160821d9d3d3735cc028d810655f7ce954ba4"
dg_mgsvmods_nexus_root: "{{ dg_roms_final_root }}/PC/mods/NexusMods"
dg_mgsvmods_tool_tarball: "{{ dg_mgsvmods_nexus_root }}/_loaders/mgsv-mod-installer/mgsv-mod-installer-7053368d.tar.gz"
dg_mgsvmods_tool_dir: "{{ dg_box_home }}/tools/mgsv-mod-installer"

dg_mgsvmods_game_dir: "/run/media/akitaonrails/STEAM/steamapps/common/MGS_TPP"
dg_mgsvmods_src: "{{ dg_mgsvmods_nexus_root }}/mgsvtpp"
dg_mgsvmods_staging: "{{ dg_mgsvmods_tool_dir }}/_staging"

# archive = NAS archive under dg_mgsvmods_src, member = .mgsv path inside the
# extracted archive. Install order matters (later wins conflicts).
dg_mgsvmods_mods:
  - { archive: "300-no-more-timers/No More Timers for 1.15.1-300-1-15v3-1573607152.7z",
      member: "nmt_115v3.mgsv" }
  - { archive: "327-female-faces/New Female Faces and Hairs-327-2-4-1552010957.zip",
      member: "NFFH 2.4.mgsv" }
  - { archive: "406-icbinr/ICBINR-406-1-3-1725181095.zip",
      member: "ICBINR - Vibrant.mgsv" }
  - { archive: "1011-beyond-ultra/Beyond Ultra - Extreme - With FXAA-1011-1-3b-1657225911.zip",
      member: "Beyond Ultra - EXTREME - With FXAA.mgsv" }

dg_mgsvmods_revert: false
