---
# Model 2 Emulator (ElSemi's EMULATOR.EXE, v1.1a) — Windows-only, runs
# under Wine inside the box. Source is the copy already on the NAS;
# the segaretro.org download page sits behind a bot captcha, so if the
# NAS copy is ever lost, fetch it manually in a browser from
# https://segaretro.org/Model_2_Emulator and drop it at dg_m2_source_dir.
dg_m2_source_dir: "{{ dg_external_games_root }}/M2emulator_1.1a"

# Box-local install: NVDATA (high scores/settings), CFG (per-game input
# maps) and EMULATOR.INI are all mutated next to the exe, so the NAS
# original must not be run in place.
dg_m2_install_dir: "{{ dg_box_home }}/emulators/m2emulator"
dg_m2_prefix: "{{ dg_box_home }}/wineprefixes/m2emulator"

# emulator_multicpu.exe distributes the DSP/SCSP threads — the right
# build on a modern many-core CPU (EMULATOR.EXE is the single-core one).
dg_m2_exe: emulator_multicpu.exe

dg_m2_rom_dir: "{{ dg_rom_rare_root }}/model2"

# Pre-configured per-game controller maps (CFG/*.input) for a single
# XInput pad, covering ~41 games. The stock M2emulator_1.1a ships only
# daytona/daytonam .input files, and those are a broken 2-device setup
# (analog axes on joypad 1, buttons/hats on joypad 2) that does nothing
# with one controller. This pack maps everything to joypad 1. Seeded
# once into the install CFG (see role); later in-GUI tweaks persist.
dg_m2_cfg_source: "{{ dg_external_games_root }}/Model 2/CFG"

# Pre-configured per-game NVRAM (NVDATA/*.DAT) from the same pack — the
# games' Test/Service-menu settings (Free Play = unlimited credits/
# continues, English, calibrated). Difficulty/lives/time live in these
# binary files; there is no config-file toggle. Seeded once, with any
# existing NVDATA backed up first (nothing destroyed).
dg_m2_nvdata_source: "{{ dg_external_games_root }}/Model 2/NVDATA"

# Per-game widescreen LUA scripts (Norm's True 16:9 Widescreen Project),
# from the same pack. The emulator auto-loads scripts/<romset>.lua and
# each calls Model2_SetWideScreen(1) to render TRUE 16:9 in-game — real
# horizontal FOV expansion (extra scene on the sides), not a stretch and
# no pillarbox. Without them the emulator fills 16:9 by stretching the 4:3
# image (~33% too wide). The pack also ships a "4x3 Scripts" subfolder to
# swap any title back to correct 4:3. Seeded into the install scripts/
# folder (one-time, marker-gated, so later per-game swaps aren't clobbered).
# Verified 2026-08-04: VF2 renders proper widescreen with correct
# proportions. (Pilot Kids, Sky Target, Virtua Striker are the known
# not-working titles in the upstream project.)
#
# Racers unsuccessful (parked 2026-08-04): Daytona USA and Sega Rally
# (srallyc) render 4:3-stretched. Their pack scripts gate SetWideScreen(1)
# on an in-game RAM-state check that doesn't match this emulator_multicpu
# build, so it never fires. Forcing it always-on (like the fighters) was
# tried on both and they STAYED stretched instead of gaining FOV — the
# emulator's widescreen simply doesn't engage for these titles here. Left
# at the stable 16:9 stretch; stock conditional scripts kept, no override.
# See the aspect-ratio section in docs/sega-arcade.md.
dg_m2_scripts_source: "{{ dg_external_games_root }}/Model 2/scripts"

# Games where the upstream widescreen script glitches (missing geometry /
# HUD): force them back to the pack's correct 4:3 script (from the
# "4x3 Scripts" subfolder) after the widescreen seed. Rendered correct-but-
# pillarless 4:3 (stretched to fill), which beats broken widescreen.
dg_m2_force_4x3_games:
  - pltkids
  - skytargt
  - vstriker

# gamescope output = emulator render resolution: the full 16:9 screen.
# Model 2 games are 4:3, but rendering 4:3 and pillarboxing under
# gamescope proved unstable with this emulator (the AutoFull mode-switch
# drifts the surface and re-exposes the transparent letterbox → desktop
# bleed + tearing). Filling 16:9 (a ~33% horizontal stretch) is the
# stable trade-off. See the launcher template and docs/sega-arcade.md.
dg_m2_gamescope_width: 3840
dg_m2_gamescope_height: 2160

# Same winebus policy as the pc-racing prefixes: single SDL backend,
# no duplicate hidraw/evdev enumeration, SDL devices mapped as XInput
# controllers (the emulator runs with XInput=1).
dg_m2_winebus_registry:
  - { name: DisableHidraw, value: 1 }
  - { name: DisableInput, value: 1 }
  - { name: Enable SDL, value: 1 }
  - { name: Map Controllers, value: 1 }

# d3dx9 + d3dcompiler: the emulator loads d3dx9 helpers and compiles
# its scripts/*.ps pixel shaders at runtime; without the native
# d3dcompiler the renderer falls back to garbage or crashes.
dg_m2_winetricks_components:
  - d3dx9
  - d3dcompiler_47
  - dxvk

# EMULATOR.INI keys managed by Ansible. ROM discovery is NOT configured
# here: [RomDirs] needs a Windows path and the backslash escaping
# through YAML+Jinja+ini_file is unreliable — instead the role symlinks
# a ROMS/ dir next to the exe, which the emulator always scans.
dg_m2_ini_settings:
  # Fill the 16:9 output (stretched); see the resolution comment above.
  - { section: Renderer, option: FullScreenWidth, value: "{{ dg_m2_gamescope_width }}" }
  - { section: Renderer, option: FullScreenHeight, value: "{{ dg_m2_gamescope_height }}" }
  # Start fullscreen (gamescope provides the matching video mode).
  - { section: Renderer, option: AutoFull, value: "1" }
  - { section: Renderer, option: Bilinear, value: "1" }
  - { section: Renderer, option: FSAA, value: "4" }
  - { section: Input, option: XInput, value: "1" }
