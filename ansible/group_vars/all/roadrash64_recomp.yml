# Road Rash 64 Recompiled — native N64 recompilation (linkssy2, N64Recomp +
# N64ModernRuntime/RT64), with 60 FPS, MAX LOD, widescreen, custom music.
# The v1.3.1 Linux build (CalenCyr's native contribution) ships as an AppImage;
# the user supplies their own Road Rash 64 USA v1.0 ROM. See docs/roadrash64.md.
#
# The recomp accepts --auto-rom <path>: it validates the dump against the game's
# expected hash, stores the normalized ROM in ~/.config/RoadRash64Recompiled/,
# and auto-starts — so the launcher's ROM picker never appears. Vulkan/RTX.

dg_rr64_repo: linkssy2/RoadRash64Recompiled
dg_rr64_release_tag: v1.3.1
dg_rr64_asset_name: RoadRash64Recompiled-v1.3.1-Rev2-Linux-Experimental.zip
dg_rr64_asset_url: "https://github.com/{{ dg_rr64_repo }}/releases/download/{{ dg_rr64_release_tag }}/{{ dg_rr64_asset_name }}"
dg_rr64_asset_sha256: "8814bfac6f9377475c98630c44acb2107f0ad1fa9ebeeeb8481139dc26780a71"

dg_rr64_root: "{{ dg_box_home }}/tools/roadrash64-recomp"
dg_rr64_cache_dir: "{{ dg_box_home }}/cache/roadrash64-recomp"
dg_rr64_appimage: "{{ dg_rr64_root }}/RoadRash64Recompiled-x86_64.AppImage"
dg_rr64_launcher: "{{ dg_box_home }}/bin/roadrash64"
dg_rr64_config_dir: "{{ dg_box_home }}/.config/RoadRash64Recompiled"
dg_rr64_main_output: "DP-1"
dg_rr64_revert: false

# User's own dump — Road Rash 64 (USA) v1.0, normalized (big-endian z64) SHA-1
# 87727a298f583ec8325f5655088ff21e37b335b2, 32 MiB. The .n64 byte-swapped dump
# already in roms_mid/n64 normalizes to that exact hash; passed to --auto-rom
# as-is (it accepts .z64/.n64/.v64).
dg_rr64_rom: "{{ dg_rom_mid_root }}/n64/Road Rash 64 (USA).n64"
dg_rr64_rom_sha1_z64: "87727a298f583ec8325f5655088ff21e37b335b2"

dg_rr64_pacman_packages:
  - unzip
  - fuse2
