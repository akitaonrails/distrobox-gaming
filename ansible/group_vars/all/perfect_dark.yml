---
# Perfect Dark PC port — DabDavis/perfect-dark-dabs-mod, a superset FORK of the
# mainline perfect-dark-pc-port/perfect_dark (itself from the N64 decomp). Keeps
# everything upstream (OpenGL 3, any resolution, dual-analog + mouse, FOV) and
# adds opt-in extras: jump/roll/melee, third-person + spectator cameras, 8->80
# simulants, body persistence, F12 screenshots, MP4 recording, 2x/4x/8x texture
# upscaling + texture-pack auto-download, and an xdelta/bps/ips mod + stage
# loader. Same ROM (NTSC-U V1.1) and pd.ini-compatible (Mod.* keys are additive).
# Runs on the RTX. Managed by install_perfect_dark. See docs/perfect-dark.md.

# Unlike the mainline's rolling `ci-dev-build`, the fork ships STABLE version
# tags — pin one by sha256. The tarball is staged on the NAS
# (dg_pd_archive_source) and reused on rebuilds; get_url only downloads if it's
# missing/corrupt (and refuses a newer build until the sha is bumped).
dg_pd_repo: DabDavis/perfect-dark-dabs-mod
dg_pd_release_tag: v3.4.0
dg_pd_asset_name: pd-dabs-mod-x86_64-linux.tar.gz
dg_pd_asset_url: "https://github.com/{{ dg_pd_repo }}/releases/download/{{ dg_pd_release_tag }}/{{ dg_pd_asset_name }}"
dg_pd_asset_sha256: d3fe89db18da641d3e788aab7cb48c4e4b402bd22b0ed8b86740cad6dec2de98
dg_pd_build_ref: "dabs-mod v3.4.0 (2026-09-12)"   # provenance of the pinned sha256, informational
dg_pd_archive_source: "{{ dg_roms_final_root }}/PC/perfect-dark-port/{{ dg_pd_asset_name }}"

dg_pd_root: "{{ dg_box_home }}/tools/perfect-dark"    # pd.x86_64 + data/
dg_pd_cache_dir: "{{ dg_box_home }}/cache/perfect-dark"
dg_pd_bin: "{{ dg_pd_root }}/pd.x86_64"
dg_pd_launcher: "{{ dg_box_home }}/bin/perfect-dark-launch"
# The port writes pd.ini + saves here on Linux.
dg_pd_config_dir: "{{ dg_box_home }}/.local/share/perfectdark"

# The ROM: NTSC-U V1.1 ("ntsc-final", md5 e03b088b6ac9e0080440efed07c1e40f in
# z64 form), placed as data/pd.ntsc-final.z64. This box's dump is the (USA)
# (Rev A) .n64 (byteswapped); the role converts + md5-verifies it.
dg_pd_rom_src: "{{ dg_rom_mid_root }}/n64/Perfect Dark (USA) (Rev A).n64"
dg_pd_rom_md5_z64: e03b088b6ac9e0080440efed07c1e40f
dg_pd_rom_stored: "{{ dg_pd_root }}/data/pd.ntsc-final.z64"

# First-install pd.ini seed ([Video] only; the port fills every other default and
# rewrites the file on exit). Borderless fullscreen — NOT exclusive (an exclusive
# mode-switch is what crashes Wine games on the 240Hz DP-1; keep the display
# mode alone) — and a frame cap: the port misbehaves above ~165 FPS and VSync
# on this 240Hz panel would run it at 240.
dg_pd_framerate_limit: 144

dg_pd_main_output: "DP-1"
dg_pd_revert: false
