  # Gran Turismo money cheats — user wants these permanent and on by
  # default (2026-09-29). `content` deploys a DuckStation-native-format
  # .cht as cheats/<serial>_<tag>.cht (the loader glob-matches
  # <serial>*.cht), and `enable_names` writes
  #   [Cheats] EnableCheats = true  +  repeated  Enable = <name>
  # lines into gamesettings/<serial>.ini — on current DuckStation the
  # game-INI enable list is what actually activates cheats at boot
  # (verified against src/core/cheats.cpp: ReloadEnabledLists reads
  # [Cheats] Enable string-list from the game settings layer only).
  - serial: SCUS-94194   # Gran Turismo (USA)
    tag: money
    content: |
      ; Gran Turismo USA — money cheat, on-by-default per user request.
      ; Disc is redump Rev 1 / Greatest Hits (v1.1): EXE date 1998-06-17
      ; verified from the ISO9660 tree of our CHD (v1.0 is 1998-04-15).
      ; The v1.0 money address (0x09B864) does NOT apply to this disc.
      [Money\1 Billion Credits (GT Mode)]
      Type = Gameshark
      Activation = EndFrame
      9009B8F4 3B9ACA00
    enable_names:
      - 'Money\1 Billion Credits (GT Mode)'

  # GT1 60 FPS — Silent's patch (asasega original, Silent expansion
  # re-enabling tire smoke + rear view mirror that GT1's leftover Hi-Fi
  # mode disables). Codes from Console-Cheat-Codes
  # PS1/Gran Turismo/60 FPS/NTSC-U 1.1.cht — our disc is Rev 1 (v1.1).
  # The CHTDB pack (cheats/SCUS-94194.cht) also ships a "60 FPS" entry but
  # with v1.0 addresses (0B6318/02E580/02AA74) that do NOT apply to this
  # disc; the "(Silent)" suffix keeps the names distinct so only these
  # v1.1 codes activate.
  - serial: SCUS-94194   # Gran Turismo (USA Rev 1)
    tag: 60fps
    content: |
      ; Gran Turismo USA Rev 1 (v1.1) — Silent's 60 FPS patch.
      ; https://github.com/CookiePLMonster/Console-Cheat-Codes
      ;   PS1/Gran Turismo/60 FPS/NTSC-U 1.1.cht
      ; 60 FPS limit lift + re-enable tire smoke + re-enable rear view mirror.
      [60 FPS (Silent)]
      Type = Gameshark
      Activation = EndFrame
      A60B6348 00020001
      A702E548 00020001
      A702AA3C 00020001
    enable_names:
      - '60 FPS (Silent)'

  # GT2 Simulation Disc v1.2 money cheat. NOTE: DuckStation's game
  # settings layer for this disc set is anchored on SCUS-94455 (the
  # Arcade serial is the disc-set leader — the log shows "Loading game
  # settings from 'SCUS-94455.ini'" even when booting the Simulation
  # disc), so the enable list must live in the 94455 ini while the .cht
  # ships for both serials.
  - serial: SCUS-94488   # Gran Turismo 2 Simulation Disc (USA v1.2)
    tag: money
    content: |
      ; Gran Turismo 2 Simulation (USA v1.2) — money cheat.
      ; v1.2-specific max-cash address (v1.0 codes are shifted — the
      ; widely copied "Max Cash After One Race" does not apply here).
      ; Writes 0x1525E0FF = 354,615,039 Cr, above the 99,999,999
      ; display cap; EndFrame activation keeps it pinned, so purchases
      ; never drain credits while the cheat is on.
      [Money\Max Cash (GT Mode)]
      Type = Gameshark
      Activation = EndFrame
      801D156A 1525
      801D1568 E0FF
    enable_names:
      - 'Money\Max Cash (GT Mode)'

  - serial: SCUS-94455   # GT2 disc-set leader — carries the [Cheats] enable
    tag: money
    content: |
      ; Gran Turismo 2 (USA v1.2, disc-set leader file) — see the
      ; SCUS-94488 money entry; identical cheat, deployed for both
      ; serials because DuckStation reads the game ini from 94455 for
      ; the whole set.
      [Money\Max Cash (GT Mode)]
      Type = Gameshark
      Activation = EndFrame
      801D156A 1525
      801D1568 E0FF
    enable_names:
      - 'Money\Max Cash (GT Mode)'

# Supermodel (Sega Model 3). The 0.3a binary resolves its tree under
# ~/.supermodel absolutely (NOT ~/.config/supermodel — the AUR wrapper
# is wrong about that). The supermodel-launch wrapper seeds
# Games.xml/Music.xml/Assets on first run; these keys are the managed
# render settings on top of the binary's built-in defaults (which
# already include SDL gamepad bindings).
dg_supermodel_ini: "{{ dg_box_home }}/.supermodel/Config/Supermodel.ini"
dg_supermodel_nvram_dir: "{{ dg_box_home }}/.supermodel/NVRAM"
# Pre-configured per-game NVRAM (<romset>.nv) — Test/Service-menu
# settings (Free Play etc.). Seeded once, existing NVRAM backed up.
dg_supermodel_nvram_source: "{{ dg_external_games_root }}/Supermodel3/NVRAM"
dg_supermodel_settings:
  # FullScreen=1 works because supermodel-launch runs under gamescope,
  # which presents a real 3840x2160 mode. (Bare on scaled XWayland it
  # fails — "Couldn't find any matching video modes" — and windowed mode
  # ignores the resolution and opens a tiny 496x384 window; hence
  # gamescope. The wrapper also passes -res/-fullscreen explicitly.)
  - { option: FullScreen, value: "1" }
  - { option: XResolution, value: "3840" }
  - { option: YResolution, value: "2160" }
  # Native 16:9 rendering (wider FOV) instead of stretched 4:3, with
  # backgrounds extended to match.
  - { option: WideScreen, value: "1" }
  - { option: WideBackground, value: "1" }
  - { option: New3DEngine, value: "1" }
  - { option: VSync, value: "1" }
  - { option: Throttle, value: "1" }
  # Input fixes for xpad-ordered pads (8BitDo dongle, Xbox): Supermodel's
  # JOY1_BUTTONn is 1-based over the SDL joystick button list
  # (1=A 2=B 3=X 4=Y 5=LB 6=RB 7=Back 8=Start 9=Guide 10=L3 11=R3).
  # Defaults put Start on Guide, Coin on L3, accel/brake on the d-pad,
  # and gears 3/4 on Back/Start — all wrong for these pads.
  - { option: InputStart1, value: '"KEY_1,JOY1_BUTTON8"' }
  - { option: InputCoin1, value: '"KEY_3,JOY1_BUTTON7"' }
  - { option: InputAccelerator, value: '"KEY_UP,JOY1_RZAXIS_POS"' }
  - { option: InputBrake, value: '"KEY_DOWN,JOY1_ZAXIS_POS"' }
  - { option: InputGearShiftUp, value: '"KEY_Y,JOY1_BUTTON6"' }
  - { option: InputGearShiftDown, value: '"KEY_H,JOY1_BUTTON5"' }
  # Keyboard-only: the JOY defaults for the 4-way shifter collided with
  # Back/Start (coin/start) on these pads.
  - { option: InputGearShift1, value: '"KEY_Q"' }
  - { option: InputGearShift2, value: '"KEY_W"' }
  - { option: InputGearShift3, value: '"KEY_E"' }
  - { option: InputGearShift4, value: '"KEY_R"' }

dg_flycast_ini: "{{ dg_box_home }}/.config/flycast/emu.cfg"
dg_flycast_data_dir: "{{ dg_box_home }}/.local/share/flycast"
# Arcade BIOS sets flycast needs for NAOMI 1/2 (and Atomiswave). It only
# finds them in its data dir or a configured content path — symlinked
# from the EmuDeck bios tree, NAS stays the single source of truth.
dg_flycast_bios_links:
  - naomi.zip
  - naomi2.zip
  - awbios.zip
# Pre-configured per-game NAOMI/NAOMI2 NVRAM (<rom>.zip.nvmem +
# .eeprom) — Test/Service-menu settings (Free Play etc.). ~97 games,
# covers both naomi and naomi2. Seeded once into the flycast data dir,
# existing NVRAM backed up first.
dg_flycast_nvmem_source: "{{ dg_external_games_root }}/Launchbox/launchbox naomi/NVMEM Naomi"
dg_flycast_settings:
  - { section: config, option: pvr.AutoSkipFrame, value: "0" }
  - { section: config, option: pvr.rend, value: "4" }
  - { section: config, option: rend.DelayFrameSwapping, value: "no" }
  - { section: config, option: rend.DupeFrames, value: "yes" }
  - { section: config, option: rend.EmulateFramebuffer, value: "no" }
  - { section: config, option: rend.Resolution, value: "4320" }
  - { section: config, option: rend.WideScreen, value: "yes" }
  - { section: config, option: rend.vsync, value: "yes" }

# Emulator commands verified by the verify role.
dg_emulator_commands:
  - duckstation-qt
  - pcsx2-qt
  - flycast
  - dolphin-emu
  - PPSSPPQt
  # rpcs3 verified via the install_rpcs3 AppImage (not a PATH command anymore)
  - shadps4
  # xemu verified via the install_xemu AppImage + bin/xemu wrapper

# Dolphin controller config files to copy.
dg_dolphin_configs:
  - GCPadNew.ini
  - WiimoteNew.ini
  - Profiles/GCPad/8BitDo Ultimate 2 SDL.ini
  - Profiles/Wiimote/8BitDo Ultimate 2 Classic.ini
  - Profiles/Wiimote/8BitDo Ultimate 2 Nunchuk.ini

# melonDS standalone (DS). Compute renderer at 8x internal scale (the
# modern hi-res path in melonDS 1.x; classic OpenGL and software remain
# selectable in-app), GL present path, hybrid screen layout, filtering.
# Real BIOS + firmware are copied box-local because melonDS writes user
# settings INTO the firmware file — the NAS originals stay pristine.
dg_melonds_config_dir: "{{ dg_box_home }}/.config/melonDS"
dg_melonds_bios_files:
  - bios7.bin
  - bios9.bin
  - dsfirmware.bin
