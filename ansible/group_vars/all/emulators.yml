# Per-emulator INI settings applied by the seed_configs role.
# Each entry maps to a community.general.ini_file call.

dg_pcsx2_ini: "{{ dg_box_home }}/.config/PCSX2/inis/PCSX2.ini"
dg_pcsx2_settings:
  - { section: UI, option: ConfirmShutdown, value: "false" }
  # Without Language set, PCSX2 tries to load pcsx2-qt_.qm and errors out.
  - { section: UI, option: Language, value: "en-US" }
  - { section: Hotkeys, option: ShutdownVM, value: "SDL-0/Start & SDL-0/Back" }
  # Quick save / load on slot 1 via the controller. Select(=Back) + R1
  # saves, Select + L1 loads. Slot 1 (not 0) so it stays out of PCSX2's
  # "resume" state behavior — that resume state is auto-managed by
  # SaveStateOnShutdown and lives in its own dedicated slot.
  - { section: Hotkeys, option: SaveStateToSlot1, value: "SDL-0/Back & SDL-0/RightShoulder" }
  - { section: Hotkeys, option: LoadStateFromSlot1, value: "SDL-0/Back & SDL-0/LeftShoulder" }
  # Renderer 14 = Vulkan; NVIDIA selection comes from VK_ICD_FILENAMES
  # injected by the desktop launcher, so the Adapter setting can stay Auto.
  - { section: "EmuCore/GS", option: "Renderer", value: "14" }
  # AspectRatio enum — PCSX2 rejects the GUI label "Widescreen (16:9)"
  # with "Unrecognized value" and falls back to default. Valid strings
  # are "Auto 4:3/3:2", "4:3", "16:9", "Stretch". Default globally to
  # "Auto 4:3/3:2" so each game renders in its native ratio; per-game
  # overrides in dg_pcsx2_per_game_settings force 16:9 for titles that
  # ship a widescreen patch (GT4, Spec II, Enthusia).
  - { section: "EmuCore/GS", option: "AspectRatio", value: "Auto 4:3/3:2" }
  - { section: "EmuCore/GS", option: "FMVAspectRatioSwitch", value: "Off" }
  - { section: "EmuCore/GS", option: "upscale_multiplier", value: "6.000000" }
  - { section: "EmuCore/GS", option: "MaxAnisotropy", value: "16" }
  - { section: "EmuCore/GS", option: "TextureFiltering", value: "2" }
  # TriFilter -1 = Automatic (PCSX2's recommended default). Values 1 or 2
  # force trilinear globally and cause PCSX2 to log "Trilinear filtering
  # is not set to automatic. This may break rendering in some games."
  # Leave it on Automatic.
  - { section: "EmuCore/GS", option: "TriFilter", value: "-1" }
  # FXAA post-process — cheap (~1-2% perf) edge-smoothing on top of the
  # 6x upscale SSAA. Catches sub-pixel aliasing the integer upscale misses
  # (e.g. thin lines, sprite edges in UI/HUD).
  - { section: "EmuCore/GS", option: "fxaa", value: "true" }
  # PCRTC Anti-blur — PCSX2's PCRTC emulation applies a slight blur to
  # match CRT scanline behavior. Turn off for a sharper output now that
  # we upscale 6x and we're not on a CRT.
  - { section: "EmuCore/GS", option: "pcrtc_antiblur", value: "true" }
  - { section: "EmuCore/GS", option: "AccurateBlendingUnit", value: "Basic" }
  # Async replacement texture load avoids stalls when a game first hits
  # a texture; precache off keeps startup fast (textures load on demand).
  - { section: "EmuCore/GS", option: "LoadTextureReplacements",     value: "true" }
  - { section: "EmuCore/GS", option: "TextureReplacementsAsync",    value: "true" }
  - { section: "EmuCore/GS", option: "PrecacheTextureReplacements", value: "false" }
  # Apply PCSX2's built-in widescreen patches when a match exists for the game
  - { section: "EmuCore", option: "EnableWideScreenPatches", value: "true" }
  # Enable per-game settings + cheats to actually be read from our
  # gamesettings/<SERIAL>.ini files.
  - { section: "EmuCore", option: "EnablePerGameSettings", value: "true" }
  # Faster disc loading:
  # - CdvdPrecache reads the whole disc image into RAM at boot. Pure
  #   I/O optimization (no emulation-behavior change) — matters here
  #   because ISOs live on the NAS over NFS, so in-game streaming
  #   otherwise pays network latency per seek.
  # - fastCDVD removes the emulated drive's seek/read latency. Rarely,
  #   a game depends on real disc timing and breaks (freezes/skipped
  #   FMVs); if one does, override fastCDVD=false in its
  #   gamesettings/<SERIAL>_<CRC>.ini.
  - { section: "EmuCore", option: "CdvdPrecache", value: "true" }
  - { section: "EmuCore/Speedhacks", option: "fastCDVD", value: "true" }
  # Auto save state on PCSX2 quit (creates a per-game "resume" state).
  # Auto-LOAD only fires when launching the game from PCSX2-Qt's own
  # built-in game library — right-click the game → Resume, or
  # double-click a game with a resume state and accept the popup. CLI
  # launches via `pcsx2-qt -batch %ROM%` (ES-DE path) can't access the
  # resume state; that's an upstream limitation tracked in PCSX2
  # issues #12067 (auto-load on start) and #12413 (CLI access to
  # resume state). To use auto-resume: launch GT3 / etc. from
  # PCSX2-Qt's own window, not from ES-DE.
  - { section: "EmuCore", option: "SaveStateOnShutdown", value: "true" }
  # Input source: SDL gamepad backend covers Xbox One/Series, 8BitDo, etc.
  - { section: InputSources, option: SDL, value: "true" }
  - { section: InputSources, option: SDLControllerEnhancedMode, value: "true" }
  # Pad1: standard Xbox-style mapping with PS-style Cross/Circle/Square/Triangle.
  - { section: Pad1, option: Type, value: "DualShock2" }
  - { section: Pad1, option: Cross, value: "SDL-0/A" }
  - { section: Pad1, option: Circle, value: "SDL-0/B" }
  - { section: Pad1, option: Square, value: "SDL-0/X" }
  - { section: Pad1, option: Triangle, value: "SDL-0/Y" }
  - { section: Pad1, option: DPadUp, value: "SDL-0/DPadUp" }
  - { section: Pad1, option: DPadDown, value: "SDL-0/DPadDown" }
  - { section: Pad1, option: DPadLeft, value: "SDL-0/DPadLeft" }
  - { section: Pad1, option: DPadRight, value: "SDL-0/DPadRight" }
  - { section: Pad1, option: L1, value: "SDL-0/LeftShoulder" }
  - { section: Pad1, option: R1, value: "SDL-0/RightShoulder" }
  - { section: Pad1, option: L2, value: "SDL-0/+LeftTrigger" }
  - { section: Pad1, option: R2, value: "SDL-0/+RightTrigger" }
  - { section: Pad1, option: L3, value: "SDL-0/LeftStick" }
  - { section: Pad1, option: R3, value: "SDL-0/RightStick" }
  - { section: Pad1, option: Select, value: "SDL-0/Back" }
  - { section: Pad1, option: Start, value: "SDL-0/Start" }
  - { section: Pad1, option: LUp, value: "SDL-0/-LeftY" }
  - { section: Pad1, option: LDown, value: "SDL-0/+LeftY" }
  - { section: Pad1, option: LLeft, value: "SDL-0/-LeftX" }
  - { section: Pad1, option: LRight, value: "SDL-0/+LeftX" }
  - { section: Pad1, option: RUp, value: "SDL-0/-RightY" }
  - { section: Pad1, option: RDown, value: "SDL-0/+RightY" }
  - { section: Pad1, option: RLeft, value: "SDL-0/-RightX" }
  - { section: Pad1, option: RRight, value: "SDL-0/+RightX" }

dg_duckstation_ini: "{{ dg_box_home }}/.config/duckstation/settings.ini"
# Global DuckStation defaults applied to every PS1 game. Per-game
# overrides live in dg_duckstation_per_game_settings below.
# Research: projectcerbera.com/gt/2/duckstation/ (2025-11-07 update),
# wornoutwill.com "Best DuckStation Settings for PS1 Emulation"
# (2026-03-13), pulsegeek.com texture-filtering & upscaling articles
# (2026-03-05), DuckStation wiki.
dg_duckstation_settings:
  - { section: Main, option: ConfirmPowerOff,   value: "false" }
  - { section: Main, option: SaveStateOnExit,   value: "true" }
  - { section: Main, option: StartFullscreen,   value: "true" }
  - { section: Main, option: StartupFastBoot,   value: "true" }
  - { section: Main, option: CreateSaveStateBackups, value: "false" }
  - { section: BIOS, option: SearchDirectory,   value: "{{ dg_bios_root }}" }
  - { section: BIOS, option: PatchFastBoot,     value: "true" }

  # GPU — 9x Vulkan (240p modes x9 = 2160, EXACTLY the 4K panel's height, so
  # the final display scale is 1:1 vertically), with nearest-neighbor texture
  # filtering. The user wants retro-crisp pixels, not smoothing — Bilinear
  # (DuckStation default) washes out PS1 detail and JINC2 still smooths;
  # Nearest keeps textures pixel-sharp. SpriteTextureFilter mirrors it for
  # UI/HUD. Per-game inis under gamesettings/ OVERRIDE these — a global change
  # in the GUI has no effect on games with a per-game profile (GT2 has one).
  - { section: GPU, option: Renderer,            value: Vulkan }
  - { section: GPU, option: ResolutionScale,     value: "9" }
  - { section: GPU, option: TextureFilter,       value: "Nearest" }
  - { section: GPU, option: SpriteTextureFilter, value: "Nearest" }
  - { section: GPU, option: Multisamples,        value: "4" }   # 4x MSAA free on the RTX 5090
  - { section: GPU, option: PerSampleShading,    value: "false" }
  - { section: GPU, option: TrueColor,           value: "true" }   # 24-bit output
  - { section: GPU, option: ScaledDithering,     value: "true" }   # keep dither alongside TrueColor
  - { section: GPU, option: DisableInterlacing,  value: "true" }   # progressive output everywhere
  - { section: GPU, option: ForceNTSCTimings,    value: "false" }
  - { section: GPU, option: PGXPEnable,          value: "true" }
  - { section: GPU, option: PGXPCulling,         value: "true" }
  - { section: GPU, option: PGXPTextureCorrection, value: "true" }
  - { section: GPU, option: PGXPDepthBuffer,     value: "true" }
  - { section: GPU, option: PGXPPreserveProjFP,  value: "true" }
  - { section: GPU, option: PGXPVertexCache,     value: "false" }
  - { section: GPU, option: PGXPCPU,             value: "false" }
  - { section: GPU, option: WidescreenHack,      value: "true" }
  # Load the game disc image into RAM once on boot so stage loads are
  # instant instead of hitting NFS/disk per-sector. Gran Turismo 1 and 2
  # benefit dramatically here (garage / menu transitions). 700 MB peak
  # per CHD, trivial on modern RAM.
  - { section: CDROM, option: LoadImageToRAM,    value: "true" }
  - { section: CDROM, option: ReadThread,        value: "true" }
  - { section: CDROM, option: ReadSpeedup,       value: "4" }      # 4x CD read (no physics-sync games in our library need 1x)
  - { section: CDROM, option: SeekSpeedup,       value: "4" }

  # Display
  - { section: Display, option: VSync,              value: "true" }
  - { section: Display, option: OptimalFramePacing, value: "true" }
  # Sharp-bilinear final upscale: crisp pixels on non-integer stretches
  # (e.g. widescreen content), none of BilinearSmooth's haze.
  - { section: Display, option: Scaling,            value: "BilinearSharp" }

  # Memory cards: PerGameTitle creates a separate pair of virtual memory
  # cards per game title, so GT1 saves don't share a card with GT2 etc.
  # ShowMemoryCardsInMenu puts them in the right-click game menu.
  - { section: MemoryCards, option: Card1Type, value: "PerGameTitle" }
  - { section: MemoryCards, option: Card2Type, value: "None" }

  # Auto-load per-game cheat files from ~/.config/duckstation/cheats/.
  # We deploy them via dg_duckstation_cheats below; AutoLoadCheats lets
  # DuckStation apply the enabled ones without a GUI toggle per launch.
  - { section: Main, option: AutoLoadCheats, value: "true" }

  # Texture replacement system — enable globally so the per-game dumps
  # users create go to the right place. PreloadTextures loads them
  # once at game boot into VRAM, much faster than on-demand.
  - { section: TextureReplacements, option: EnableTextureReplacements, value: "true" }
  - { section: TextureReplacements, option: PreloadTextures,           value: "true" }

  # Hacks — MaxVRAMWriteSplits 1024 is required for the Gran Turismo
  # family (DuckStation wiki). Harmless on other games.
  - { section: Hacks, option: MaxVRAMWriteSplits, value: "1024" }

# Per-game DuckStation overrides written to
#   ~/.config/duckstation/gamesettings/<SERIAL>.ini
# DuckStation loads these on top of the global settings.ini when the
# running disc's serial matches the filename. Useful for per-game
# renderer/PGXP tradeoffs that shouldn't apply globally.
dg_duckstation_per_game_settings:
  # Gran Turismo 2 (Silent's v1.2 patch). Serials per redump: SCUS-94488 =
  # SIMULATION disc (GT Mode — the one the user plays most), SCUS-94455 =
  # ARCADE disc. (This file had them swapped until 2026-09-28.)
  # Research: https://projectcerbera.com/gt/2/duckstation/ (updated 2025-11-07)
  # + https://silentsblog.com/mods/gran-turismo-2/ + DuckStation wiki
  # texture-replacement docs. Texture filtering: Nearest on both texture and
  # sprite paths — the user's stated preference is retro-crisp pixels, and
  # these per-game files are why changing the GLOBAL filter in the GUI had no
  # effect on GT2 (per-game wins over global).
  - serial: SCUS-94455
    name: "Gran Turismo 2 (Arcade)"
    settings:
      # Texture filter — the user's specific fix: nearest neighbor, no blur
      - { section: GPU, option: TextureFilter,       value: "Nearest" }
      - { section: GPU, option: SpriteTextureFilter, value: "Nearest" }
      # GT2-specific PGXP: depth-buffer breaks GT2's skybox/road;
      # PreserveProjFP causes gaps in road LOD. Both OFF for GT2
      # even though the global defaults turn them on for other PS1 games.
      - { section: GPU, option: PGXPDepthBuffer,        value: "false" }
      - { section: GPU, option: PGXPPreserveProjFP,     value: "false" }
      - { section: GPU, option: PGXPCulling,            value: "true" }
      - { section: GPU, option: PGXPTextureCorrection,  value: "true" }
      # Built-in WidescreenHack stretches HUD/menus. Silent's 16:9
      # Widescreen 2.0 cheat patches the viewport correctly; disable
      # the DuckStation-side hack and let the user enable the cheat
      # per-session via the cheat manager.
      - { section: GPU, option: WidescreenHack,      value: "false" }
      # 8x MSAA + per-sample shading are free on the RTX 5090 and clean up
      # car edges + alpha-tested textures (fences, trees)
      - { section: GPU, option: Multisamples,        value: "8" }
      - { section: GPU, option: PerSampleShading,    value: "true" }
      # TrueColor + ScaledDithering ON together: Cerbera's 2025
      # recalibration — 24-bit output but keep dithering on because
      # GT2's sky gradients rely on it.
      - { section: GPU, option: TrueColor,           value: "true" }
      - { section: GPU, option: ScaledDithering,     value: "true" }
      - { section: GPU, option: DisableInterlacing,  value: "true" }
      # Bumps PS1 RAM from 2 MB to 8 MB. Pair with Silent's
      # "Use 8 MB RAM for polygon buffers" cheat for full-LOD AI
      # cars with no pop-in.
      - { section: Console, option: EnableRAM8MB,    value: "true" }
      # Texture-replacement system: dumps go to textures/SCUS-94455/.
      # No community retexture pack is published for GT2 as of April
      # 2026 — enabling this now so the user can drop hash-named PNGs
      # later without re-deploying. MaxVRAMWriteSplits=1024 is the
      # DuckStation wiki recommendation for Gran Turismo family games.
      - { section: TextureReplacements, option: EnableTextureReplacements, value: "true" }
      - { section: TextureReplacements, option: PreloadTextures,           value: "true" }
      - { section: Hacks, option: MaxVRAMWriteSplits,                      value: "1024" }
      # Aspect ratio — with WidescreenHack off and Silent's cheat on,
      # this is the right final output shape.
      - { section: Display, option: AspectRatio,     value: "16:9" }

  - serial: SCUS-94488
    name: "Gran Turismo 2 (Simulation)"
    settings:
      - { section: GPU, option: TextureFilter,       value: "Nearest" }
      - { section: GPU, option: SpriteTextureFilter, value: "Nearest" }
      - { section: GPU, option: PGXPDepthBuffer,        value: "false" }
      - { section: GPU, option: PGXPPreserveProjFP,     value: "false" }
      - { section: GPU, option: PGXPCulling,            value: "true" }
      - { section: GPU, option: PGXPTextureCorrection,  value: "true" }
      - { section: GPU, option: WidescreenHack,      value: "false" }
      - { section: GPU, option: Multisamples,        value: "8" }
      - { section: GPU, option: PerSampleShading,    value: "true" }
      - { section: GPU, option: TrueColor,           value: "true" }
      - { section: GPU, option: ScaledDithering,     value: "true" }
      - { section: GPU, option: DisableInterlacing,  value: "true" }
      - { section: Console, option: EnableRAM8MB,    value: "true" }
      - { section: TextureReplacements, option: EnableTextureReplacements, value: "true" }
      - { section: TextureReplacements, option: PreloadTextures,           value: "true" }
      - { section: Hacks, option: MaxVRAMWriteSplits,                      value: "1024" }
      - { section: Display, option: AspectRatio,     value: "16:9" }

  # Gran Turismo 1 USA Rev 1 — SCUS-94194 (per the disc itself + gamedb;
  # this seed used to target SCUS-94949, a serial that does not exist, so
  # the GT1 profile silently never applied until 2026-09-28). Same filter
  # upgrade and identical PGXP tradeoffs as GT2; fewer hacks needed.
  # Widescreen relies on DuckStation's built-in WidescreenHack because no
  # community cheat pnach ships for GT1 (libretro DB, Silent's and
  # AeroWidescreen's repos all lack a GT1 widescreen — only 60fps
  # cheats). The built-in hack patches the projection matrix at render
  # time (not a display-level stretch), so 3D geometry renders 16:9;
  # HUD may show minor aliasing at high resolution scales.
  - serial: SCUS-94194
    name: "Gran Turismo"
    settings:
      - { section: GPU, option: TextureFilter,          value: "Nearest" }
      - { section: GPU, option: SpriteTextureFilter,    value: "Nearest" }
      - { section: GPU, option: PGXPDepthBuffer,        value: "false" }
      - { section: GPU, option: PGXPPreserveProjFP,     value: "false" }
      - { section: GPU, option: PGXPCulling,            value: "true" }
      - { section: GPU, option: PGXPTextureCorrection,  value: "true" }
      - { section: GPU, option: WidescreenHack,      value: "true" }    # no GT1 cheat exists — use built-in
      - { section: GPU, option: Multisamples,        value: "8" }
      - { section: GPU, option: PerSampleShading,    value: "true" }
      - { section: GPU, option: TrueColor,           value: "true" }
      - { section: GPU, option: ScaledDithering,     value: "true" }
      - { section: GPU, option: DisableInterlacing,  value: "true" }
      - { section: TextureReplacements, option: EnableTextureReplacements, value: "true" }
      - { section: TextureReplacements, option: PreloadTextures,           value: "true" }
      - { section: Hacks, option: MaxVRAMWriteSplits,                      value: "1024" }
      - { section: Display, option: AspectRatio,     value: "16:9" }

  # Ridge Racer Type 4 (USA, SLUS-00797) — AEONG_AEONG's 60 FPS + 16:9 pack
  # (gbatemp thread 684958, October 2026). The patch frees frame budget by
  # running the game's own 60 Hz logic pass every vsync, and it redraws the UI
  # and FOV for 16:9 itself — so the emulator-side widescreen hack must stay
  # OFF, otherwise the two fight and the HUD warps. The CPU-speed bump is the
  # author's requirement (the patched code assumes 3x host speed to hit the
  # frame budget); PGXP stays on, which the author notes reduces background
  # distortion.
  - serial: SLUS-00797
    name: "Ridge Racer Type 4"
    settings:
      - { section: Console, option: CPUOverclockEnable,      value: "true" }
      - { section: Console, option: CPUOverclockNumerator,   value: "3" }
      - { section: Console, option: CPUOverclockDenominator, value: "1" }
      - { section: Display, option: AspectRatio,             value: "16:9" }
      - { section: GPU, option: WidescreenHack,              value: "false" }
      - { section: GPU, option: PGXPEnable,                  value: "true" }
      - { section: GPU, option: PGXPCulling,                 value: "true" }
      - { section: GPU, option: PGXPTextureCorrection,       value: "true" }
      - { section: GPU, option: PGXPPreserveProjFP,          value: "true" }
      - { section: GPU, option: PGXPDepthBuffer,             value: "true" }
      - { section: GPU, option: Multisamples,                value: "8" }
      - { section: GPU, option: PerSampleShading,            value: "true" }
      - { section: GPU, option: TrueColor,                   value: "true" }
      - { section: GPU, option: ScaledDithering,             value: "true" }
      - { section: GPU, option: DisableInterlacing,          value: "true" }
      - { section: TextureReplacements, option: EnableTextureReplacements, value: "true" }
      - { section: TextureReplacements, option: PreloadTextures,           value: "true" }

# Per-game DuckStation cheat deployments. Two shapes:
#  - source + enable_ids: copies a .cht file (libretro format) from
#    staging, renames it to <SERIAL>.cht inside DuckStation's cheats dir,
#    and flips the given cheat IDs from enable=false to enable=true.
#    INERT on current DuckStation: the boot-time parser (ParseFile in
#    src/core/cheats.cpp) only understands the native [Name]-section
#    format — libretro cheatN_ files produce "Unknown parameter"
#    warnings and contribute ZERO codes at boot. Do not add new entries
#    in this shape; use tag+content below.
#  - tag + content + enable_names: writes the inline DuckStation-native
#    cheat text to cheats/<serial>_<tag>.cht (the loader glob-matches
#    <serial>*.cht) and activates the named cheats via the per-game
#    gamesettings ini ([Cheats] EnableCheats=true + repeated Enable lines)
#    — the only mechanism current DuckStation honors at boot (verified
#    against src/core/cheats.cpp: ReloadEnabledLists reads [Cheats]
#    Enable from the game settings layer only; EnablePatches matches
#    names exactly).
dg_duckstation_cheats:
  # Ridge Racer Type 4 (USA, SLUS-00797) — AEONG_AEONG's GameShark pack,
  # stored as a file (9k guarded write lines) rather than inline:
  #   files/duckstation/SLUS-00797_rrt4.cht
  # Sections: [60 FPS patch] (needs CPU speed 300%, set above),
  # [16:9 Widescreen patch] (needs the emulator hack off, set above),
  # [16:9 FMV] (opening movie), [CPU Marker] (opponent dots on the minimap —
  # gameplay-affecting, deliberately left OFF; enable it in the cheat manager).
  - serial: SLUS-00797
    tag: rrt4
    source: "{{ dg_project_root }}/ansible/roles/seed_configs/files/duckstation/SLUS-00797_rrt4.cht"
    enable_names:
      - 60 FPS patch
      - 16:9 Widescreen patch
      - 16:9 FMV
  # GT2 (Silent's-patched v1.2 ISOs the user runs; SCUS-94455 = Arcade
  # disc, SCUS-94488 = Simulation disc per redump — same pack applies to
  # both). All of Silent's GT2 improvements verbatim from
  # github.com/CookiePLMonster/Console-Cheat-Codes (PS1/Gran Turismo 2/
  # {16x9 Widescreen,60 FPS,8MB RAM,Full detail AI cars,Higher draw
  # distance} — NTSC-U 1.2 files), merged into one native-format file
  # (the libretro pack previously deployed as <serial>.cht was never
  # parsed at boot — see above — so GT2's widescreen was silently
  # inactive until 2026-10-01).
  # The game renders 4:3 geometry natively; without the widescreen cheat,
  # `AspectRatio = 16:9` would just stretch the output.
  # 60 FPS WARNING per Silent: existing replays and rally-mode AI ghosts
  # break at 60 FPS. Full detail AI cars requires both the 8MB cheat and
  # Console.EnableRAM8MB=true (set in dg_duckstation_per_game_settings).
  # NOTE: the DuckStation GUI's [Patches] Enable list (60 FPS, Metric
  # units, Widescreen 16:9, Use 8MB RAM) is inert on this install —
  # patches.zip is not bundled with the Arch package, so no game patches
  # ever load; the dead [Patches] section was removed from SCUS-94455.ini
  # on 2026-10-01 (it also shadowed the identical 'Enable = 60 FPS' line
  # from lineinfile's whole-file regexp).
  - serial: SCUS-94455
    tag: silent
    content: &gt2_silent_content |
      ; Gran Turismo 2 (USA v1.2) — Silent's improvement pack.
      ; Source: github.com/CookiePLMonster/Console-Cheat-Codes,
      ; PS1/Gran Turismo 2/{16x9 Widescreen,60 FPS,8MB RAM,
      ; Full detail AI cars,Higher draw distance}/NTSC-U 1.2*.cht
      [16:9 Widescreen]
      Type = Gameshark
      Activation = EndFrame
      A40529DC 801EFB39
      8005D5DC 0000
