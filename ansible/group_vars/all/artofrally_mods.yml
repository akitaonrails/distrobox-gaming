# Art of Rally mod set (opt-in role install_artofrally_mods). Generated via the
# nexus-mod-set skill. See docs/nexusmods.md. Run with
# ansible/install-artofrally-mods.yml or `site.yml --tags artofrally_mods`.
#
# Art of Rally mods are Unity Mod Manager (UMM) code mods. UMM is installed via
# its DoorstopProxy method (a winhttp.dll shim). UMM/Doorstop is a Windows
# mechanism, so Art of Rally must run under PROTON (native-Linux Doorstop is
# untested by the mod authors). This role deploys UMM headlessly ("option A" —
# the Doorstop config is reproduced, not generated by UMM's own installer, so
# VERIFY in-game with Ctrl+F10; fallback = run UnityModManager.exe under Proton
# once). Mods land in <game>/Mods/<Id>/.

dg_artofrally_appid: "550320"

# Steam library holding Art of Rally. It is on the external USB library here;
# set dg_external_usb_games_root (host_vars) to that drive, or override this.
dg_artofrally_steam_library_root: >-
  {{ dg_external_usb_games_root if (dg_external_usb_games_root | length > 0)
     else dg_box_home + '/.local/share/Steam' }}
dg_artofrally_game_dir: "{{ dg_artofrally_steam_library_root }}/steamapps/common/artofrally"

# In-box Steam root (userdata → launch options).
dg_artofrally_steam_root: "{{ dg_box_home }}/.local/share/Steam"

dg_artofrally_staging_root: "{{ dg_roms_final_root }}/PC/NexusMods/artofrally"

# Unity Mod Manager (Nexus "site" mod 21). Pinned to the current MAIN build.
dg_artofrally_umm_mod: "21"
dg_artofrally_umm_file: "8701"          # v0.32.5a
dg_artofrally_umm_dir: "00-unity-mod-manager"
# Runtime DLLs copied from the UMM installer package into <game>/UnityModManager/.
dg_artofrally_umm_runtime:
  - UnityModManager.dll
  - 0Harmony.dll
  - dnlib.dll
  - Newtonsoft.Json.dll
  - Ionic.Zip.dll
  - System.Xml.dll
  - UnityModManagerConfig.xml

# Doorstop config written into the game root (targets the UMM runtime dll).
# UnityDoorstop [General] format. If UMM does not appear (Ctrl+F10), run UMM's
# own installer under Proton once to write the correct config.
dg_artofrally_doorstop_config: |
  [General]
  enabled=true
  target_assembly=UnityModManager\UnityModManager.dll
  redirect_output_log=false
  ignore_disable_switch=false
  [UnityMono]
  dll_search_path_override=
  debug_enabled=false

# Proton must load UMM's native winhttp.dll shim.
dg_artofrally_launch_options: 'WINEDLLOVERRIDES="winhttp=n,b" %command%'
dg_artofrally_steam_localconfig: ""
dg_artofrally_stop_steam: false

# Ordered mod catalog. `dest` = where the extracted archive contents go, under
# the game dir. UMM reads <game>/Mods/<Id>/Info.json. Mods folder-wrapped by
# their own <Id>/ extract into Mods/; the flat one (CameraMod) extracts into
# Mods/CameraMod/. Target game build: Art of Rally v1.5.5. No ReShade; no
# inter-mod conflicts (FASTER pairs with Camera Mod).
dg_artofrally_mods:
  - id: "1"
    name: "Camera Mod"
    url: "https://www.nexusmods.com/artofrally/mods/1"
    dir: "1-camera-mod"
    dest: "Mods/CameraMod/"
  - id: "10"
    name: "Real car names"
    url: "https://www.nexusmods.com/artofrally/mods/10"
    dir: "10-real-car-names"
    dest: "Mods/"
  - id: "15"
    name: "FASTER"
    url: "https://www.nexusmods.com/artofrally/mods/15"
    dir: "15-faster"
    dest: "Mods/"
  - id: "4"
    name: "era sponsorship"
    url: "https://www.nexusmods.com/artofrally/mods/4"
    dir: "4-era-sponsorship"
    dest: "Mods/"

dg_artofrally_revert: false
