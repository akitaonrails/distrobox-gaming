---
# Dead or Alive 2 Ultimate — Moonalesca's fork of NoRain211/doa2u-re, a static
# recompilation of the Xbox DOA2U executable with a hand-written runtime.
# Linux renders through SDL_GPU/Vulkan. The fork's release ZIP is Windows-only,
# so the role builds the Linux runner from the pinned tag and submodule. The
# game itself is lifted from the user's own Disc 2 ISO (hash-verified; other
# regions/versions/Disc 1 refused) and compiled in place.
# See docs/doa2u-re.md.

dg_doa2u_repo: Moonalesca/doa2u-re
dg_doa2u_version: 0.3.2-Alpha-Moonalesca.1
dg_doa2u_commit: b1cb8e55b67d3582e247ed3b7a5549040422ed24
dg_doa2u_repo_url: "https://github.com/{{ dg_doa2u_repo }}.git"
# tools/xboxrecomp is a submodule pinned by the release tag.
dg_doa2u_lifter_commit: 6d3b8ec99f5d411dc972f5d11de060a8d9085182

# Dead or Alive Ultimate (Xbox, USA) Disc 2 — the DOA2U disc. The build
# verifies the executable's SHA-256 and refuses anything else.
dg_doa2u_iso: "{{ dg_rom_heavy_root }}/xbox/Dead or Alive 2 Ultimate (USA, Japan) (En,Ja).iso"

dg_doa2u_install_dir: "{{ dg_box_home }}/tools/doa2u"
dg_doa2u_release_dir: "{{ dg_doa2u_install_dir }}/releases/{{ dg_doa2u_version }}"
dg_doa2u_app_dir: "{{ dg_doa2u_release_dir }}/DOA2U-{{ dg_doa2u_version }}"
dg_doa2u_launcher: "{{ dg_box_home }}/bin/doa2u-re"
dg_doa2u_prune_old: true

# The lifter needs capstone 5.0.7 + Pillow in its venv; the runner needs
# shaderc at runtime (Vulkan shaders compile on the fly). The rest is the
# documented Linux build chain (extract-xiso is present in the box, with the
# build's pinned download as fallback).
dg_doa2u_packages:
  - shaderc
  - cmake
  - ninja
  - clang
  - python
  - git
  - sdl3

# Baseline launcher choices (private/launcher.json): 4K, game's own 16:9
# widescreen, MSAA 8 (SDL_GPU/Linux ceiling; higher falls back), SMAA, all
# unlocks, dynamic KO replay. Hit voices stay off until the user imports
# their own DOA4 snd.afs. The port reads the key `height`, not `resolution`
# (run_game.saved_settings). Applied only when the file is absent.
dg_doa2u_launcher_json: |
  {
    "height": 2160,
    "msaa": 8,
    "smaa": true,
    "widescreen": true,
    "screen": "16:9",
    "skipIntro": false,
    "checkUpdates": false,
    "unlockAll": true,
    "surround": false,
    "freeCamera": false,
    "randomCpuCostumes": false,
    "hitVoices": false,
    "hitVoiceVolume": "normal",
    "koReplay": "dynamic"
  }