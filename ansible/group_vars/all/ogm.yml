  # ── Fan games / fan remakes ──────────────────────────────────────
  - desktop_id: gaming-smb-remastered
    id: smb-remastered
    category: fangame
    sgdb_query: "Super Mario Bros."
    github: "{{ dg_smb_remastered_repo }}"
  - desktop_id: gaming-smw-remastered
    id: smw-remastered
    category: fangame
    sgdb_query: "Super Mario World"
    github: "{{ dg_smw_remastered_repo }}"
  # itch.io / GameJolt / blog-distributed fan games — no GitHub repo recorded
  # anywhere in the repo, so no github key. web_url gives ogm web-page update
  # polling instead (fingerprint mode unless an update_regex is verified).
  # itch upload titles carry the version; verified against the live page
  # 2026-09-23 (captures 1.00.92 from "MMX Regenesis 1.00.92 Linux.x86_64").
  - { desktop_id: gaming-mmx-regenesis, id: mmx-regenesis, category: fangame,
      sgdb_query: "Mega Man X",
      web_url: "https://mmxregenesis.itch.io/mega-man-x-regenesis",
      update_regex: "MMX Regenesis ([0-9]+([.][0-9]+)+) Linux" }
  # DKLR is Google Drive-only (kasquez) — no pollable project page, so no
  # web_url (a Drive page fingerprint changes per session = false badges).
  - { desktop_id: gaming-dklr, id: dklr, category: fangame,
      sgdb_query: "Donkey Kong Land" }
  # GameJolt page is a JS app shell — fingerprint mode (no version in raw HTML).
  - { desktop_id: gaming-project-reignition, id: project-reignition, category: fangame,
      sgdb_query: "Sonic and the Secret Rings",
      web_url: "https://gamejolt.com/games/project_reignition/1082591" }
  # P-06 is distributed via ChaosX's YouTube video descriptions (MediaFire) —
  # no pollable project page, so no web_url.
  - { desktop_id: gaming-sonic-p06, id: sonic-p06, category: fangame,
      sgdb_query: "Sonic the Hedgehog (2006)" }
  # Blogspot homepage: new release = new post = fingerprint change. No version
  # string in the raw HTML (widget-rendered), so no regex.
  - { desktop_id: gaming-sonic-sms-remake, id: sonic-sms-remake, category: fangame,
      sgdb_query: "Sonic the Hedgehog (8-bit)",
      web_url: "https://sonic-sms-remake.blogspot.com/" }
  # itch page; upload filename has no version — fingerprint mode.
  - { desktop_id: gaming-openbor-sor-troubles-in-japan, id: openbor-sor-troubles-in-japan,
      category: fangame, sgdb_query: "Streets of Rage",
      web_url: "https://berlioz91.itch.io/streets-of-rage-troubles-in-japan" }
  # v5.2 is the final/abandoned Bombergames release — informational link only;
  # the archive.org page is static, so polling it never badges.
  - { desktop_id: streets-of-rage-remake, id: streets-of-rage-remake, category: fangame,
      sgdb_query: "Streets of Rage Remake",
      web_url: "https://archive.org/details/sorrv-52-rev-550_202401" }

