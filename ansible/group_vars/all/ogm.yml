    github: "{{ dg_ge64_repo | regex_replace('^https://(api\\.)?github\\.com/(repos/)?([^/]+/[^/]+?)(\\.git)?(/.*)?$', '\\3') }}"
  - desktop_id: gaming-mph-recomp
