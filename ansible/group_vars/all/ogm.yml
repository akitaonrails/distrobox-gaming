    name: "{{ dg_pc_racing_games | selectattr('slug', 'eq', 'outrun-2006') | map(attribute='name') | first }}"
    category: wine
    sgdb_query: "OutRun 2006: Coast 2 Coast"
    # The game is retail (no updates), but the installer layers emoose's
    # OutRun2006Tweaks on top — badge on the tweak pack's GitHub releases.
    github: "emoose/OutRun2006Tweaks"
  - desktop_id: pc-prince-of-persia-sot
    id: prince-of-persia-sot
    name: "{{ dg_pc_racing_games | selectattr('slug', 'eq', 'prince-of-persia-sot') | map(attribute='name') | first }}"
    category: wine
    sgdb_query: "Prince of Persia: The Sands of Time"
  - desktop_id: pc-richard-burns-rally
    id: richard-burns-rally
    name: "{{ dg_pc_racing_games | selectattr('slug', 'eq', 'richard-burns-rally') | map(attribute='name') | first }}"
    category: wine
    sgdb_query: "Richard Burns Rally"
    # RSF (rallysimfans.hu) updates frequently; the page links the current
