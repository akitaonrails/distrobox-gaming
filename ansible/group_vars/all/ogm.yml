    category: port
    sgdb_query: "Dusk"
    github: "{{ dg_dusk_release_api | regex_replace('^https://(api\\.)?github\\.com/(repos/)?([^/]+/[^/]+?)(\\.git)?(/.*)?$', '\\3') }}"
