---
# ogm (omarchy-games-menu) integration — a host-side game launcher that builds
# its collection from the desktop entries this repo exports. Primary discovery
# is the X-OGM-* keys embedded in the rendered .desktop files (see
# docs/ogm-launcher.md); the ogm_catalog role renders the same data to a
# catalog.d fallback fragment.
#
# Why a separate list instead of ogm_* fields on the existing launcher data:
# the launchers ogm consumes are spread across several data structures —
# dg_emulator_launchers (launchers.yml), dg_pc_racing_games (pc_racing.yml),
# dg_screamer_games (screamer.yml), dg_dkc_games (dkc_recomp.yml) — plus
# one-off templates in roles/desktop_apps/templates/. Threading ogm_* keys
# through all of them would duplicate the same concern across six-plus files;
# one list keyed by desktop stem keeps the ogm contract in a single place and
# references the existing dg_* vars for values (GitHub repos especially)
# instead of restating them.
#
# dg_ogm_games fields (desktop_id / id / category required):
#   desktop_id   desktop file stem in ~/.local/share/applications (no .desktop)
#   id           ogm slug (desktop stem minus the gaming-/pc- prefix)
#   name         optional display-name override; set only where the repo
#                already tracks a clean title (dg_*_games name fields) and the
#                rendered desktop Name= carries a "(on gaming)"-style suffix
#   category     port|decomp|recomp|fangame|wine|arcade|emulator|tool|custom
#   github       owner/repo — ALWAYS derived from an existing dg_* var (the
#                regex below strips any github.com URL form down to
#                owner/repo); never a value invented in this file
#   sgdb_query   SteamGridDB search name for cover art — the ORIGINAL game's
#                canonical title (a recomp/port/fan game shows the source
#                game's art). Set on real games only; emulators and tools are
#                not in SteamGridDB, so they get ogm's placeholder cards.
#   managed      set false for the explicit opt-out — emits X-OGM-Managed=false
#                so ogm excludes the entry even if its legacy filename glob
#                matches (e.g. gaming-steam). Omit for normal entries.
#   web_url      canonical project/download page (X-OGM-WebURL) — for games
#                with NO github key, so ogm can poll the page for update
#                badges (baseline fingerprint first, badge on change). Do NOT
#                set on github-backed games: the GitHub Releases API already
#                covers their update signal and UpdateURL defaults to WebURL,
#                so they'd be polled twice.
#   update_url   page to poll (X-OGM-UpdateURL) — omit to poll web_url.
#   update_regex Rust regex, capture group 1 = version string on the raw HTML
#                page (X-OGM-UpdateRegex). Only after verifying against the
#                live page (curl | grep -oP). No backslashes — desktop-entry
#                values treat '\' as an escape. Without it ogm falls back to
#                ETag/content-hash fingerprinting (badge without version text).
#                Prefer no regex over a brittle one on JS-heavy pages.

dg_ogm_enabled: true
dg_ogm_catalog_path: "{{ ansible_env.HOME }}/.config/ogm/catalog.d/distrobox-gaming.toml"

dg_ogm_games:
  # ── Emulator apps ────────────────────────────────────────────────
  - { desktop_id: gaming-es-de, id: es-de, category: tool }
  - { desktop_id: gaming-dolphin, id: dolphin, category: emulator }
  - { desktop_id: gaming-duckstation, id: duckstation, category: emulator }
  - { desktop_id: gaming-pcsx2, id: pcsx2, category: emulator }
  - { desktop_id: gaming-melonds, id: melonds, category: emulator }
  - { desktop_id: gaming-ppsspp, id: ppsspp, category: emulator }
  - { desktop_id: gaming-rpcs3, id: rpcs3, category: emulator }
  - { desktop_id: gaming-xemu, id: xemu, category: emulator }
  - { desktop_id: gaming-eden, id: eden, category: emulator }
  - { desktop_id: gaming-cemu, id: cemu, category: emulator }
  - { desktop_id: gaming-vita3k, id: vita3k, category: emulator }
  - { desktop_id: gaming-retroarch, id: retroarch, category: emulator }
  - { desktop_id: gaming-flycast, id: flycast, category: emulator }
  # azahar.yml header records the upstream in a comment, not a dg_* var.
  - { desktop_id: gaming-azahar, id: azahar, category: emulator,
      github: "azahar-emu/azahar" }
  - desktop_id: gaming-shadps4-gui
    id: shadps4-gui
    category: emulator
    github: "{{ dg_shadps4_qtlauncher_releases_api | regex_replace('^https://(api\\.)?github\\.com/(repos/)?([^/]+/[^/]+?)(\\.git)?(/.*)?$', '\\3') }}"

  # ── Steam ────────────────────────────────────────────────────────
  # Deliberately excluded from the menu: managed=false is the explicit opt-out
  # (emits X-OGM-Managed=false), so ogm skips it even though its legacy glob
  # would otherwise match. No category/github/cover.
  - { desktop_id: gaming-steam, id: steam, managed: false }

  # ── Companion tools ──────────────────────────────────────────────
  - desktop_id: gaming-xenia-manager
    id: xenia-manager
    category: tool
    github: "{{ dg_xenia_manager_release_api | regex_replace('^https://(api\\.)?github\\.com/(repos/)?([^/]+/[^/]+?)(\\.git)?(/.*)?$', '\\3') }}"
  - desktop_id: gaming-eden-cheats-manager
    id: eden-cheats-manager
    category: tool
