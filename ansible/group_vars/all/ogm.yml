    category: tool
    github: "{{ dg_7th_heaven_release_url | regex_replace('^https://(api\\.)?github\\.com/(repos/)?([^/]+/[^/]+?)(\\.git)?(/.*)?$', '\\3') }}"
  # Launches FFVII classic through 7th Heaven (7th-heaven launch-game boots the
  # game, not the manager GUI) — a Wine game, not a tool.
  - desktop_id: gaming-ffvii-7th-heaven
    id: ffvii-7th-heaven
