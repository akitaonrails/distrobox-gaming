    sgdb_query: "Donkey Kong Country 2: Diddy's Kong Quest"
    github: "{{ dg_dkc_games | selectattr('key', 'eq', 'dkc2') | map(attribute='repo') | first | regex_replace('^https://(api\\.)?github\\.com/(repos/)?([^/]+/[^/]+?)(\\.git)?(/.*)?$', '\\3') }}"
  - desktop_id: gaming-dkc3-recomp
