---
# Forza Motorsport 4 — native PC port, 0herculabs/hl360-forza4 (ReXGlue).
# Superseded Alexbeav/fm4-recomp (2026-10-27): this one supports the USA Rev 1
# play disc, ships an SDL3/ImGui launcher (no WebView2), a Project Forza Plus 4
# integration, wheel FFB, and v0.3.9+ renders through Vulkan — which is what
# makes it viable under GE-Proton.
# See docs/fm4-hl360.md.

dg_hl360_repo: 0herculabs/hl360-forza4
dg_hl360_version: v0.3.9
dg_hl360_asset_name: "FM4-{{ dg_hl360_version }}-windows-x64.zip"
dg_hl360_asset_url: "https://github.com/{{ dg_hl360_repo }}/releases/download/{{ dg_hl360_version }}/{{ dg_hl360_asset_name }}"
dg_hl360_asset_sha256: 402c55a08f5880f636d5106945cf4bcea6a791231bef8bf74830d5434dec2ebc

# Supported inputs (upstream): Forza Motorsport 4 (USA) Rev 1, multilanguage
# Play Disc — title ID 4D530910, media ID 33E7B39F, XEX 0.0.0.14.
# The installer hashes the whole ISO; these are the exact development images.
# The supported USA Rev 1 set (redump 113180/113181) lives in its own folder.
dg_hl360_disc1: "{{ dg_roms_final_root }}/xbox360/x360-fm4-usa-rev-1/Forza Motorsport 4 (USA) (En,Ja,Fr,De,Es,It,Nl,Pt,Zh,Ko,Pl,Ru,Cs,Hu) (Disc 1) (Play Disc) (Rev 1)/Forza Motorsport 4 (USA) (En,Ja,Fr,De,Es,It,Nl,Pt,Zh,Ko,Pl,Ru,Cs,Hu) (Disc 1) (Play Disc) (Rev 1).iso"
dg_hl360_disc1_md5: "2470358250b8566bf5ddc3aaf1b76c68"
dg_hl360_disc2: "{{ dg_roms_final_root }}/xbox360/x360-fm4-usa-rev-1/Forza Motorsport 4 (USA) (En,Ja,Fr,De,Es,It,Nl,Pt,Zh,Ko,Pl,Ru,Cs,Hu) (Disc 2) (Content Install Disc) (Rev 1)/Forza Motorsport 4 (USA) (En,Ja,Fr,De,Es,It,Nl,Pt,Zh,Ko,Pl,Ru,Cs,Hu) (Disc 2) (Content Install Disc) (Rev 1).iso"
dg_hl360_disc2_md5: "9915d1adaabf3b58441651a70e5e8dbe"

dg_hl360_install_dir: "{{ dg_box_home }}/tools/hl360-fm4"
dg_hl360_release_dir: "{{ dg_hl360_install_dir }}/releases/{{ dg_hl360_version }}"
dg_hl360_app_dir: "{{ dg_hl360_release_dir }}/FM4"
dg_hl360_cache_dir: "{{ dg_box_home }}/cache/hl360-fm4"
dg_hl360_user_dir: "{{ dg_box_home }}/.local/share/hl360-fm4"
dg_hl360_launcher: "{{ dg_box_home }}/bin/fm4-port"

dg_hl360_proton: "{{ ansible_facts.env.HOME }}/.steam/steam/compatibilitytools.d/GE-Proton11-1/proton"
dg_hl360_steam_root: "{{ ansible_facts.env.HOME }}/.steam/steam"
dg_hl360_compatdata: "{{ dg_hl360_install_dir }}/.compatdata"

# Graphics/behaviour keys the role keeps on the validated baseline. Upstream's
# graphics troubleshooting doc is explicit that the async+none pair drops draws
# (roads, car thumbnails) and that `vsync` is the guest vblank pacing, not a
# presentation switch; anisotropic_override 5 was the launcher's own default.
# The guest video mode stays 720p: it is a request to the game, and a 4K value
# there gives a black screen with sound.
dg_hl360_settings:
  anisotropic_override: "16"
  async_shader_compilation: "false"
  readback_resolve: "'fast'"
  graphics_preset: "3"
  resolution_scale: "4"
  present_effect: "'fsr'"
  vsync: "true"
  host_present_fps_limit: "60"
  video_mode_width: "1280"
  video_mode_height: "720"

# fm4tool.exe (shipped in the player ZIP) is the disc/package tool; it is a
# Windows binary and only runs under the same Proton prefix as the game.
dg_hl360_tool: "{{ dg_hl360_app_dir }}/fm4tool.exe"

# The port stores Windows-style paths and sees the box filesystem as Z:.
# Both roots live in the versioned release dir next to the settings file, so a
# version bump has to re-point them (see install_hl360_fm4/tasks/main.yml).
# dg_hl360_bs is one backslash written in YAML only: Ansible's templater passes
# Jinja string escapes through untouched, so "\\" in a template would land in
# the settings file doubled.
dg_hl360_bs: '\'
dg_hl360_win_root: 'Z:{{ dg_hl360_app_dir | replace("/", dg_hl360_bs) }}'
dg_hl360_game_dir_win: '{{ dg_hl360_win_root }}{{ dg_hl360_bs }}game'
dg_hl360_user_dir_win: '{{ dg_hl360_win_root }}{{ dg_hl360_bs }}user'

# Local staging: the NAS mount is NFS, and reading a disc image straight off it
# silently truncated and case-mangled the extraction, so every ISO is copied
# here first and every fm4tool run reads only from local disk.
dg_hl360_disc1_staged: "{{ dg_hl360_cache_dir }}/fm4-disc1.iso"
dg_hl360_disc2_staged: "{{ dg_hl360_cache_dir }}/fm4-disc2.iso"
dg_hl360_disc2_extract: "{{ dg_hl360_install_dir }}/disc2"
dg_hl360_game_dir: "{{ dg_hl360_app_dir }}/game"

# The same paths as fm4tool.exe (a Windows binary) has to see them.
dg_hl360_disc1_win: 'Z:{{ dg_hl360_disc1_staged | replace("/", dg_hl360_bs) }}'
dg_hl360_disc2_win: 'Z:{{ dg_hl360_disc2_staged | replace("/", dg_hl360_bs) }}'
dg_hl360_disc2_extract_win: 'Z:{{ dg_hl360_disc2_extract | replace("/", dg_hl360_bs) }}'
