---
# Donkey Kong Country (GBA) SNES colour restoration — marc_max IPS hack v1.1.
# Repaletts the washed-out 2003 GBA port back toward the SNES original.
# Opt-in; see docs/dkc-gba-restoration.md.
dg_dkc_gba_revert: false

# Base ROM: the patch targets ONLY the EU multi-language dump. The USA dump
# (fcc62356…) does NOT match and will fail the strict hash check.
dg_dkc_gba_base_rom: "{{ dg_roms_final_root }}/gba/Donkey Kong Country (Europe) (En,Fr,De,Es,It).gba"
dg_dkc_gba_base_sha1: "8995f0be99a9cff66474a8975b8499bd69fb4c45"

# IPS patch, committed in the role's files/ directory.
dg_dkc_gba_ips: dkc_gba_restoration_v1_1.ips

# Patched output, dropped into the EmuDeck GBA library so ES-DE / RetroArch
# pick it up. Playable directly with the box's mGBA core (no soft-patch needed
# since this is already hard-patched).
dg_dkc_gba_out: "{{ dg_rom_root }}/gba/Donkey Kong Country (Europe) (SNES Restoration).gba"
dg_dkc_gba_out_sha1: "005b5571e169c45a0649fdb2cc52729f9d6b4116"
