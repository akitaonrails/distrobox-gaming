  # ---------------------------------------------------------------------
  # Atari. Three cores already in dg_retroarch_cores cover four ES-DE
  # systems: stella (2600), prosystem (7800), handy (Lynx) and atari800
  # (BOTH the 8-bit computer line and the 5200 console). retroarch_extras
  # had been downloading all of them since the core list was written, but
  # without these entries ES-DE never showed a system for them, so the
  # cores sat orphaned — only reachable by loading a ROM by hand from
  # RetroArch's own menu. See docs/atari.md.
  #
  # Atari ST is defined below with its own BIOS profile and mandatory
  # focused installation checks; see docs/atari-st.md.
  #
  # BIOS: none of these four need one. stella needs nothing, prosystem's
  # is optional, atari800 compiles in AltirraOS, and handy HLEs the Lynx
  # boot ROM when the file is absent. link_storage still symlinks the real
  # dumps out of dg_bios_root for whoever owns them
  # (dg_retroarch_system_bios).
  # ---------------------------------------------------------------------

  - name: atari2600
    fullname: Atari 2600
    path: "{{ dg_emudeck_root }}/roms/atari2600"
    extension: ".a26 .A26 .bin .BIN .rom .ROM .zip .ZIP .7z .7Z"
    commands:
      - { label: "Stella (RetroArch)", cmd: "%EMULATOR_RETROARCH% -L %CORE_RETROARCH%/stella_libretro.so %ROM%" }
    platform: atari2600
    theme: atari2600

  # The 5200 runs on the same atari800 core as the 8-bit computers below,
  # switched by the `atari800_system` core option — read at core init,
  # with no CLI flag to set it. The core auto-forces 5200 mode for a cart
  # it recognises (.a52, or .bin/.rom by CRC), but that force is one-way:
  # it never turns 5200 mode back OFF, so an .atr launched after a 5200
  # session boots as a 5200. bin/retroarch-atari800 rewrites the option
  # from the ROM's system dir before every launch to close that, the same
  # pre-launch enforcement the xemu wrapper uses for surface_scale.
  - name: atari5200
    fullname: Atari 5200
    path: "{{ dg_emudeck_root }}/roms/atari5200"
    extension: ".a52 .A52 .bin .BIN .car .CAR .rom .ROM .zip .ZIP .7z .7Z"
    commands:
      - { label: "Atari800 (RetroArch)", cmd: "{{ dg_box_home }}/bin/retroarch-atari800 %ROM%" }
    platform: atari5200
    theme: atari5200

  - name: atari7800
    fullname: Atari 7800 ProSystem
    path: "{{ dg_emudeck_root }}/roms/atari7800"
    extension: ".a78 .A78 .bin .BIN .zip .ZIP .7z .7Z"
    commands:
      - { label: "ProSystem (RetroArch)", cmd: "%EMULATOR_RETROARCH% -L %CORE_RETROARCH%/prosystem_libretro.so %ROM%" }
    platform: atari7800
    theme: atari7800

  - name: atarilynx
    fullname: Atari Lynx
    path: "{{ dg_emudeck_root }}/roms/atarilynx"
    extension: ".lnx .LNX .o .O .zip .ZIP .7z .7Z"
    commands:
      - { label: "Handy (RetroArch)", cmd: "%EMULATOR_RETROARCH% -L %CORE_RETROARCH%/handy_libretro.so %ROM%" }
    platform: atarilynx
    theme: atarilynx

  - name: atari800
    fullname: Atari 800
    path: "{{ dg_emudeck_root }}/roms/atari800"
    extension: ".atr .ATR .bas .BAS .bin .BIN .car .CAR .cas .CAS .dcm .DCM .xex .XEX .xfd .XFD .zip .ZIP .7z .7Z"
    commands:
      - { label: "Atari800 (RetroArch)", cmd: "{{ dg_box_home }}/bin/retroarch-atari800 %ROM%" }
    platform: atari800
    theme: atari800

  # Atari ST uses an isolated BIOS profile; see docs/atari-st.md.
  - name: atarist
    fullname: Atari ST
    path: "{{ dg_atari_st_rom_dir }}"
    extension: ".st .ST .stx .STX .msa .MSA .dim .DIM .ipf .IPF .zip .ZIP"
    commands:
      - label: "Hatari (RetroArch)"
        cmd: '%EMULATOR_RETROARCH% --appendconfig "{{ dg_atari_st_retroarch_config }}" -L "{{ dg_retroarch_dir }}/cores/hatari_libretro.so" %ROM%'
    platform: atarist
    theme: atarist

  # OpenBOR fan games as .pak files, run by the native OpenBOR 4.0 engine
  # wrapper (install_openbor). ES-DE's stock 'openbor' system expects one
  # AppImage per game; ours is pak-based. See docs/openbor.md.
  - name: openbor
    fullname: OpenBOR Game Engine
    path: "{{ dg_emudeck_root }}/roms_mid/openbor"
    extension: ".pak .PAK"
    commands:
      - { label: "OpenBOR (Standalone)", cmd: "{{ dg_box_home }}/bin/openbor %ROM%" }
    platform: openbor
    theme: openbor
