---
# Data-driven ROM romhack patcher (install_rom_patches). Each entry hard-patches
# a verified base ROM with a committed IPS patch and writes a finished ROM into
# a library the emulators already scan. The applier asserts the base sha1 before
# patching and the output sha1 after, so a wrong-region/revision base fails
# instead of producing a broken ROM. Opt-in; see docs/rom-patches.md.
#
# To add a hack: drop its .ips into roles/install_rom_patches/files/ and append
# an entry below (name, base, base_sha1, ips, out, out_sha1).
dg_rom_patches_revert: false

dg_rom_patches:
  # DKC GBA SNES colour restoration (marc_max v1.1). Targets ONLY the EU
  # multi-language dump; the USA dump does not match.
  - name: "Donkey Kong Country (GBA) SNES colour restoration"
    base: "{{ dg_roms_final_root }}/gba/Donkey Kong Country (Europe) (En,Fr,De,Es,It).gba"
    base_sha1: "8995f0be99a9cff66474a8975b8499bd69fb4c45"
    ips: dkc_gba_restoration_v1_1.ips
    out: "{{ dg_rom_root }}/gba/Donkey Kong Country (Europe) (SNES Restoration).gba"
    out_sha1: "005b5571e169c45a0649fdb2cc52729f9d6b4116"

  # Final Fight ONE: Arcade Edition v3.0 (USA patch) — restores the arcade
  # roster/moves. Base is the No-Intro Final Fight One (USA) dump.
  - name: "Final Fight ONE Arcade Edition v3.0 (USA)"
    base: "{{ dg_rom_root }}/gba/Final Fight One (USA).gba"
    base_sha1: "17918e125bcafd44fcf3b21813575c2ccb19bd45"
    ips: "ffoae_arcade_edition_u_v3.0.ips"
    out: "{{ dg_rom_root }}/gba/Final Fight One - Arcade Edition (USA) [v3.0].gba"
    out_sha1: "e189ae8abe70497cad342dd5e1e80fcfa53e0783"

  # F-Zero: Vintage Velocity I (EN v2.1) and Ace (EN v3.0). Both apply the
  # International (US/EU) patch to an unmodified F-Zero Maximum Velocity dump and
  # expand it 4->8 MiB. Kept as SEPARATE ROMs alongside the untouched original,
  # so all three F-Zeros coexist in the library.
  - name: "F-Zero Vintage Velocity I (EN v2.1)"
    base: "{{ dg_rom_root }}/gba/F-Zero - Maximum Velocity (USA, Europe).gba"
    base_sha1: "8a08e29ec987f9cbdde21c34d5f7657aa7ba0be6"
    ips: "vintage_velocity_i_en_v2.1.ips"
    out: "{{ dg_rom_root }}/gba/F-Zero - Vintage Velocity I (v2.1).gba"
    out_sha1: "40aab9df0c1209464f6a79e53e7b0352d5e77cc2"

  - name: "F-Zero Vintage Velocity Ace (EN v3.0)"
    base: "{{ dg_rom_root }}/gba/F-Zero - Maximum Velocity (USA, Europe).gba"
    base_sha1: "8a08e29ec987f9cbdde21c34d5f7657aa7ba0be6"
    ips: "vintage_velocity_ace_en_v3.0.ips"
    out: "{{ dg_rom_root }}/gba/F-Zero - Vintage Velocity Ace (v3.0).gba"
    out_sha1: "962f357de0237c54aba3acdd0bda70fe274314d6"

  # Super Metroid Redux (v1.5) — large overhaul hack. Base is the headerless
  # No-Intro Super Metroid (Japan, USA) (En,Ja) dump; kept as a separate ROM
  # beside the vanilla original. Verified: output matches the author's prebuilt
  # Redux ROM. (The main IPS only; the zip's optional add-on patches are not
  # applied.)
  - name: "Super Metroid Redux v1.5"
    base: "{{ dg_rom_root }}/snes/Super Metroid (Japan, USA) (En,Ja).sfc"
    base_sha1: "da957f0d63d14cb441d215462904c4fa8519c613"
    ips: "super_metroid_redux.ips"
    out: "{{ dg_rom_root }}/snes/Super Metroid Redux.sfc"
    out_sha1: "0f4133f2e6bdd275b0ceec3e348e2d6bf1c8189e"

  # Return to Yoshi's Island — DEMO 2 (Kaze Emanuar), N64. A BPS patch (not IPS)
  # against Super Mario 64 (USA) [!] (.z64, sha1 9bef1128...). The only verified
  # 9bef1128 dump on the box is the SM64 decomp-port baserom; we read it (never
  # modify it). Output goes into roms_mid/n64 ALONGSIDE the originals (does not
  # touch the stock Mario ROMs). HEAVY hack: Mupen64Plus-Next won't boot it — it
  # needs the ParaLLEl-N64 core (parallel RDP + parallel RSP/CPU); pick that
  # alt-emulator per-game in ES-DE (same as SM64 Last Impact). See docs.
  - name: "Return to Yoshi's Island Demo 2 (Kaze, N64)"
    base: "{{ dg_box_home }}/tools/render96ex/source/baserom.us.z64"
    base_sha1: "9bef1128717f958171a4afac3ed78ee2bb4e86ce"
    # The .bps extension selects apply_bps.py. The patch is ~19 MB (effectively a
    # whole custom ROM), so it is NAS-staged instead of committed. out_sha1 +
    # the BPS's own CRC32 still guarantee a correct result.
    ips: "rtyi_demo2_v1.06.bps"
    patch_src: "{{ dg_roms_final_root }}/n64/romhack-patches/RTYI Demo TWO 1.06.bps"
    out: "{{ dg_rom_mid_root }}/n64/Return to Yoshi's Island (Demo 2 v1.06).z64"
    out_sha1: "4e91e2375d4094ec5e04beeaa87b883de51dfcec"

  # F-Zero Community Grand Prix (CGP, romhackplaza 2026) — 55 tracks: the 15
  # main tracks, both BS leagues, and 30 new ones; improved CPU, free boosting
  # from lap 2 (drains power), machine balance fixes, new LEGEND difficulty.
  # Three packs, installed side by side; they differ only in the vehicle roster:
  #   P1: Moon Shadow, Great Star, Dragon Bird, Death Anchor
  #   P2: Blue Falcon, Golden Fox, Panzer Emerald, Black Bull
  #   P3: White Cat, Red Gazelle, Wild Goose, Fire Stingray
  # Base is the headerless No-Intro F-Zero (USA) dump (CRC aa0e31de). The packs
  # ship MSU-1 audio: .msu/.pcm sidecars are hardlinked beside each ROM with
  # the ROM's basename (MSU-1 matches by filename), so music needs an
  # MSU-1-capable core (bsnes/Snes9x) — otherwise the game plays silent.
  # NAS-staged patches+packs: ROMS_FINAL/snes/romhack-patches/F-Zero CGP P*/
  # (zips kept pristine alongside the extracted folders).
  - name: "F-Zero Community Grand Prix P1 (CGP)"
    base: "{{ dg_rom_root }}/snes/originals/F-Zero (USA).sfc"
    base_sha1: "d3efd32b68f1fe37a82db9d9929b7ca7cc1a3af4"
    ips: "F-Zero CGP P1.ips"
    patch_src: "{{ dg_roms_final_root }}/snes/romhack-patches/F-Zero CGP P1/F-Zero CGP P1.ips"
    out: "{{ dg_rom_root }}/snes/F-Zero Community Grand Prix P1 (CGP).sfc"
    out_sha1: "be5fc510e0c44da70e3b8449e33c15f0334dc40c"
    msu_src: "{{ dg_roms_final_root }}/snes/romhack-patches/F-Zero CGP P1"
    msu_prefix: "F-Zero CGP P1"

  - name: "F-Zero Community Grand Prix P2 (CGP)"
    base: "{{ dg_rom_root }}/snes/originals/F-Zero (USA).sfc"
    base_sha1: "d3efd32b68f1fe37a82db9d9929b7ca7cc1a3af4"
    ips: "F-Zero CGP P2.ips"
    patch_src: "{{ dg_roms_final_root }}/snes/romhack-patches/F-Zero CGP P2/F-Zero CGP P2.ips"
    out: "{{ dg_rom_root }}/snes/F-Zero Community Grand Prix P2 (CGP).sfc"
    out_sha1: "bf288290e0cef9c2b9614a747b7fad496d58f3bc"
    msu_src: "{{ dg_roms_final_root }}/snes/romhack-patches/F-Zero CGP P2"
    msu_prefix: "F-Zero CGP P2"

  - name: "F-Zero Community Grand Prix P3 (CGP)"
    base: "{{ dg_rom_root }}/snes/originals/F-Zero (USA).sfc"
    base_sha1: "d3efd32b68f1fe37a82db9d9929b7ca7cc1a3af4"
    ips: "F-Zero CGP P3.ips"
    patch_src: "{{ dg_roms_final_root }}/snes/romhack-patches/F-Zero CGP P3/F-Zero CGP P3.ips"
    out: "{{ dg_rom_root }}/snes/F-Zero Community Grand Prix P3 (CGP).sfc"
    out_sha1: "b4dc5f38de7d4cb18c15a1055b84d04d67628fa3"
    msu_src: "{{ dg_roms_final_root }}/snes/romhack-patches/F-Zero CGP P3"
    msu_prefix: "F-Zero CGP P3"
