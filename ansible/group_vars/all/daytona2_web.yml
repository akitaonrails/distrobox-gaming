---
# Daytona USA 2 Power Edition — Web (Johann Ruiz's WASM + WebGPU static
# recompilation of the Sega Model 3 arcade game). The site is served from this
# machine on 127.0.0.1 and played in the host's Chromium app window, with the
# owned MAME dayto2pe set preloaded. Nothing about the game is downloaded from
# upstream: the ROM ZIP is symlinked out of ROMS_FINAL and read by the page
# only. See docs/daytona2-web.md.
#
# Pinned to a commit, not a release: the project publishes no release assets,
# the built site (including daytona2.wasm) lives in the repository.

dg_daytona2_web_repo: johannruiz/daytona-usa-2-web
dg_daytona2_web_version: 0.9.7
dg_daytona2_web_commit: 1adde5b41d6a7bab47a8a0b003557298a259e62c
dg_daytona2_web_asset_name: "daytona-usa-2-web-{{ dg_daytona2_web_version }}.tar.gz"
dg_daytona2_web_asset_url: "https://codeload.github.com/{{ dg_daytona2_web_repo }}/tar.gz/{{ dg_daytona2_web_commit }}"
dg_daytona2_web_asset_sha256: 88560f133fba3d998adf362d74fdb5dff538cc6414b65d3d8f780e6e40cb2f9b
dg_daytona2_web_archive: "{{ dg_roms_final_root }}/PC/releases/{{ dg_daytona2_web_asset_name }}"

dg_daytona2_web_root: "{{ dg_box_home }}/tools/daytona2-web"
# Browser profile (outside the install dir so a revert keeps it): the cabinet's
# NVRAM/EEPROM backup lives in this origin's IndexedDB.
dg_daytona2_web_data: "{{ dg_box_home }}/.local/share/daytona2-web"
dg_daytona2_web_profile: "{{ dg_daytona2_web_data }}/profile"
dg_daytona2_web_launcher: "{{ dg_box_home }}/bin/daytona2-web"
# The owned MAME set (non-merged, one complete ZIP: the page checks every chip).
dg_daytona2_web_rom: "{{ dg_roms_final_root }}/arcade/model3/dayto2pe.zip"
dg_daytona2_web_rom_link: "{{ dg_daytona2_web_root }}/roms/dayto2pe.zip"
# Fixed port: IndexedDB is keyed by origin, so a different port would look like
# a new cabinet with no saved NVRAM.
dg_daytona2_web_port: 8791
dg_daytona2_web_browser: chromium
dg_daytona2_web_main_output: DP-1
dg_daytona2_web_revert: false