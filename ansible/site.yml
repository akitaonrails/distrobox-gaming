---
- name: Full gaming distrobox setup
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - { role: check_host,                tags: [check] }
    - { role: create_box,                tags: [create] }
    - { role: bootstrap_packages,        tags: [bootstrap] }
    - { role: refresh_shadps4,           tags: [shadps4] }
    - { role: install_hedgemodmanager,   tags: [hedgemodmanager] }
    - { role: install_eden_cheats_manager, tags: [eden_cheats_manager] }
    - { role: link_storage,              tags: [configure, storage] }
    - { role: seed_configs,              tags: [configure, configs, reset_configs] }
    - { role: scripts_in_box,            tags: [configure, scripts] }
    # Opt-in roles: skipped by default, run only when the matching tag
    # is explicitly passed (e.g. --tags dlcs). These operate against
    # your specific NAS/ROM layout or make large downloads.
    - { role: install_dlcs,              tags: [dlcs, never] }
    - { role: switch_cheats,             tags: [cheats, never] }
    - { role: rpcs3_per_game_configs,    tags: [rpcs3_configs, never] }
    - { role: retroarch_extras,          tags: [retroarch, never] }
    - { role: pcsx2_textures,            tags: [pcsx2_textures, never] }
    - { role: install_pc_racing,         tags: [pc_racing, never] }
    - { role: install_m2emulator,        tags: [m2emulator, never] }
    - { role: install_model1,            tags: [model1, never] }
    - { role: install_sega_rally,        tags: [sega_rally, never] }
    - { role: install_sorr,              tags: [sorr, never] }
    - { role: install_sor4_reignited,    tags: [sor4_reignited, never] }
    - { role: install_prboom_plus_rt,    tags: [prboom_rt, doom_rt, never] }
    - { role: metal_gear_master_collection, tags: [metal_gear_master_collection, never] }
    - { role: install_re4_hd,            tags: [re4_hd, never] }
    - { role: install_gta4_mods,         tags: [gta4_mods, never] }
    - { role: install_artofrally_mods,   tags: [artofrally_mods, never] }
    - { role: install_alexkidddx_mods,   tags: [alexkidddx_mods, never] }
    - { role: install_ac7_mods,          tags: [ac7_mods, never] }
    - { role: install_wukong_mods,       tags: [wukong_mods, never] }
    - { role: install_bloodstained_mods, tags: [bloodstained_mods, never] }
    - { role: install_dsr_mods,          tags: [dsr_mods, never] }
    - { role: install_eldenring_mods,    tags: [eldenring_mods, never] }
    - { role: install_ff7remake_mods,    tags: [ff7remake_mods, never] }
    - { role: install_ff7rebirth_mods,   tags: [ff7rebirth_mods, never] }
    - { role: install_grandia_mods,      tags: [grandia_mods, never] }
    - { role: install_mgsdelta_mods,     tags: [mgsdelta_mods, never] }
    - { role: install_mgs3mc_mods,       tags: [mgs3mc_mods, never] }
    - { role: install_mgs2mc_mods,       tags: [mgs2mc_mods, never] }
    - { role: install_mgs1mc_mods,       tags: [mgs1mc_mods, never] }
    - { role: install_rdr_mods,          tags: [rdr_mods, never] }
    - { role: install_re4r_mods,         tags: [re4r_mods, never] }
    - { role: install_re2_mods,          tags: [re2_mods, never] }
    - { role: install_re3_mods,          tags: [re3_mods, never] }
    - { role: install_rerequiem_mods,    tags: [rerequiem_mods, never] }
    - { role: install_revillage_mods,    tags: [revillage_mods, never] }
    - { role: install_re0_mods,          tags: [re0_mods, never] }
    - { role: install_robocop_mods,      tags: [robocop_mods, never] }
    - { role: install_sekiro_mods,       tags: [sekiro_mods, never] }
    - { role: install_txr_mods,          tags: [txr_mods, never] }
    - { role: install_uncharted_mods,    tags: [uncharted_mods, never] }
    - { role: steam_lib32_nvidia,        tags: [steam_lib32_nvidia, never] }
    - { role: steam_trainers,            tags: [steam_trainers, never] }
    - { role: install_render96ex,        tags: [render96ex, never] }
    - { role: install_spaghettikart,     tags: [spaghettikart, never] }
    - { role: install_ship_of_harkinian, tags: [ship_of_harkinian, never] }
    - { role: install_2ship2harkinian,   tags: [two_ship2harkinian, never] }
    - { role: install_starship,          tags: [starship, never] }
    - { role: install_sonic_p06,         tags: [sonic_p06, never] }
    - { role: install_unleashed_recomp,  tags: [unleashed_recomp, never] }
    - { role: install_smm2_levels,   tags: [smm2_levels, never] }
    - { role: install_7th_heaven,        tags: [seven_heaven, "7th_heaven", materiaforge, ffvii_7th_heaven, never] }
    - { role: desktop_apps,              tags: [configure, desktop, reset_configs] }
    - { role: configure_esde,            tags: [configure, esde, reset_configs] }
    - { role: shell_config,              tags: [configure, shell, reset_configs] }
    - { role: verify,                    tags: [verify] }
