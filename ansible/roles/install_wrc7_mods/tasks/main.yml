---
# WRC 7 (appid 621830) mod set — EVOlution total-overhaul (data PKG replacement).
# See group_vars/all/wrc7_mods.yml and docs/nexusmods.md.

- name: Revert the WRC 7 mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_wrc7_revert | bool

- name: Install the WRC 7 mod set
  when: not (dg_wrc7_revert | bool)
  block:
    - name: Locate the WRC 7 game dir
      ansible.builtin.stat:
        path: "{{ dg_wrc7_game_dir }}/WIN32"
      register: _wrc7_game

    - name: Fail when WRC 7 is not found
      ansible.builtin.fail:
        msg: "{{ dg_wrc7_game_dir }} not found (appid {{ dg_wrc7_appid }}). See docs/nexusmods.md."
      when: not _wrc7_game.stat.exists

    - name: Download the WRC 7 mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game wrc7
          --mod {{ item.id }} --file {{ item.file }} --via api
          --dest {{ (dg_wrc7_staging_root + '/' + item.id + '/' + item.file) | quote }}
      loop: "{{ dg_wrc7_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _wrc7_dl
      changed_when: "'saved' in _wrc7_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Install the EVOlution overhaul over the game tree (records a manifest)
      ansible.builtin.shell: |
        set -eu
        game={{ dg_wrc7_game_dir | quote }}
        inner={{ dg_wrc7_inner_subtree | quote }}
        manifest="$game/.dg-wrc7-{{ item.id }}.manifest"
        [ -f "$manifest" ] && { echo "skip"; exit 0; }
        arch="$(find {{ (dg_wrc7_staging_root + '/' + item.id + '/' + item.file) | quote }} -type f -name '*.rar' | head -1)"
        [ -n "$arch" ] || { echo "NO-ARCHIVE" >&2; exit 3; }
        mkdir -p {{ dg_wrc7_extract_root | quote }}
        tmp="$(mktemp -d -p {{ dg_wrc7_extract_root | quote }})"
        trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" "$arch" >/dev/null
        src="$(find "$tmp" -type d -name "$inner" | head -1)"
        [ -n "$src" ] || { echo "NO-INNER-TREE" >&2; exit 4; }
        ( cd "$src" && find . -type f | sed 's|^\./||' ) > "$manifest.tmp"
        rsync -a "$src"/ "$game"/
        mv "$manifest.tmp" "$manifest"
        echo "wrc7-installed"
      loop: "{{ dg_wrc7_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _wrc7_install
      changed_when: "'wrc7-installed' in _wrc7_install.stdout"

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "WRC 7: installed {{ dg_wrc7_mods | map(attribute='name') | join(', ') }} (data-chunk PKG overhaul)."
          - "Revert: Steam -> WRC 7 -> Properties -> Installed Files -> Verify integrity (restores originals), then -e dg_wrc7_revert=true to drop the manifest."
