---
# Donkey Kong Country (GBA) SNES colour restoration (marc_max IPS v1.1).
# See group_vars/all/dkc_gba_restoration.yml and docs/dkc-gba-restoration.md.

- name: Revert DKC GBA restoration when requested
  when: dg_dkc_gba_revert | bool
  block:
    - name: Remove the patched DKC GBA ROM
      ansible.builtin.file:
        path: "{{ dg_dkc_gba_out }}"
        state: absent
    - name: Report DKC GBA restoration reverted
      ansible.builtin.debug:
        msg: >-
          Removed {{ dg_dkc_gba_out }}. The unpatched EU base ROM on the NAS is
          untouched.

- name: Install DKC GBA restoration
  when: not (dg_dkc_gba_revert | bool)
  block:
    - name: Stat the required EU base ROM
      ansible.builtin.stat:
        path: "{{ dg_dkc_gba_base_rom }}"
        checksum_algorithm: sha1
      register: _dkc_base

    - name: Fail with guidance when the EU base ROM is missing
      ansible.builtin.fail:
        msg: >-
          Missing base ROM: {{ dg_dkc_gba_base_rom }}. The restoration patch
          targets ONLY "Donkey Kong Country (Europe) (En,Fr,De,Es,It).gba"
          (sha1 {{ dg_dkc_gba_base_sha1 }}). The USA dump does not match. If you
          have the EU dump zipped next to it, extract the .gba first. See
          docs/dkc-gba-restoration.md.
      when: not _dkc_base.stat.exists

    - name: Fail when the base ROM is not the required EU revision
      ansible.builtin.fail:
        msg: >-
          {{ dg_dkc_gba_base_rom }} sha1 is {{ _dkc_base.stat.checksum }},
          expected {{ dg_dkc_gba_base_sha1 }} (EU multi-language). The IPS patch
          is offset-specific to that revision and would corrupt any other dump.
      when:
        - _dkc_base.stat.exists
        - _dkc_base.stat.checksum != dg_dkc_gba_base_sha1

    - name: Stat the patched output ROM
      ansible.builtin.stat:
        path: "{{ dg_dkc_gba_out }}"
        checksum_algorithm: sha1
      register: _dkc_out

    - name: Ensure the EmuDeck GBA library dir exists
      ansible.builtin.file:
        path: "{{ dg_dkc_gba_out | dirname }}"
        state: directory
        mode: "0755"
      when: not _dkc_out.stat.exists

    - name: Apply the restoration IPS patch (hash-verified)
      # apply_ips.py asserts the base sha1 before patching and the output sha1
      # after, so a wrong-region base or bad patch fails instead of writing a
      # broken ROM. Runs only when the output is absent or not the expected build.
      ansible.builtin.command:
        argv:
          - python3
          - "{{ role_path }}/files/apply_ips.py"
          - "{{ dg_dkc_gba_base_rom }}"
          - "{{ role_path }}/files/{{ dg_dkc_gba_ips }}"
          - "{{ dg_dkc_gba_out }}"
          - "{{ dg_dkc_gba_base_sha1 }}"
          - "{{ dg_dkc_gba_out_sha1 }}"
      register: _dkc_apply
      changed_when: true
      when: >-
        not _dkc_out.stat.exists or
        _dkc_out.stat.checksum != dg_dkc_gba_out_sha1

    - name: Report DKC GBA restoration setup
      ansible.builtin.debug:
        msg:
          - "Patched ROM: {{ dg_dkc_gba_out }} (sha1 {{ dg_dkc_gba_out_sha1 }})."
          - >-
            {{ 'Already up to date.' if (_dkc_apply is skipped)
               else 'Applied the marc_max v1.1 colour restoration.' }}
          - "Playable in ES-DE / RetroArch (mGBA). Revert: -e dg_dkc_gba_revert=true."
