---
# Resident Evil 0 HD (appid 339340) mod set — MT Framework nativePC/ overlays.
# See group_vars/all/re0_mods.yml and docs/nexusmods.md.

- name: Revert the RE0 mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_re0_revert | bool

- name: Install the RE0 mod set
  when: not (dg_re0_revert | bool)
  block:
    - name: Locate the RE0 game dir
      ansible.builtin.stat:
        path: "{{ dg_re0_game_dir }}"
      register: _re0_game

    - name: Fail when RE0 is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_re0_game_dir }} not found (appid {{ dg_re0_appid }}).
          Install RE0, or override dg_re0_steam_library_root. See docs/nexusmods.md.
      when: not _re0_game.stat.exists

    - name: Download each RE0 mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py
          --game residentevil0biohazard0hdremaster
          --mod {{ item.id }} --file {{ item.file }} --via api
          --dest {{ (dg_re0_staging_root + '/' + item.id) | quote }}
      loop: "{{ dg_re0_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _re0_dl
      changed_when: "'saved' in _re0_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Install each nativePC/ overlay (records a manifest)
      ansible.builtin.shell: |
        set -eu
        game={{ dg_re0_game_dir | quote }}
        manifest="$game/.dg-re0-{{ item.id }}.manifest"
        [ -f "$manifest" ] && { echo "skip"; exit 0; }
        arch="$(find {{ (dg_re0_staging_root + '/' + item.id) | quote }} -type f \
          \( -name '*.zip' -o -name '*.rar' -o -name '*.7z' \) | head -1)"
        [ -n "$arch" ] || { echo "NO-ARCHIVE" >&2; exit 3; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" "$arch" >/dev/null
        np="$(find "$tmp" -type d -iname nativePC | head -1)"
        [ -n "$np" ] || { echo "NO-NATIVEPC" >&2; exit 4; }
        src="$(dirname "$np")"
        ( cd "$src" && find "$(basename "$np")" -type f ) > "$manifest.tmp"
        rsync -a "$np/" "$game/$(basename "$np")/"
        mv "$manifest.tmp" "$manifest"
        echo "re0-installed"
      loop: "{{ dg_re0_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _re0_install
      changed_when: "'re0-installed' in _re0_install.stdout"

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "RE0: installed {{ dg_re0_mods | map(attribute='name') | join(', ') }} (MT Framework nativePC/ overlay)."
          - "Deferred 58 re0ct (Cheat Engine .CT). Revert: -e dg_re0_revert=true."
