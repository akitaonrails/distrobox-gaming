---
# GT4Recomp v1.3.0-rc6 (portable) — runs the standalone game executables
# directly under Wine. The upstream Tauri launcher GUI cannot run here: it
# needs the Microsoft Edge WebView2 runtime, which Wine does not provide
# ("WebView2 is missing: the native message is shown before any window").
# Everything the GUI would set up (prepared ELF, GS renderer, textures) is
# staged by this role instead.

- name: Require the retail GT4 disc image
  ansible.builtin.stat:
    path: "{{ dg_gt4r_iso }}"
    checksum_algorithm: sha256
  register: _gt4r_iso
- ansible.builtin.assert:
    that:
      - _gt4r_iso.stat.isreg | default(false)
      - _gt4r_iso.stat.checksum | default('') == dg_gt4r_iso_sha256
    fail_msg: >-
      GT4Recomp needs the USA retail Gran Turismo 4 image at dg_gt4r_iso
      (sha256 {{ dg_gt4r_iso_sha256 }}).

- name: Verify the staged v1.3.0 portable ZIP
  ansible.builtin.stat:
    path: "{{ dg_gt4r_130_zip }}"
    checksum_algorithm: sha256
  register: _gt4r_130_zip
- ansible.builtin.assert:
    that: _gt4r_130_zip.stat.checksum | default('') == dg_gt4r_130_sha256
    fail_msg: "Staged v1.3.0 ZIP missing or wrong sha256 at {{ dg_gt4r_130_zip }}."

- name: Create the GT4Recomp directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_gt4r_root }}"
    - "{{ dg_gt4r_130_release }}"
    - "{{ dg_gt4r_130_release }}/data/games/gt4/prepared"
    - "{{ dg_gt4r_130_release }}/data/memcards"
    - "{{ dg_gt4r_130_release }}/data/Textures"
    - "{{ dg_gt4r_130_release }}/game/gs"
    - "{{ dg_gt4r_prefix }}"
    - "{{ dg_box_home }}/bin"

- name: Extract the v1.3.0 portable release
  ansible.builtin.command:
    argv:
      - distrobox-enter
      - -n
      - "{{ dg_box_name }}"
      - --
      - 7z
      - x
      - -y
      - "-o{{ dg_gt4r_130_release }}"
      - "{{ dg_gt4r_130_zip }}"
    creates: "{{ dg_gt4r_130_release }}/GT4Recomp.exe"

- name: Require the prepared GT4 executable from the disc
  ansible.builtin.stat:
    path: "{{ dg_gt4r_elf }}"
    checksum_algorithm: sha256
  register: _gt4r_elf
- ansible.builtin.assert:
    that: _gt4r_elf.stat.checksum | default('') == dg_gt4r_elf_sha256
    fail_msg: >-
      The reconstructed GT4 executable ({{ dg_gt4r_elf }}, pinned
      {{ dg_gt4r_elf_sha256 }}) is missing or changed. It is built once from
      the owned disc with upstream gt4l-disc; see docs/gt4-recomp.md.

- name: Stage the prepared executable for the v1.3.0 layout
  ansible.builtin.copy:
    src: "{{ dg_gt4r_elf }}"
    dest: "{{ dg_gt4r_130_release }}/data/games/gt4/prepared/SCUS_973.28"
    remote_src: true
    mode: "0644"

# The standalone game has no default memory card, so the first boot stops at
# "No memory card (PS2) inserted into MEMORY CARD slot 1" and nothing can be
# saved. Seed a valid formatted card once from the PCSX2 card set; after that
# the port owns its own file.
- name: Look for a PCSX2 card to seed the port's memory card
  ansible.builtin.stat:
    path: "{{ dg_gt4r_memcard_seed }}"
  register: _gt4r_card_seed

- name: Create the port's memory card
  ansible.builtin.copy:
    src: "{{ dg_gt4r_memcard_seed }}"
    dest: "{{ dg_gt4r_memcard }}"
    remote_src: true
    mode: "0644"
    force: false
  when: _gt4r_card_seed.stat.exists

- name: Warn when no card could be seeded
  ansible.builtin.debug:
    msg: >-
      No PCSX2 card at {{ dg_gt4r_memcard_seed }} — GT4 will start without a
      memory card (no saves) until one is placed at {{ dg_gt4r_memcard }}.
  when: not _gt4r_card_seed.stat.exists

- name: Ensure the GSdx renderer (gt4-gs.exe) is present
  ansible.builtin.unarchive:
    src: "{{ dg_gt4r_cache }}/{{ dg_gt4r_gs_name }}"
    dest: "{{ dg_gt4r_130_release }}/game/gs"
    remote_src: true
    creates: "{{ dg_gt4r_130_release }}/game/gs/gt4-gs.exe"

- name: Link the PCSX2 HD texture packs into the shared Textures folder
  ansible.builtin.file:
    path: "{{ dg_gt4r_130_release }}/data/Textures/{{ item.name }}"
    src: "{{ item.src }}"
    state: link
    force: true
  loop:
    - name: hd-hud-ui
      src: "{{ dg_pcsx2_ps2_root }}/Gran Turismo 4 Remaster/Gran Turismo 4 HD HUD & UI Texture pack by Silentwarior112/replacements"
    - name: hd-hud-ui-update-2.1
      src: "{{ dg_pcsx2_ps2_root }}/Gran Turismo 4 Remaster/update 2.1/replacements"
    - name: blocky-haze-fix
      src: "{{ dg_pcsx2_ps2_root }}/Gran Turismo 4 Remaster/HD HUD & U.I. blocky haze fix v2/text files jap kor usa pal shared"

- name: Install the GT4Recomp launcher
  ansible.builtin.template:
    src: gt4-recomp-v130-direct.sh.j2
    dest: "{{ dg_gt4r_launcher }}"
    mode: "0755"

- name: Render the GT4Recomp desktop entry
  ansible.builtin.template:
    src: gaming-gt4-recomp.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/gaming-gt4-recomp.desktop"
    mode: "0644"

- name: Install the GT4Recomp host desktop entry
  ansible.builtin.command:
    cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  environment:
    DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
    DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
  register: _gt4r_host
  changed_when: >-
    'installed ' in _gt4r_host.stdout or
    'removed stale ' in _gt4r_host.stdout
