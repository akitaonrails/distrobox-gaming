---
- name: Ensure DuckStation config directory exists
  ansible.builtin.file:
    path: "{{ dg_duckstation_ini | dirname }}"
    state: directory
    mode: "0755"

- name: Set DuckStation INI keys
  community.general.ini_file:
    path: "{{ dg_duckstation_ini }}"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    backup: true
    mode: "0644"
  loop: "{{ dg_duckstation_settings }}"
  loop_control:
    label: "[{{ item.section }}] {{ item.option }}"

- name: Ensure DuckStation per-game settings dir exists
  ansible.builtin.file:
    path: "{{ dg_box_home }}/.config/duckstation/gamesettings"
    state: directory
    mode: "0755"

- name: "Per-game DuckStation INI overrides"
  community.general.ini_file:
    path: "{{ dg_box_home }}/.config/duckstation/gamesettings/{{ pgs.0.serial }}.ini"
    section: "{{ pgs.1.section }}"
    option: "{{ pgs.1.option }}"
    value: "{{ pgs.1.value }}"
    create: true
    backup: true
    mode: "0644"
  loop: "{{ dg_duckstation_per_game_settings | default([]) | subelements('settings') }}"
  loop_control:
    loop_var: pgs
    label: "{{ pgs.0.serial }} [{{ pgs.1.section }}] {{ pgs.1.option }}"

- name: Ensure DuckStation cheats dir exists
  ansible.builtin.file:
    path: "{{ dg_box_home }}/.config/duckstation/cheats"
    state: directory
    mode: "0755"

- name: "Stat per-game DuckStation cheat source files"
  ansible.builtin.stat:
    path: "{{ item.source }}"
  loop: "{{ dg_duckstation_cheats | default([]) }}"
  loop_control:
    label: "{{ item.serial }}"
  register: _duckstation_cheat_sources
  when: item.source is defined

- name: "Warn about missing DuckStation cheat sources"
  ansible.builtin.debug:
    msg: "WARNING: DuckStation cheat source missing, skipping {{ item.item.serial }}: {{ item.item.source }} (see docs/setup-assets.md)"
  loop: "{{ _duckstation_cheat_sources.results | default([]) }}"
  loop_control:
    label: "{{ item.item.serial }}"
  when:
    - item.stat is defined
    - not (item.stat.exists | default(false))

# Copy + enable in one pass: the enable IDs are flipped in the deployed
# content itself (regex over the slurped source), so the written file is
# a fixed point — a plain copy followed by in-place replace re-flagged
# "changed" on every run.
- name: "Copy per-game DuckStation cheat files (enables pre-applied)"
  ansible.builtin.copy:
    dest: "{{ dg_box_home }}/.config/duckstation/cheats/{{ item.item.serial }}.cht"
    content: "{{ lookup('ansible.builtin.file', item.item.source) | regex_replace(_ds_enable_re, '\\g<1> = true') }}"
    mode: "0644"
  vars:
    _ds_enable_re: "(?m)^(cheat(?:{{ item.item.enable_ids | default([]) | map('string') | join('|') }})_enable)\\s*=\\s*false"
  loop: "{{ _duckstation_cheat_sources.results | default([]) }}"
  loop_control:
    label: "{{ item.item.serial }}"
  when:
    - item.stat.exists | default(false)
    - item.item.enable_ids | default([]) | length > 0

# File-backed native-format cheat packs (source + tag): the same contract as
# the inline entries below, for packs too large to keep in group_vars (the
# RRT4 60 FPS pack is ~9k guarded write lines).
- name: "Deploy file-backed DuckStation-native cheat packs"
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ dg_box_home }}/.config/duckstation/cheats/{{ item.serial }}_{{ item.tag }}.cht"
    mode: "0644"
  loop: "{{ dg_duckstation_cheats | default([]) }}"
  loop_control:
    label: "{{ item.serial }}_{{ item.tag | default('') }}.cht"
  when:
    - item.source is defined
    - item.tag is defined

# Inline native-format cheat files (tag + content entries). Deployed as
# cheats/<serial>_<tag>.cht — the loader glob-matches <serial>*.cht, so
# these load alongside any <serial>.cht pack.
- name: "Deploy inline DuckStation-native cheat files"
  ansible.builtin.copy:
    dest: "{{ dg_box_home }}/.config/duckstation/cheats/{{ item.serial }}_{{ item.tag }}.cht"
    content: "{{ item.content }}"
    mode: "0644"
  loop: "{{ dg_duckstation_cheats | default([]) }}"
  loop_control:
    label: "{{ item.serial }}_{{ item.tag | default('') }}.cht"
  when: item.content is defined and item.tag is defined

# Cheat activation on current DuckStation lives in the per-game ini:
#   [Cheats]
#   EnableCheats = true
#   Enable = <cheat name>     (repeated key, one per cheat)
# ini_file can't write repeated keys, so Enable lines use lineinfile.
- name: "DuckStation per-game cheat master switch"
  community.general.ini_file:
    path: "{{ dg_box_home }}/.config/duckstation/gamesettings/{{ item.serial }}.ini"
    section: Cheats
    option: EnableCheats
    value: "true"
    create: true
    backup: true
    mode: "0644"
  loop: "{{ dg_duckstation_cheats | default([]) }}"
  loop_control:
    label: "{{ item.serial }} [Cheats] EnableCheats"
  when: item.enable_names is defined

- name: "Ensure DuckStation gamesettings [Cheats] section exists"
  ansible.builtin.lineinfile:
    path: "{{ dg_box_home }}/.config/duckstation/gamesettings/{{ item.serial }}.ini"
    line: "[Cheats]"
    insertafter: EOF
    create: true
    backup: true
    mode: "0644"
  loop: "{{ dg_duckstation_cheats | default([]) }}"
  loop_control:
    label: "{{ item.serial }} [Cheats] section"
  when: item.enable_names is defined

- name: "Enable named DuckStation cheats in per-game ini"
  ansible.builtin.lineinfile:
    path: "{{ dg_box_home }}/.config/duckstation/gamesettings/{{ item.0.serial }}.ini"
    regexp: "^Enable = {{ item.1 | regex_escape }}$"
    line: "Enable = {{ item.1 }}"
    insertafter: "^\\[Cheats\\]$"
  loop: "{{ dg_duckstation_cheats | default([]) | subelements('enable_names', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.serial }} Enable={{ item.1 }}"
