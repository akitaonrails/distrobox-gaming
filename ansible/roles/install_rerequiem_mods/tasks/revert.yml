---
# Remove each RE Requiem overlay using its recorded manifest.

- name: Remove each installed overlay via its manifest
  ansible.builtin.shell: |
    set -eu
    game={{ dg_rerequiem_game_dir | quote }}
    manifest="$game/.dg-rerequiem-{{ item.id }}.manifest"
    [ -f "$manifest" ] || { echo "nochange"; exit 0; }
    while IFS= read -r f; do
      [ -n "$f" ] && rm -f "$game/$f"
    done < "$manifest"
    rm -f "$manifest"
    [ -d "$game/natives" ] && find "$game/natives" -type d -empty -delete 2>/dev/null || true
    echo "rerequiem-reverted"
  loop: "{{ dg_rerequiem_mods }}"
  loop_control:
    label: "{{ item.id }} {{ item.name }}"
  register: _rerq_revert
  changed_when: "'rerequiem-reverted' in _rerq_revert.stdout"
