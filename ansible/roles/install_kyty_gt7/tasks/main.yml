---
- name: Create KytyPS5 directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_kyty_install_dir }}"
    - "{{ dg_kyty_release_dir }}"
    - "{{ dg_kyty_cache_dir }}"
    - "{{ dg_box_home }}/bin"

- name: Require the extracted GT7 game folder
  ansible.builtin.stat:
    path: "{{ dg_kyty_game_dir }}/{{ item }}"
  loop: [eboot.bin, sce_module]
  register: _kyty_game_files
- ansible.builtin.assert:
    that: _kyty_game_files.results | selectattr('stat.exists') | list | length == 2
    fail_msg: >-
      KytyPS5 needs the extracted GT7 (PPSA01317 v01.710) folder with
      eboot.bin and sce_module at dg_kyty_game_dir — an FPKG is not loadable;
      see docs/kyty-gt7.md for the one-time pkg-to-anyps5 extraction.

- name: Download the pinned KytyPS5-GT7 Linux build
  ansible.builtin.get_url:
    url: "{{ dg_kyty_asset_url }}"
    dest: "{{ dg_kyty_cache_dir }}/{{ dg_kyty_asset_name }}"
    checksum: "sha256:{{ dg_kyty_asset_sha256 }}"
    mode: "0644"

- name: Extract KytyPS5 into its versioned release directory
  ansible.builtin.unarchive:
    src: "{{ dg_kyty_cache_dir }}/{{ dg_kyty_asset_name }}"
    dest: "{{ dg_kyty_release_dir }}"
    remote_src: true
    creates: "{{ dg_kyty_release_dir }}/kyty_emulator"

- name: Install the KytyPS5 GT7 launcher
  ansible.builtin.template:
    src: kyty-gt7.sh.j2
    dest: "{{ dg_kyty_launcher }}"
    mode: "0755"

- name: Render the KytyPS5 GT7 desktop entry
  ansible.builtin.template:
    src: kyty-gt7.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/gaming-kyty-gt7.desktop"
    mode: "0644"

- name: Install the KytyPS5 GT7 host desktop entry
  ansible.builtin.command:
    cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  environment:
    DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
    DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
  register: _kyty_host_launchers
  changed_when: >-
    'installed ' in _kyty_host_launchers.stdout or
    'removed stale ' in _kyty_host_launchers.stdout
