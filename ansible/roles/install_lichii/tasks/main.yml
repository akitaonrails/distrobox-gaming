---
# Fritchii, Frizti's OoT-specialised Lichii fork, shipped as a prebuilt Linux
# AppDir (bundled Qt6 + libs). No source build, no shader-sync tool: Fritchii
# keeps its own shaders. It shares Eden's eden/qt-config.ini, so the isolated
# profile, saves and controller mapping are unchanged. The retired source build,
# shader-sync tool and restricted-runtime pilot are cleaned up by the retired-
# paths task below. See docs/lichii.md.

- name: Check the owned Switch 2 NUP package
  ansible.builtin.stat:
    path: "{{ dg_lichii_game }}"
    get_checksum: false
  register: _lichii_game

- name: Require the selected Switch 2 game file
  ansible.builtin.assert:
    that:
      - _lichii_game.stat.isreg | default(false)
      - _lichii_game.stat.size | default(0) == dg_lichii_game_size
    fail_msg: "Expected the owned Ocarina of Time NUP at {{ dg_lichii_game }} ({{ dg_lichii_game_size }} bytes). Override dg_lichii_game for another dump."

- name: Validate the NUP container header and table of contents
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/check_nup.py"
      - "{{ dg_lichii_game }}"
  changed_when: false

- name: Create Fritchii, profile and launcher directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_fritchii_archive | dirname }}"
    - "{{ dg_lichii_root }}"
    - "{{ dg_fritchii_unpack_root }}"
    - "{{ dg_lichii_profile }}/config/eden"
    - "{{ dg_lichii_profile }}/data"
    - "{{ dg_lichii_profile }}/cache"
    - "{{ dg_box_home }}/bin"
    - "{{ dg_desktop_render_dir }}"

- name: Stage the pinned Fritchii AppDir tarball
  ansible.builtin.get_url:
    url: "{{ dg_fritchii_asset_url }}"
    dest: "{{ dg_fritchii_archive }}"
    checksum: "sha256:{{ dg_fritchii_asset_sha256 }}"
    mode: "0644"

# The tarball carries a top-level fritchii/ AppDir; extract it as-is (no
# strip-components) next to its version so older versions can be removed whole.
- name: Unpack the Fritchii AppDir
  ansible.builtin.command:
    argv:
      - tar
      - -xzf
      - "{{ dg_fritchii_archive }}"
      - -C
      - "{{ dg_fritchii_unpack_root }}"
    creates: "{{ dg_fritchii_app_dir }}/AppRun"

- name: Require the unpacked Fritchii entrypoint
  ansible.builtin.stat:
    path: "{{ dg_lichii_bin }}"
  register: _fritchii_apprun

- name: Record the unpack result
  ansible.builtin.assert:
    that: _fritchii_apprun.stat.isreg | default(false)
    fail_msg: "Fritchii did not unpack: {{ dg_lichii_bin }} is missing. See docs/lichii.md."
    quiet: true

- name: Ensure the Fritchii entrypoints are executable
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
  loop:
    - "{{ dg_fritchii_app_dir }}/AppRun"
    - "{{ dg_fritchii_app_dir }}/usr/bin/lichii"

- name: Seed isolated docked, graphics and controller configuration
  ansible.builtin.template:
    src: qt-config.ini.j2
    dest: "{{ dg_lichii_config }}"
    mode: "0644"
    force: false

# The Ocarina baseline (see dg_lichii_profile_settings) is applied once, then
# recorded by a marker: a rerun must not undo whatever was chosen in the
# settings window afterwards.
- name: Check whether the Ocarina baseline was already applied
  ansible.builtin.stat:
    path: "{{ dg_lichii_profile }}/.baseline-applied"
  register: _lichii_baseline

# A setting is only honoured when its "<key>\default=false" companion exists:
# with the flag absent (or true) the frontend uses its built-in default and
# rewrites the value on exit — which silently reverted the GPU baseline before.
- name: Apply the Ocarina baseline settings
  ansible.builtin.lineinfile:
    path: "{{ dg_lichii_config }}"
    regexp: '^{{ item.key }}='
    line: "{{ item.key }}={{ item.value }}"
    insertafter: EOF
  loop: "{{ dg_lichii_profile_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not _lichii_baseline.stat.exists

- name: Mark the baseline settings as explicit, not built-in defaults
  ansible.builtin.lineinfile:
    path: "{{ dg_lichii_config }}"
    regexp: '^{{ item.key }}\\default='
    line: '{{ item.key }}\default=false'
    insertafter: EOF
  loop: "{{ dg_lichii_profile_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not _lichii_baseline.stat.exists

- name: Record the Ocarina baseline as applied
  ansible.builtin.copy:
    content: "{{ dg_lichii_profile_settings | to_nice_json }}\n"
    dest: "{{ dg_lichii_profile }}/.baseline-applied"
    mode: "0644"
  when: not _lichii_baseline.stat.exists

- name: Remove superseded Fritchii versions
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ dg_fritchii_superseded_versions
       | map('regex_replace', '^', dg_lichii_root ~ '/fritchii-v') | list
       + dg_fritchii_superseded_versions
       | map('regex_replace', '^', dg_roms_final_root ~ '/PC/releases/Fritchii-v') | map('regex_replace', '$', '-Linux-x86_64.tar.gz') | list }}

# Clean replacement: drop the old source build tree and the retired shader-sync
# tool/launcher once Fritchii is in place. The profile (saves, keys, config) is
# never touched.
- name: Remove the retired source build and shader-sync artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ dg_lichii_retired_paths }}"

- name: Install Lichii launcher
  ansible.builtin.template:
    src: lichii.sh.j2
    dest: "{{ dg_lichii_launcher }}"
    mode: "0755"

- name: Render Lichii desktop entries
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ dg_desktop_render_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - gaming-lichii.desktop
    - gaming-lichii-oot.desktop

- name: Publish Lichii desktop entries
  ansible.builtin.command:
    cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  environment:
    DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
    DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
  register: _lichii_host_launchers
  changed_when: >-
    'installed ' in _lichii_host_launchers.stdout or
    'removed stale ' in _lichii_host_launchers.stdout
