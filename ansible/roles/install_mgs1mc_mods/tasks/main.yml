---
# MGS1 Master Collection (appid 2131630) mod set — MGSM2Fix into the game root.
# See group_vars/all/mgs1mc_mods.yml and docs/nexusmods.md.

- name: Revert the MGS1 MC mod when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_mgs1mc_revert | bool

- name: Install the MGS1 MC mod (MGSM2Fix)
  when: not (dg_mgs1mc_revert | bool)
  block:
    - name: Locate the MGS1 game dir
      ansible.builtin.stat:
        path: "{{ dg_mgs1mc_game_dir }}"
      register: _m1_game

    - name: Fail when MGS1 MC is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_mgs1mc_game_dir }} not found (appid {{ dg_mgs1mc_appid }}).
          Install it + mount the USB library, or override
          dg_mgs1mc_steam_library_root. See docs/nexusmods.md.
      when: not _m1_game.stat.exists

    - name: Download MGSM2Fix via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game metalgearsolidmc
          --mod 5 --via api --dest {{ (dg_mgs1mc_staging_root + '/5-mgsm2fix') | quote }}
      register: _m1_dl
      changed_when: "'saved' in _m1_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Find the staged MGSM2Fix archive
      ansible.builtin.find:
        paths: "{{ dg_mgs1mc_staging_root }}/5-mgsm2fix"
        patterns: ["*.zip", "*.7z", "*.rar"]
      register: _m1_staged

    - name: Fail when MGSM2Fix is not staged
      ansible.builtin.fail:
        msg: >-
          MGSM2Fix (mod 5) not staged. Set NEXUS_MODS_API_KEY or download
          metalgearsolidmc/mods/5 into {{ dg_mgs1mc_staging_root }}/5-mgsm2fix/.
      when: _m1_staged.matched == 0

    - name: Check the MGSM2Fix marker
      ansible.builtin.stat:
        path: "{{ dg_mgs1mc_game_dir }}/.dg-mgs1mc-mgsm2fix"
      register: _m1_marker

    - name: Extract MGSM2Fix into the game root
      ansible.builtin.shell: |
        set -eu
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" {{ _m1_staged.files[0].path | quote }} >/dev/null
        rsync -a "$tmp"/ {{ dg_mgs1mc_game_dir | quote }}/
        echo "mgsm2fix-installed"
      register: _m1_install
      changed_when: "'mgsm2fix-installed' in _m1_install.stdout"
      when: not _m1_marker.stat.exists

    - name: Write the MGSM2Fix marker
      ansible.builtin.copy:
        dest: "{{ dg_mgs1mc_game_dir }}/.dg-mgs1mc-mgsm2fix"
        content: "MGSM2Fix installed into the game root\n"
        mode: "0644"
      when: not _m1_marker.stat.exists

    # --- Steam launch options (dinput8/d3d11 override for MGSM2Fix) ---

    - name: Auto-discover the in-box Steam localconfig.vdf
      ansible.builtin.find:
        paths: "{{ dg_mgs1mc_steam_root }}/userdata"
        patterns: localconfig.vdf
        recurse: true
      register: _m1_localconfigs
      when: dg_mgs1mc_steam_localconfig | length == 0

    - name: Resolve the effective localconfig path
      ansible.builtin.set_fact:
        _m1_localconfig: >-
          {{ dg_mgs1mc_steam_localconfig if (dg_mgs1mc_steam_localconfig | length > 0)
             else (_m1_localconfigs.files | map(attribute='path') | list | first
                   if (_m1_localconfigs.files | default([]) | length == 1) else '') }}

    - name: Check if Steam is running
      ansible.builtin.shell: |
        pgrep -u "$(id -u)" -x steam >/dev/null || pgrep -u "$(id -u)" -f '/steam(webhelper)?( |$)' >/dev/null
      register: _m1_steam_running
      changed_when: false
      failed_when: false
      check_mode: false
      when: _m1_localconfig | length > 0

    - name: Warn that launch options were not set (Steam running)
      ansible.builtin.debug:
        msg: >-
          Steam is running; the dinput8/d3d11 override was NOT set. Set it
          manually (MGS1 -> Launch Options -> {{ dg_mgs1mc_launch_options }}) or
          close Steam and re-run. The mod is installed.
      when:
        - _m1_localconfig | length > 0
        - not (dg_mgs1mc_stop_steam | bool)
        - _m1_steam_running.rc == 0

    - name: Set the MGS1 Steam launch options (MGSM2Fix override)
      ansible.builtin.command: >-
        {{ dg_project_root }}/scripts/set-steam-launch-options.py
        --localconfig {{ _m1_localconfig | quote }}
        --set {{ dg_mgs1mc_appid | quote }} {{ dg_mgs1mc_launch_options | quote }}
      register: _m1_launch
      changed_when: "'changed: true' in _m1_launch.stdout"
      when:
        - _m1_localconfig | length > 0
        - _m1_steam_running.rc != 0

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "MGS1 MC: MGSM2Fix installed into the game root (widescreen/res/skip; edit MGSM2Fix.ini to configure)."
          - "{{ 'Launch override set.' if (_m1_localconfig | length > 0 and _m1_steam_running.rc != 0) else 'Set launch option manually: ' + dg_mgs1mc_launch_options }}"
          - "Mod 3 (CRT shader) dropped — ReShade/RetroArch GUI pipeline, PC-only. Revert: -e dg_mgs1mc_revert=true."
