---
# GRANDIA HD Remaster (appid 1034860) mod set. See group_vars/all/grandia_mods.yml.

- name: Revert the Grandia mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_grandia_revert | bool

- name: Install the Grandia mod set
  when: not (dg_grandia_revert | bool)
  block:
    - name: Locate the game's content folder
      ansible.builtin.stat:
        path: "{{ dg_grandia_content_dir }}/FIELD"
      register: _gr_content

    - name: Fail when Grandia HD Remaster is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_grandia_content_dir }} not found (appid {{ dg_grandia_appid }}).
          Install the game + mount the USB library, or override
          dg_grandia_steam_library_root. See docs/nexusmods.md.
      when: not _gr_content.stat.exists

    # --- Mod 1: HD texture overlay ---

    - name: Download the HD textures mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game grandiahdremaster
          --mod {{ dg_grandia_hd_textures_mod }} --via api
          --dest {{ (dg_grandia_staging_root + '/1-hd-textures') | quote }}
      register: _gr_dl
      changed_when: "'saved' in _gr_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Find the staged HD textures archive
      ansible.builtin.find:
        paths: "{{ dg_grandia_staging_root }}/1-hd-textures"
        patterns: ["*.rar", "*.zip", "*.7z"]
      register: _gr_staged

    - name: Fail when the HD textures mod is not staged
      ansible.builtin.fail:
        msg: >-
          Grandia HD textures (mod 1) not staged. Set NEXUS_MODS_API_KEY or
          download grandiahdremaster/mods/1 into
          {{ dg_grandia_staging_root }}/1-hd-textures/.
      when: _gr_staged.matched == 0

    - name: Overlay the HD textures into content/ (marker-gated)
      ansible.builtin.shell: |
        set -eu
        marker="{{ dg_grandia_content_dir }}/.dg-grandia-hd-textures"
        [ -f "$marker" ] && { echo "up-to-date"; exit 0; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" {{ _gr_staged.files[0].path | quote }} >/dev/null
        rsync -a "$tmp"/ {{ dg_grandia_content_dir | quote }}/
        touch "$marker"
        echo "hd-textures-installed"
      register: _gr_hd
      changed_when: "'hd-textures-installed' in _gr_hd.stdout"

    # --- Mod 2: remove smoothing filters (menu option A) ---

    - name: Remove the smoothing-filter data (move to _backup)
      ansible.builtin.shell: |
        set -eu
        c={{ dg_grandia_content_dir | quote }}
        marker="$c/.dg-grandia-filters-removed"
        [ -f "$marker" ] && { echo "already-removed"; exit 0; }
        mkdir -p "$c/BATLE/_backup" "$c/BIN/_backup" "$c/FIELD/_backup"
        for f in "$c/BATLE/"*.tpk; do [ -e "$f" ] && mv "$f" "$c/BATLE/_backup/" || true; done
        [ -e "$c/BIN/pgmdt_pgmdt__spriteinfo.bin" ] && mv "$c/BIN/pgmdt_pgmdt__spriteinfo.bin" "$c/BIN/_backup/" || true
        for f in "$c/FIELD/"*_spriteinfo.bin; do
          [ -e "$f" ] || continue
          case "$f" in *_maps_*) : ;; *) mv "$f" "$c/FIELD/_backup/" || true ;; esac
        done
        touch "$marker"
        echo "filters-removed"
      register: _gr_filters
      changed_when: "'filters-removed' in _gr_filters.stdout"
      when: dg_grandia_remove_filters | bool

    # --- Mod 2: skip intro (menu option C) ---

    - name: Skip the new-game intro cutscene (move movie to _backup)
      ansible.builtin.shell: |
        set -eu
        c={{ dg_grandia_content_dir | quote }}
        marker="$c/.dg-grandia-intro-skipped"
        [ -f "$marker" ] && { echo "already-skipped"; exit 0; }
        mkdir -p "$c/movie/_backup"
        [ -e "$c/movie/mov00.mp4" ] && mv "$c/movie/mov00.mp4" "$c/movie/_backup/" || true
        touch "$marker"
        echo "intro-skipped"
      register: _gr_intro
      changed_when: "'intro-skipped' in _gr_intro.stdout"
      when: dg_grandia_skip_intro | bool

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "Grandia: HD textures overlaid; filters removed={{ dg_grandia_remove_filters }}; intro skipped={{ dg_grandia_skip_intro }}."
          - "Revert: -e dg_grandia_revert=true (moves filter/intro files back; HD textures via Steam Verify integrity)."
