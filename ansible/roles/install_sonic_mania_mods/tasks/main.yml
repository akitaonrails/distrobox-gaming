---
# Sonic Mania modding stack: Megamix (Proton + Mania Mod Loader), the native
# Mania decompilation, and Sonic 2 (2013) + Sonic 2 Mania (RSDKv4 decomp).
# See group_vars/all/sonic_mania_mods.yml and docs/sonic-mania-mods.md.

- name: Install build deps inside the box
  ansible.builtin.shell: >-
    {{ dg_in_box }} sudo pacman -S --needed --noconfirm {{ dg_s2013_packages | join(' ') }}
  register: _mania_pacman
  changed_when: "'installing' in _mania_pacman.stdout or 'upgrading' in _mania_pacman.stdout"

# --- 1. Megamix on Steam Sonic Mania (Proton + Mania Mod Loader) ---
- name: Assert the Steam Sonic Mania install and NAS archives exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ dg_mania_game_dir }}/SonicMania.exe"
    - "{{ dg_mania_loader_7z }}"
    - "{{ dg_mania_megamix_rar }}"
  loop_control:
    label: "{{ item | basename }}"
  register: _mania_files
  failed_when: not _mania_files.stat.exists

- name: Extract the Mania Mod Loader into the game dir (once)
  ansible.builtin.shell: |
    {{ dg_in_box }} bash -c '
      set -eu
      cd "{{ dg_mania_game_dir }}"
      [ -f mods/ManiaModLoader.dll ] && exit 0
      7z x -y "{{ dg_mania_loader_7z }}" >/dev/null
      echo loader-extracted
    '
  register: _mania_loader
  changed_when: "'loader-extracted' in _mania_loader.stdout"

- name: Install the loader proxy ("Install loader" = ManiaModLoader.dll as d3d9.dll)
  ansible.builtin.copy:
    src: "{{ dg_mania_game_dir }}/mods/ManiaModLoader.dll"
    dest: "{{ dg_mania_game_dir }}/d3d9.dll"
    remote_src: true
    force: false
    mode: "0644"

- name: Extract Megamix into the game mods dir (once)
  ansible.builtin.shell: |
    {{ dg_in_box }} bash -c '
      set -eu
      cd "{{ dg_mania_game_dir }}/mods"
      [ -d "{{ dg_mania_megamix_mod_dir }}" ] && exit 0
      tmp="$(mktemp -d)"
      7z x -y -o"$tmp" "{{ dg_mania_megamix_rar }}" >/dev/null
      src="$(find "$tmp" -maxdepth 3 -type d -name "{{ dg_mania_megamix_mod_dir }}" | head -1)"
      cp -r "$src" .
      amy="$(find "$tmp" -maxdepth 3 -type d -name "Amy in *Lock-On" | head -1)"
      [ -n "$amy" ] && cp -r "$amy" . || true
      rm -rf "$tmp"
      echo megamix-installed
    '
  register: _mania_megamix
  changed_when: "'megamix-installed' in _mania_megamix.stdout"

- name: Enable Megamix in the loader config (first install only)
  ansible.builtin.copy:
    content: |
      Mod1={{ dg_mania_megamix_mod_dir }}
    dest: "{{ dg_mania_game_dir }}/mods/ManiaModLoader.ini"
    force: false
    mode: "0644"

# --- 2. Native Sonic Mania decompilation (data-only mods) ---
- name: Clone + build the Sonic Mania decompilation (once)
  ansible.builtin.shell: |
    {{ dg_in_box }} bash -c '
      set -eu
      [ -x "{{ dg_maniadec_game_dir }}/RSDKv5U" ] && exit 0
      [ -d "{{ dg_maniadec_src }}/.git" ] || git clone --recursive "{{ dg_maniadec_repo }}" "{{ dg_maniadec_src }}"
      cd "{{ dg_maniadec_src }}"
      cmake -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
      make -C build -j"$(nproc)" >/dev/null
      mkdir -p "{{ dg_maniadec_game_dir }}/mods"
      cp build/dependencies/RSDKv5/RSDKv5U build/libGame.so "{{ dg_maniadec_game_dir }}/"
      chmod 0755 "{{ dg_maniadec_game_dir }}/RSDKv5U"
      ln -sf "{{ dg_mania_game_dir }}/Data.rsdk" "{{ dg_maniadec_game_dir }}/Data.rsdk"
      echo maniadec-built
    '
  register: _maniadec
  changed_when: "'maniadec-built' in _maniadec.stdout"

# --- 3. Sonic 2 (2013) decomp + Sonic 2 Mania mod ---
- name: Clone + build the RSDKv4 decompilation (once)
  ansible.builtin.shell: |
    {{ dg_in_box }} bash -c '
      set -eu
      [ -x "{{ dg_s2013_game_dir }}/RSDKv4" ] && exit 0
      [ -d "{{ dg_s2013_src }}/.git" ] || git clone --recursive "{{ dg_s2013_repo }}" "{{ dg_s2013_src }}"
      cd "{{ dg_s2013_src }}"
      cmake -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
      make -C build -j"$(nproc)" >/dev/null
      mkdir -p "{{ dg_s2013_game_dir }}/mods"
      cp build/RSDKv4 "{{ dg_s2013_game_dir }}/"
      chmod 0755 "{{ dg_s2013_game_dir }}/RSDKv4"
      echo s2013-built
    '
  register: _s2013
  changed_when: "'s2013-built' in _s2013.stdout"

- name: Extract Sonic 2 (2013) Data.rsdk from the user's XAPK (once)
  ansible.builtin.shell: |
    set -eu
    [ -f "{{ dg_s2013_game_dir }}/Data.rsdk" ] && exit 0
    tmp="$(mktemp -d)"
    unzip -oq "{{ dg_s2013_xapk }}" com.sega.sonic2.runner.apk -d "$tmp"
    unzip -oq "$tmp/com.sega.sonic2.runner.apk" "assets/Data.rsdk.xmf" -d "$tmp"
    cp "$tmp/assets/Data.rsdk.xmf" "{{ dg_s2013_game_dir }}/Data.rsdk"
    rm -rf "$tmp"
    echo s2data-staged
  register: _s2data
  changed_when: "'s2data-staged' in _s2data.stdout"

- name: Install the Sonic 2 Mania mod + enable it (once)
  ansible.builtin.shell: |
    set -eu
    cd "{{ dg_s2013_game_dir }}/mods"
    [ -d "Sonic 2 Mania" ] || unzip -oq "{{ dg_s2013_mod_zip }}"
    [ -f modconfig.ini ] || printf '[mods]\nSonic 2 Mania=y\n' > modconfig.ini
    echo s2mod-ready
  register: _s2mod
  changed_when: false

- name: Seed Sonic 2 (2013) settings fullscreen + dev menu (first install only)
  ansible.builtin.shell: |
    set -eu
    f="{{ dg_s2013_game_dir }}/settings.ini"
    [ -f "$f" ] && exit 0
    # VSync stays OFF: on the 240Hz panel it ties the engine to 240fps
    # (game runs ~4x fast); the engine's own RefreshRate=60 limiter paces it.
    printf '[Dev]\nDevMenu=true\n\n[Window]\nFullScreen=true\nBorderless=true\nVSync=false\nRefreshRate=60\n' > "$f"
    echo seeded
  register: _s2set
  changed_when: "'seeded' in _s2set.stdout"

- name: Deploy the launchers
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ dg_box_home }}/bin/{{ item.name }}"
    mode: "0755"
  loop:
    - { src: sonic2-2013.sh.j2, name: sonic2-2013 }
    - { src: sonic-mania-decomp.sh.j2, name: sonic-mania-decomp }
    - { src: mania-mode.sh.j2, name: mania-mode }
  loop_control:
    label: "{{ item.name }}"

- name: Render the desktop entries
  ansible.builtin.template:
    src: "{{ item }}.desktop.j2"
    dest: "{{ dg_desktop_render_dir }}/gaming-{{ item }}.desktop"
    mode: "0644"
  loop:
    - sonic2-2013
    - sonic-mania-decomp
    - sonic-mania-megamix
    - sonic-mania-vanilla

- name: Install the desktop entries into the host applications dir
  ansible.builtin.command:
    cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  environment:
    DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
    DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
  register: _mania_host_launchers
  changed_when: >-
    'installed ' in _mania_host_launchers.stdout or
    'removed stale ' in _mania_host_launchers.stdout

- name: Report
  ansible.builtin.debug:
    msg:
      - "Megamix: loader (d3d9.dll proxy) + mod installed into the Steam Sonic Mania dir; needs launch option WINEDLLOVERRIDES=\"d3d9=n,b\" %command% (steam_launch_options map) and launching THROUGH Steam."
      - "Sonic 2 (2013) + Sonic 2 Mania: native RSDKv4 decomp at {{ dg_s2013_game_dir }} (bin/sonic2-2013)."
      - "Native Mania decomp (data-only mods) at {{ dg_maniadec_game_dir }} (bin/sonic-mania-decomp)."
