---
# akitaonrails/rea-colin-mcrae-3 ships a self-contained AppImage: its own Wine
# (WoW64, so the 32-bit game needs no multilib), DXVK, SilentPatch, Xidi and
# the HD UI, plus a settings window then the game in gamescope. The role stages
# the pinned AppImage, seeds the launcher's own launcher.cfg, migrates the CMR3
# profile out of the retired pc-racing install, and removes that install.

- name: Check the owned Colin McRae Rally 3 source executable
  ansible.builtin.stat:
    path: "{{ dg_cmr3_exe }}"
    checksum_algorithm: sha256
  register: _cmr3_exe

- name: Require the supported DRM-free v1.1 executable
  ansible.builtin.assert:
    that:
      - _cmr3_exe.stat.exists
      - _cmr3_exe.stat.checksum == dg_cmr3_exe_sha256
    fail_msg: >-
      Need a clean Colin McRae Rally 3 install (Rally_3PC.exe sha256
      c56344b4… next to Data/fonts/shaders) at {{ dg_cmr3_source_dir }};
      see docs/rea-colin-mcrae-3.md.

- name: Check for a running Colin McRae Rally 3 session before migration
  ansible.builtin.command: pgrep -x Rally_3PC.exe
  register: _cmr3_running
  failed_when: false
  changed_when: false

- name: Require Colin McRae Rally 3 to be closed for migration
  ansible.builtin.assert:
    that: _cmr3_running.rc == 1
    fail_msg: "Close Colin McRae Rally 3 before replacing the pc-racing install."

- name: Create the REA CMR3 directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_cmr3_root }}"
    - "{{ dg_cmr3_settings_dir }}"
    - "{{ dg_cmr3_saves_dir }}"
    - "{{ dg_box_home }}/bin"

- name: Stage the pinned REA CMR3 launcher AppImage
  ansible.builtin.include_role:
    name: stage_rea_appimage
  vars:
    dg_rea_stage_asset_url: "{{ dg_cmr3_asset_url }}"
    dg_rea_stage_asset_name: "{{ dg_cmr3_asset_name }}"
    dg_rea_stage_asset_sha256: "{{ dg_cmr3_asset_sha256 }}"
    dg_rea_stage_install_dir: "{{ dg_cmr3_root }}"
    dg_rea_stage_retired_names:
      - CMR3Launcher-v0.2.1-x86_64.AppImage
      - CMR3Launcher-v0.3.0-x86_64.AppImage
      - CMR3Launcher-v0.3.1-x86_64.AppImage

# Migrate the player's profile (the loose CMR3 file) from the retired
# pc-racing install into the launcher's Saved Games folder. force: false keeps
# anything the launcher has already written there.
- name: Check for a CMR3 profile in the retired pc-racing install
  ansible.builtin.stat:
    path: "{{ dg_cmr3_old_profile }}"
  register: _cmr3_old_profile

- name: Migrate the CMR3 profile into the REA prefix
  ansible.builtin.copy:
    src: "{{ dg_cmr3_old_profile }}"
    dest: "{{ dg_cmr3_saves_dir }}/CMR3"
    remote_src: true
    force: false
    mode: "0644"
  when: _cmr3_old_profile.stat.exists

# The settings window fills resolution from the screen when unset; seeding the
# maxed-out values keeps a headless --play on the 4K panel with DXVK on. force:
# false — once the launcher or the player writes the file, it is theirs.
- name: Seed the REA CMR3 launcher settings
  ansible.builtin.copy:
    dest: "{{ dg_cmr3_settings_dir }}/launcher.cfg"
    mode: "0644"
    force: false
    content: |
      # Colin McRae Rally 3 launcher settings (seeded by install_rea_colin_mcrae_3).
      game = {{ dg_cmr3_win_source }}
      resolution = {{ dg_cmr3_settings.resolution }}
      display_mode = {{ dg_cmr3_settings.display_mode }}
      vsync = {{ dg_cmr3_settings.vsync }}
      anisotropic = {{ dg_cmr3_settings.anisotropic }}
      fsaa = {{ dg_cmr3_settings.fsaa }}
      hd_ui = {{ dg_cmr3_settings.hd_ui }}
      shadows = {{ dg_cmr3_settings.shadows }}
      gamepad = {{ dg_cmr3_settings.gamepad }}
      dxvk = {{ dg_cmr3_settings.dxvk }}
      scaler = {{ dg_cmr3_settings.scaler }}

- name: Remember the game folder on an already-written config
  ansible.builtin.lineinfile:
    path: "{{ dg_cmr3_settings_dir }}/launcher.cfg"
    regexp: "^game *="
    line: "game = {{ dg_cmr3_win_source }}"
    insertbefore: BOF

- name: Install the reentrant REA CMR3 launcher
  ansible.builtin.template:
    src: rea-colin-mcrae-3.sh.j2
    dest: "{{ dg_cmr3_launcher }}"
    mode: "0755"

- name: Render the REA CMR3 desktop entry
  ansible.builtin.template:
    src: rea-colin-mcrae-3.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/rea-colin-mcrae-3.desktop"
    mode: "0644"

- name: Publish the REA CMR3 desktop entry
  ansible.builtin.command: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  changed_when: false

# Retire the pc-racing CMR3 install: launchers, entries, the installed game
# copy (now staged clean on the NAS) and its per-game Wine prefix.
- name: Remove the retired pc-racing CMR3 launchers and desktop entry
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ dg_cmr3_old_bin + [dg_desktop_render_dir ~ '/' ~ dg_cmr3_old_desktop,
                               dg_host_applications_dir ~ '/' ~ dg_cmr3_old_desktop] }}"

- name: Remove the retired pc-racing CMR3 install and prefix
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ dg_cmr3_old_install }}"
    - "{{ dg_cmr3_old_prefix }}"
