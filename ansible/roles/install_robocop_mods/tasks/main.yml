---
# RoboCop: Rogue City (appid 1681430) mod set — UE5 ~mods pak drops.
# See group_vars/all/robocop_mods.yml and docs/nexusmods.md.

- name: Revert the RoboCop mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_robocop_revert | bool

- name: Install the RoboCop mod set
  when: not (dg_robocop_revert | bool)
  block:
    - name: Locate the RoboCop Paks dir
      ansible.builtin.stat:
        path: "{{ dg_robocop_game_dir }}/Game/Content/Paks"
      register: _rc_paks

    - name: Fail when RoboCop is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_robocop_game_dir }}/Game/Content/Paks not found
          (appid {{ dg_robocop_appid }}). Install RoboCop + mount the USB library,
          or override dg_robocop_steam_library_root. See docs/nexusmods.md.
      when: not _rc_paks.stat.exists

    - name: Download each RoboCop mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game robocoproguecity
          --mod {{ item.id }} --file {{ item.file }} --via api
          --dest {{ (dg_robocop_staging_root + '/' + item.id) | quote }}
      loop: "{{ dg_robocop_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _rc_dl
      changed_when: "'saved' in _rc_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Install each mod's pak triplet into ~mods (records a manifest)
      ansible.builtin.shell: |
        set -eu
        game={{ dg_robocop_game_dir | quote }}
        mods_dir="$game/{{ dg_robocop_mods_subdir }}"
        manifest="$game/.dg-robocop-{{ item.id }}.manifest"
        [ -f "$manifest" ] && { echo "skip"; exit 0; }
        arch="$(find {{ (dg_robocop_staging_root + '/' + item.id) | quote }} -type f \
          \( -name '*.zip' -o -name '*.rar' -o -name '*.7z' \) | head -1)"
        [ -n "$arch" ] || { echo "NO-ARCHIVE" >&2; exit 3; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" "$arch" >/dev/null
        mkdir -p "$mods_dir"
        find "$tmp" \( -name '*.pak' -o -name '*.ucas' -o -name '*.utoc' \) > "$tmp/.paklist"
        [ -s "$tmp/.paklist" ] || { echo "NO-PAK" >&2; exit 4; }
        : > "$manifest.tmp"
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          cp -f "$f" "$mods_dir/"
          basename "$f" >> "$manifest.tmp"
        done < "$tmp/.paklist"
        mv "$manifest.tmp" "$manifest"
        echo "robocop-installed"
      loop: "{{ dg_robocop_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _rc_install
      changed_when: "'robocop-installed' in _rc_install.stdout"

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "RoboCop: installed {{ dg_robocop_mods | map(attribute='name') | join(', ') }} into Game/Content/Paks/~mods/."
          - "Excluded: 7 (Engine.ini config), 2 (UE4SS Lua, wrong build), 49 (save files). Revert: -e dg_robocop_revert=true."
