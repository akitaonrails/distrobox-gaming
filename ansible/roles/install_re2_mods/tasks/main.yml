---
# Resident Evil 2 (appid 883710) mod set — Fluffy natives/ + patch .pak overlays.
# See group_vars/all/re2_mods.yml and docs/nexusmods.md.

- name: Revert the RE2 mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_re2_revert | bool

- name: Install the RE2 mod set
  when: not (dg_re2_revert | bool)
  block:
    - name: Locate the RE2 game dir
      ansible.builtin.stat:
        path: "{{ dg_re2_game_dir }}"
      register: _re2_game

    - name: Fail when RE2 is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_re2_game_dir }} not found (appid {{ dg_re2_appid }}).
          Install RE2, or override dg_re2_steam_library_root. See docs/nexusmods.md.
      when: not _re2_game.stat.exists

    - name: Download each RE2 mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game residentevil22019
          --mod {{ item.id }} --file {{ item.file }} --via api
          --dest {{ (dg_re2_staging_root + '/' + item.id) | quote }}
      loop: "{{ dg_re2_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _re2_dl
      changed_when: "'saved' in _re2_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Install each Fluffy overlay (natives/ tree or patch .pak)
      ansible.builtin.shell: |
        set -eu
        game={{ dg_re2_game_dir | quote }}
        manifest="$game/.dg-re2-{{ item.id }}.manifest"
        [ -f "$manifest" ] && { echo "skip"; exit 0; }
        arch="$(find {{ (dg_re2_staging_root + '/' + item.id) | quote }} -type f \
          \( -name '*.zip' -o -name '*.rar' -o -name '*.7z' \) | head -1)"
        [ -n "$arch" ] || { echo "NO-ARCHIVE" >&2; exit 3; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" "$arch" >/dev/null
        variant={{ item.variant | quote }}
        if [ -n "$variant" ]; then
          mi="$(find "$tmp" -path "*$variant/modinfo.ini" | head -1)"
        else
          mi="$(find "$tmp" -name modinfo.ini | head -1)"
        fi
        [ -n "$mi" ] || { echo "NO-MODINFO" >&2; exit 4; }
        src="$(dirname "$mi")"
        if [ -d "$src/natives" ]; then
          ( cd "$src" && find natives -type f ) > "$manifest.tmp"
          rsync -a "$src/natives/" "$game/natives/"
        elif ls "$src"/*.pak >/dev/null 2>&1; then
          slot={{ (item.pak_slot | default('900')) | quote }}
          pak="$(ls "$src"/*.pak | head -1)"
          rel="re_chunk_000.pak.patch_${slot}.pak"
          cp -f "$pak" "$game/$rel"
          echo "$rel" > "$manifest.tmp"
        else
          echo "NO-PAYLOAD" >&2; exit 5
        fi
        mv "$manifest.tmp" "$manifest"
        echo "re2-installed"
      loop: "{{ dg_re2_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}{{ ' [' + item.variant + ']' if item.variant else '' }}"
      register: _re2_install
      changed_when: "'re2-installed' in _re2_install.stdout"

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "RE2: installed {{ dg_re2_mods | map(attribute='name') | join(', ') }} (Fluffy natives/ + patch .pak; RT-build natives/stm)."
          - "Skipped 182 WAO + 205 Full Pack Ammo (legacy natives/x64, ignored by the RT build). Revert: -e dg_re2_revert=true."
