---
# Remove each RE2 overlay using its recorded manifest.

- name: Remove each installed overlay via its manifest
  ansible.builtin.shell: |
    set -eu
    game={{ dg_re2_game_dir | quote }}
    manifest="$game/.dg-re2-{{ item.id }}.manifest"
    [ -f "$manifest" ] || { echo "nochange"; exit 0; }
    while IFS= read -r f; do
      [ -n "$f" ] && rm -f "$game/$f"
    done < "$manifest"
    rm -f "$manifest"
    [ -d "$game/natives" ] && find "$game/natives" -type d -empty -delete 2>/dev/null || true
    echo "re2-reverted"
  loop: "{{ dg_re2_mods }}"
  loop_control:
    label: "{{ item.id }} {{ item.name }}"
  register: _re2_revert
  changed_when: "'re2-reverted' in _re2_revert.stdout"
