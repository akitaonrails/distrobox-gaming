---
# Elden Ring (appid 1245620) mod set — Easy Mode regulation.bin swap.
# See group_vars/all/eldenring_mods.yml and docs/nexusmods.md.

- name: Revert the Elden Ring mod when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_eldenring_revert | bool

- name: Install the Elden Ring mod
  when: not (dg_eldenring_revert | bool)
  block:
    - name: Locate the game's regulation.bin
      ansible.builtin.stat:
        path: "{{ dg_eldenring_regulation }}"
      register: _er_reg

    - name: Fail when Elden Ring is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_eldenring_regulation }} not found (appid {{ dg_eldenring_appid }}).
          Install the game + mount the USB library, or override
          dg_eldenring_steam_library_root. See docs/nexusmods.md.
      when: not _er_reg.stat.exists

    - name: Ensure the backup dir exists
      ansible.builtin.file:
        path: "{{ dg_eldenring_backup_dir }}"
        state: directory
        mode: "0755"

    - name: Back up the stock regulation.bin
      ansible.builtin.copy:
        src: "{{ dg_eldenring_regulation }}"
        dest: "{{ dg_eldenring_backup_dir }}/regulation.bin.stock"
        remote_src: true
        force: false
        mode: "0644"

    - name: Download the chosen variant via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game eldenring
          --mod 146 --file {{ dg_eldenring_files[dg_eldenring_variant] }} --via api
          --dest {{ (dg_eldenring_staging_root + '/146-easymode-' + dg_eldenring_variant) | quote }}
      register: _er_dl
      changed_when: "'saved' in _er_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Find the staged variant archive
      ansible.builtin.find:
        paths: "{{ dg_eldenring_staging_root }}/146-easymode-{{ dg_eldenring_variant }}"
        patterns: ["*.zip", "*.7z", "*.rar"]
      register: _er_staged

    - name: Fail when the variant is not staged
      ansible.builtin.fail:
        msg: >-
          Elden Ring Easy Mode variant "{{ dg_eldenring_variant }}" not staged.
          Set NEXUS_MODS_API_KEY or download eldenring/mods/146 (file
          {{ dg_eldenring_files[dg_eldenring_variant] }}) into
          {{ dg_eldenring_staging_root }}/146-easymode-{{ dg_eldenring_variant }}/.
      when: _er_staged.matched == 0

    - name: Install the Easy Mode regulation.bin (marker-gated)
      ansible.builtin.shell: |
        set -eu
        marker="{{ dg_eldenring_game_dir }}/Game/.dg-eldenring-easymode"
        want="{{ dg_eldenring_variant }}"
        [ -f "$marker" ] && [ "$(cat "$marker")" = "$want" ] && { echo "up-to-date"; exit 0; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" {{ _er_staged.files[0].path | quote }} >/dev/null
        reg="$(find "$tmp" -name 'regulation.bin' | head -1)"
        [ -n "$reg" ] || { echo "no regulation.bin in archive"; exit 4; }
        cp -f "$reg" {{ dg_eldenring_regulation | quote }}
        printf '%s' "$want" > "$marker"
        echo "installed easymode-$want"
      register: _er_install
      changed_when: "'installed' in _er_install.stdout"

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "Elden Ring Easy Mode ({{ dg_eldenring_variant }}) installed (regulation.bin swapped)."
          - "PLAY OFFLINE — a modded regulation online = permanent ban. Targets game 1.12.2 + SotE."
          - "For a clean EAC bypass, load via ModEngine2 on Proton (github.com/Cloudef/elden-proton) — same regulation.bin into ModEngine2's mod/ folder."
          - "Change variant: -e dg_eldenring_variant=damage|personal. Revert: -e dg_eldenring_revert=true."
