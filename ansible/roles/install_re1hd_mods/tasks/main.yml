---
# Resident Evil HD Remaster (RE1, appid 304240) mod set — MT Framework nativePC/
# overlays plus one patched-exe drop. See group_vars/all/re1hd_mods.yml and
# docs/nexusmods.md.

- name: Revert the RE1 HD mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_re1hd_revert | bool

- name: Install the RE1 HD mod set
  when: not (dg_re1hd_revert | bool)
  block:
    - name: Locate the RE1 HD game dir
      ansible.builtin.stat:
        path: "{{ dg_re1hd_game_dir }}"
      register: _re1_game

    - name: Fail when RE1 HD is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_re1hd_game_dir }} not found (appid {{ dg_re1hd_appid }}).
          Install RE HD Remaster, or override dg_re1hd_steam_library_root.
          See docs/nexusmods.md.
      when: not _re1_game.stat.exists

    - name: Download each RE1 HD mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py
          --game residentevilbiohazardhdremaster
          --mod {{ item.id }} {{ ('--file ' + item.file) if (item.file is defined) else '' }} --via api
          --dest {{ (dg_re1hd_staging_root + '/' + item.id) | quote }}
      loop: "{{ dg_re1hd_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _re1_dl
      changed_when: "'saved' in _re1_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Install each nativePC/ overlay (records a manifest)
      ansible.builtin.shell: |
        set -eu
        game={{ dg_re1hd_game_dir | quote }}
        manifest="$game/.dg-re1hd-{{ item.id }}.manifest"
        [ -f "$manifest" ] && { echo "skip"; exit 0; }
        arch="$(find {{ (dg_re1hd_staging_root + '/' + item.id) | quote }} -type f \
          \( -name '*.zip' -o -name '*.rar' -o -name '*.7z' \) | head -1)"
        [ -n "$arch" ] || { echo "NO-ARCHIVE" >&2; exit 3; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" "$arch" >/dev/null
        np="$(find "$tmp" -type d -iname nativePC | head -1)"
        [ -n "$np" ] || { echo "NO-NATIVEPC" >&2; exit 4; }
        ( cd "$(dirname "$np")" && find "$(basename "$np")" -type f ) > "$manifest.tmp"
        rsync -a "$np/" "$game/$(basename "$np")/"
        mv "$manifest.tmp" "$manifest"
        echo "re1hd-installed"
      loop: "{{ dg_re1hd_mods | selectattr('type', 'equalto', 'nativepc') | list }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _re1_np
      changed_when: "'re1hd-installed' in _re1_np.stdout"

    - name: Install each patched-exe drop (backs up the original once)
      ansible.builtin.shell: |
        set -eu
        game={{ dg_re1hd_game_dir | quote }}
        exe="{{ item.exe }}"
        marker="$game/.dg-re1hd-{{ item.id }}.exe"
        [ -f "$marker" ] && { echo "skip"; exit 0; }
        arch="$(find {{ (dg_re1hd_staging_root + '/' + item.id) | quote }} -type f \
          \( -name '*.zip' -o -name '*.rar' -o -name '*.7z' \) | head -1)"
        [ -n "$arch" ] || { echo "NO-ARCHIVE" >&2; exit 3; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" "$arch" >/dev/null
        new="$(find "$tmp" -type f -name "$exe" | head -1)"
        [ -n "$new" ] || { echo "NO-EXE ($exe)" >&2; exit 4; }
        [ -f "$game/$exe" ] && [ ! -f "$game/$exe.original" ] && cp "$game/$exe" "$game/$exe.original"
        cp -f "$new" "$game/$exe"
        printf '%s\n' "{{ item.name }}" > "$marker"
        echo "re1hd-exe-installed"
      loop: "{{ dg_re1hd_mods | selectattr('type', 'equalto', 'exe') | list }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _re1_exe
      changed_when: "'re1hd-exe-installed' in _re1_exe.stdout"

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "RE1 HD: installed {{ dg_re1hd_mods | map(attribute='name') | join(', ') }}."
          - "102/20 are MT Framework nativePC/ overlays; 113 replaces bhd.exe (original backed up). Revert: -e dg_re1hd_revert=true."
