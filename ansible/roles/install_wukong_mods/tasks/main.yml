---
# Black Myth: Wukong (appid 2358720) mod set — RE-UE4SS loader + Auto Regen Lua
# mod. See group_vars/all/wukong_mods.yml and docs/nexusmods.md.

- name: Revert the Wukong mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_wukong_revert | bool

- name: Install the Wukong mod set
  when: not (dg_wukong_revert | bool)
  block:
    - name: Locate the game's Win64 binaries dir
      ansible.builtin.stat:
        path: "{{ dg_wukong_win64_dir }}"
      register: _wk_win64

    - name: Fail when Black Myth Wukong is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_wukong_win64_dir }} not found (appid {{ dg_wukong_appid }}).
          Install the game + mount the USB library, or override
          dg_wukong_steam_library_root. See docs/nexusmods.md.
      when: not _wk_win64.stat.exists

    - name: Ensure staging dirs exist
      ansible.builtin.file:
        path: "{{ dg_wukong_staging_root }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dg_wukong_ue4ss_dir }}"
        - "{{ dg_wukong_mods[0].dir }}"

    - name: Download RE-UE4SS + the mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: "{{ item.cmd }}"
      loop:
        - cmd: >-
            {{ dg_project_root }}/scripts/nexus-download.py --game blackmythwukong
            --mod {{ dg_wukong_ue4ss_mod }} --file {{ dg_wukong_ue4ss_file }} --via api
            --dest {{ (dg_wukong_staging_root + '/' + dg_wukong_ue4ss_dir) | quote }}
        - cmd: >-
            {{ dg_project_root }}/scripts/nexus-download.py --game blackmythwukong
            --mod {{ dg_wukong_mods[0].id }} --via api
            --dest {{ (dg_wukong_staging_root + '/' + dg_wukong_mods[0].dir) | quote }}
      loop_control:
        label: "nexus-download"
      register: _wk_dl
      changed_when: "'saved' in _wk_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    # --- RE-UE4SS loader ---

    - name: Find the staged UE4SS archive
      ansible.builtin.find:
        paths: "{{ dg_wukong_staging_root }}/{{ dg_wukong_ue4ss_dir }}"
        patterns: ["*.zip"]
      register: _wk_ue4ss_staged

    - name: Fail when UE4SS is not staged
      ansible.builtin.fail:
        msg: "RE-UE4SS not staged. Set NEXUS_MODS_API_KEY or download blackmythwukong/mods/19 into {{ dg_wukong_staging_root }}/{{ dg_wukong_ue4ss_dir }}/."
      when: _wk_ue4ss_staged.matched == 0

    - name: Check the UE4SS install marker
      ansible.builtin.stat:
        path: "{{ dg_wukong_game_dir }}/.dg-wukong-ue4ss"
      register: _wk_ue4ss_marker

    - name: Install RE-UE4SS into b1/Binaries/Win64
      ansible.builtin.shell: |
        set -eu
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" {{ _wk_ue4ss_staged.files[0].path | quote }} >/dev/null
        src="$(find "$tmp" -maxdepth 1 -type d -name 'WukongUE4SS' | head -1)"
        rsync -a "$src"/ {{ dg_wukong_win64_dir | quote }}/
        echo "ue4ss-installed"
      register: _wk_ue4ss_install
      changed_when: "'ue4ss-installed' in _wk_ue4ss_install.stdout"
      when: not _wk_ue4ss_marker.stat.exists

    - name: Write the UE4SS marker
      ansible.builtin.copy:
        dest: "{{ dg_wukong_game_dir }}/.dg-wukong-ue4ss"
        content: "RE-UE4SS (WukongUE4SS file {{ dg_wukong_ue4ss_file }})\n"
        mode: "0644"
      when: not _wk_ue4ss_marker.stat.exists

    # --- The Lua mod(s) (game-dir-rooted archives) ---

    - name: Find each staged mod archive
      ansible.builtin.find:
        paths: "{{ dg_wukong_staging_root }}/{{ item.dir }}"
        patterns: ["*.zip", "*.7z", "*.rar"]
      loop: "{{ dg_wukong_mods }}"
      loop_control:
        label: "{{ item.id }}"
      register: _wk_staged

    - name: Fail with a manifest when a mod is not staged
      ansible.builtin.fail:
        msg: |
          Stage these Wukong mods (set NEXUS_MODS_API_KEY or download):
          {% for r in _wk_staged.results %}
          {% if r.matched == 0 %}  - {{ r.item.id }} {{ r.item.name }} — {{ r.item.url }} -> {{ dg_wukong_staging_root }}/{{ r.item.dir }}/
          {% endif %}
          {% endfor %}
      when: _wk_staged.results | selectattr('matched', 'equalto', 0) | list | length > 0

    - name: Install each mod (game-dir-rooted) into the UE4SS Mods tree
      ansible.builtin.shell: |
        set -eu
        marker="{{ dg_wukong_game_dir }}/.dg-wukong-mod-{{ item.id }}"
        [ -f "$marker" ] && { echo "skip {{ item.id }}"; exit 0; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        arch="$(find {{ (dg_wukong_staging_root + '/' + item.dir) | quote }} -maxdepth 1 -type f \( -name '*.zip' -o -name '*.7z' -o -name '*.rar' \) | head -1)"
        7z x -y -o"$tmp" "$arch" >/dev/null
        rsync -a "$tmp"/ {{ dg_wukong_game_dir | quote }}/
        printf '%s\n' "{{ item.name }} ({{ item.url }})" > "$marker"
        echo "installed {{ item.id }}"
      loop: "{{ dg_wukong_mods }}"
      loop_control:
        label: "{{ item.id }}"
      register: _wk_install
      changed_when: "'installed' in _wk_install.stdout"

    # --- Steam launch options (dwmapi override) ---

    - name: Auto-discover the in-box Steam localconfig.vdf
      ansible.builtin.find:
        paths: "{{ dg_wukong_steam_root }}/userdata"
        patterns: localconfig.vdf
        recurse: true
      register: _wk_localconfigs
      when: dg_wukong_steam_localconfig | length == 0

    - name: Resolve the effective localconfig path
      ansible.builtin.set_fact:
        _wk_localconfig: >-
          {{ dg_wukong_steam_localconfig if (dg_wukong_steam_localconfig | length > 0)
             else (_wk_localconfigs.files | map(attribute='path') | list | first
                   if (_wk_localconfigs.files | default([]) | length == 1) else '') }}

    - name: Check if Steam is running
      ansible.builtin.shell: |
        pgrep -u "$(id -u)" -x steam >/dev/null || pgrep -u "$(id -u)" -f '/steam(webhelper)?( |$)' >/dev/null
      register: _wk_steam_running
      changed_when: false
      failed_when: false
      check_mode: false
      when: _wk_localconfig | length > 0

    - name: Warn that launch options were not set (Steam running)
      ansible.builtin.debug:
        msg: >-
          Steam is running, so the dwmapi override was NOT set. Set it manually
          (Wukong -> Properties -> Launch Options -> {{ dg_wukong_launch_options }}),
          or close Steam and re-run (idempotent). The mods are installed.
      when:
        - _wk_localconfig | length > 0
        - not (dg_wukong_stop_steam | bool)
        - _wk_steam_running.rc == 0

    - name: Set the Wukong Steam launch options (dwmapi override)
      ansible.builtin.command: >-
        {{ dg_project_root }}/scripts/set-steam-launch-options.py
        --localconfig {{ _wk_localconfig | quote }}
        --set {{ dg_wukong_appid | quote }} {{ dg_wukong_launch_options | quote }}
      register: _wk_launch
      changed_when: "'changed: true' in _wk_launch.stdout"
      when:
        - _wk_localconfig | length > 0
        - _wk_steam_running.rc != 0

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "Black Myth Wukong: RE-UE4SS + Auto Regen installed into {{ dg_wukong_win64_dir }}/ue4ss/Mods/."
          - "{{ 'Launch option set (dwmapi override).' if (_wk_localconfig | length > 0 and _wk_steam_running.rc != 0) else 'Set launch option manually: ' + dg_wukong_launch_options }}"
          - "Tune regen rate in ue4ss/Mods/BMWAutoRegen/Scripts/main.lua (VitalityConfig, rate 5-50). Revert: -e dg_wukong_revert=true."
