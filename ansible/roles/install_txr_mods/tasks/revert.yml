---
# Remove each TXR ~mods pak triplet using its recorded manifest.

- name: Remove each installed pak via its manifest
  ansible.builtin.shell: |
    set -eu
    game={{ dg_txr_game_dir | quote }}
    mods_dir="$game/{{ dg_txr_mods_subdir }}"
    manifest="$game/.dg-txr-{{ item.id }}.manifest"
    [ -f "$manifest" ] || { echo "nochange"; exit 0; }
    while IFS= read -r f; do
      [ -n "$f" ] && rm -f "$mods_dir/$f"
    done < "$manifest"
    rm -f "$manifest"
    rmdir "$mods_dir" 2>/dev/null || true
    echo "txr-reverted"
  loop: "{{ dg_txr_mods }}"
  loop_control:
    label: "{{ item.id }} {{ item.name }}"
  register: _txr_revert
  changed_when: "'txr-reverted' in _txr_revert.stdout"
