---
# Midnight Club: Los Angeles — native Xbox 360 port (CrownParkComputing rex
# recompilation). Launcher + checksums shipped; the user's own MC:LA disc is
# imported into assets/ by the bundled import_content.sh.
# See group_vars/all/midnightclub_la.yml and docs/midnightclub-la.md.

- name: Revert Midnight Club LA when requested
  when: dg_mcla_revert | bool
  block:
    - name: Remove the MC:LA launcher, desktop entry + install dir
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ dg_mcla_launcher }}"
        - "{{ dg_mcla_root }}"
        - "{{ dg_desktop_render_dir }}/gaming-midnightclubla.desktop"
    - name: Refresh host launchers after removing MC:LA
      ansible.builtin.command:
        cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
      environment:
        DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
        DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
      changed_when: true
    - name: Report MC:LA reverted
      ansible.builtin.debug:
        msg: "Midnight Club LA removed. Your disc/ISO is untouched."

- name: Install Midnight Club LA
  when: not (dg_mcla_revert | bool)
  block:
    - name: Verify the MC:LA disc image exists
      ansible.builtin.stat:
        path: "{{ dg_mcla_iso }}"
      register: _mcla_iso
      failed_when: not _mcla_iso.stat.exists

    - name: Create MC:LA directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dg_mcla_root }}"
        - "{{ dg_mcla_cache_dir }}"
        - "{{ dg_box_home }}/bin"

    - name: Install MC:LA runtime/import dependencies inside box
      ansible.builtin.shell: >-
        {{ dg_in_box }} sudo pacman -S --needed --noconfirm
        {{ dg_mcla_pacman_packages | join(' ') }}
      register: _mcla_pacman
      changed_when: "'installing' in _mcla_pacman.stdout or 'upgrading' in _mcla_pacman.stdout"

    - name: Download the pinned MC:LA launcher
      ansible.builtin.get_url:
        url: "{{ dg_mcla_asset_url }}"
        dest: "{{ dg_mcla_cache_dir }}/{{ dg_mcla_asset_name }}"
        checksum: "sha256:{{ dg_mcla_asset_sha256 }}"
        mode: "0644"

    - name: Extract the launcher (version-gated)
      ansible.builtin.shell: |
        {{ dg_in_box }} sh -lc '
          set -eu
          if [ -x "{{ dg_mcla_dir }}/midnightclubla" ] &&
             grep -qx "{{ dg_mcla_release_tag }}" "{{ dg_mcla_root }}/.dg-installed-ref" 2>/dev/null; then
            exit 0
          fi
          tar --zstd -xf "{{ dg_mcla_cache_dir }}/{{ dg_mcla_asset_name }}" -C "{{ dg_mcla_root }}"
          printf "%s\n" "{{ dg_mcla_release_tag }}" > "{{ dg_mcla_root }}/.dg-installed-ref"
          echo mcla-extracted
        '
      register: _mcla_extract
      changed_when: "'mcla-extracted' in _mcla_extract.stdout"

    - name: Import the MC:LA disc into the port (headless, from the ISO)
      # import_content.sh <path> imports without prompting; bundled rexiso reads
      # the XDVDFS .iso, copies the disc tree into assets/, checks content.sha256
      # (a region/rev mismatch warns but still populates assets/). Idempotent:
      # skips once assets/default.xex exists. This unpacks a ~7.8 GB ISO — minutes.
      ansible.builtin.shell: |
        {{ dg_in_box }} sh -lc '
          dir="{{ dg_mcla_dir }}"
          [ -f "$dir/assets/default.xex" ] && { echo mcla-content-ok; exit 0; }
          "$dir/tools/import_content.sh" "{{ dg_mcla_iso }}" || true
          [ -f "$dir/assets/default.xex" ] && echo mcla-content-imported || { echo mcla-import-FAILED >&2; exit 1; }
        '
      register: _mcla_import
      changed_when: "'mcla-content-imported' in _mcla_import.stdout"
      failed_when: "'mcla-import-FAILED' in _mcla_import.stderr"

    - name: Deploy the MC:LA launcher wrapper
      ansible.builtin.template:
        src: midnightclubla.sh.j2
        dest: "{{ dg_mcla_launcher }}"
        mode: "0755"

    - name: Render the MC:LA desktop entry
      ansible.builtin.template:
        src: midnightclubla.desktop.j2
        dest: "{{ dg_desktop_render_dir }}/gaming-midnightclubla.desktop"
        mode: "0644"

    - name: Install the desktop file into the host applications dir
      ansible.builtin.command:
        cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
      environment:
        DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
        DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
      register: _mcla_host_launchers
      changed_when: >-
        'installed ' in _mcla_host_launchers.stdout or
        'removed stale ' in _mcla_host_launchers.stdout

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Midnight Club: Los Angeles ({{ dg_mcla_release_tag }}) at {{ dg_mcla_dir }};
          launcher {{ dg_mcla_launcher }}. Saves in {{ dg_mcla_dir }}/user-data.
          Revert: -e dg_mcla_revert=true.
