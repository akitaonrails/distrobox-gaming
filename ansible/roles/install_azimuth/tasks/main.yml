---
- name: Check the Forza Horizon 2 game layout
  ansible.builtin.stat:
    path: "{{ dg_azimuth_game_dir }}/{{ item }}"
  loop:
    - era.vbi
    - Mount/AppxManifest.xml
    - Mount
    - EmbeddedXvd
  register: _azimuth_game_files

- name: Require Azimuth-compatible Xbox One files
  ansible.builtin.assert:
    that:
      - _azimuth_game_files.results[0].stat.isreg | default(false)
      - _azimuth_game_files.results[1].stat.isreg | default(false)
      - _azimuth_game_files.results[2].stat.isdir | default(false)
      - _azimuth_game_files.results[3].stat.isdir | default(false)
    fail_msg: "Expected Xbox One Forza Horizon 2 v1.0.0.64 with era.vbi, Mount/AppxManifest.xml, Mount/ and EmbeddedXvd/ under dg_azimuth_game_dir."

- name: Confirm the Xbox One game version from its manifest
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys
        import xml.etree.ElementTree as ET
        identity = ET.parse(sys.argv[1]).getroot().find('{*}Identity')
        version = identity.get('Version') if identity is not None else None
        if version != sys.argv[2]:
            raise SystemExit(f'Unsupported game version: {version!r}')
        print(version)
      - "{{ dg_azimuth_game_dir }}/Mount/AppxManifest.xml"
      - "{{ dg_azimuth_supported_game_version }}"
  changed_when: false

- name: Check the downloaded Azimuth package
  ansible.builtin.stat:
    path: "{{ dg_azimuth_zip }}"
    checksum_algorithm: sha256
  register: _azimuth_zip

- name: Verify the Azimuth package and Proton
  ansible.builtin.assert:
    that:
      - _azimuth_zip.stat.isreg | default(false)
      - _azimuth_zip.stat.checksum | default('') == dg_azimuth_zip_sha256
      - dg_azimuth_proton is file
    fail_msg: "Azimuth zip hash or Proton executable is missing; check dg_azimuth_zip and dg_azimuth_proton."

- name: Create Azimuth installation directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_azimuth_install_dir }}"
    - "{{ dg_box_home }}/bin"

- name: Check installed Azimuth version marker
  ansible.builtin.stat:
    path: "{{ dg_azimuth_install_dir }}/.dg-installed-{{ dg_azimuth_version }}"
  register: _azimuth_installed

- name: Extract Azimuth wrapper into its install directory
  ansible.builtin.unarchive:
    src: "{{ dg_azimuth_zip }}"
    dest: "{{ dg_azimuth_install_dir }}"
    remote_src: true
  when: not _azimuth_installed.stat.exists

- name: Record installed Azimuth version
  ansible.builtin.file:
    path: "{{ dg_azimuth_install_dir }}/.dg-installed-{{ dg_azimuth_version }}"
    state: touch
    mode: "0644"
  when: not _azimuth_installed.stat.exists

- name: Check the matching Extra Options archive
  ansible.builtin.stat:
    path: "{{ dg_azimuth_extra_options_zip }}"
    checksum_algorithm: sha256
  register: _azimuth_extra_options_zip

- name: Verify the Extra Options archive
  ansible.builtin.assert:
    that:
      - _azimuth_extra_options_zip.stat.isreg | default(false)
      - _azimuth_extra_options_zip.stat.checksum | default('') == dg_azimuth_extra_options_sha256
    fail_msg: "Expected the pinned Extra Options {{ dg_azimuth_extra_options_version }} archive for Azimuth {{ dg_azimuth_version }}."

- name: Check installed Extra Options version
  ansible.builtin.stat:
    path: "{{ dg_azimuth_install_dir }}/.dg-extra-options-{{ dg_azimuth_extra_options_version }}"
  register: _azimuth_extra_options_installed

- name: Install Extra Options without replacing user settings or saves
  when: not _azimuth_extra_options_installed.stat.exists
  block:
    - name: Create temporary Extra Options staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: dg-azimuth-extra-options-
      register: _azimuth_extra_options_staging

    - name: Extract Extra Options to staging
      ansible.builtin.unarchive:
        src: "{{ dg_azimuth_extra_options_zip }}"
        dest: "{{ _azimuth_extra_options_staging.path }}"
        remote_src: true

    - name: Install Extra Options runtime files
      ansible.builtin.copy:
        src: "{{ _azimuth_extra_options_staging.path }}/Azimuth/{{ item.src }}"
        dest: "{{ dg_azimuth_install_dir }}/{{ item.dest }}"
        remote_src: true
        mode: "0644"
      loop:
        - { src: winmm.dll, dest: winmm.dll }

    # 0.3.x ships its extras as launcher mods; existing mods are preserved
    # by only copying the shipped folder when it is not already installed.
    - name: Install the Extra Options mod-loader plugins
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ _azimuth_extra_options_staging.path }}/Azimuth/mods/."
          - "{{ dg_azimuth_install_dir }}/mods/"
        creates: "{{ dg_azimuth_install_dir }}/mods/Extra Options - Garage Revving/mod.json"

    # 0.2.x installed a tls shim that 1.0.x replaced with its own pair.
    - name: Remove the obsolete Extra Options tls shim
      ansible.builtin.file:
        path: "{{ dg_azimuth_install_dir }}/data/bin/azimuth-tls.dll"
        state: absent

    - name: Record installed Extra Options version
      ansible.builtin.file:
        path: "{{ dg_azimuth_install_dir }}/.dg-extra-options-{{ dg_azimuth_extra_options_version }}"
        state: touch
        mode: "0644"
  always:
    - name: Remove temporary Extra Options staging directory
      ansible.builtin.file:
        path: "{{ _azimuth_extra_options_staging.path }}"
        state: absent
      when: _azimuth_extra_options_staging.path is defined

- name: Check Azimuth settings and one-time display baseline marker
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ dg_azimuth_install_dir }}/data/azimuth.ini"
    - "{{ dg_azimuth_install_dir }}/.dg-display-baseline-applied"
  register: _azimuth_display_baseline

- name: Set Azimuth to 4K Ultra and 60 FPS real-time pacing once
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        from pathlib import Path
        import sys
        path = Path(sys.argv[1])
        settings = dict(zip(
            ('resolution', 'graphics', 'frame_rate', 'frame_pacing'),
            sys.argv[2:],
        ))
        text = path.read_bytes().decode('utf-16')
        lines = text.splitlines(keepends=True)
        seen = set()
        for index, line in enumerate(lines):
            key = line.split('=', 1)[0]
            if key in settings and key not in seen:
                ending = '\r\n' if line.endswith('\r\n') else '\n' if line.endswith('\n') else ''
                lines[index] = f'{key}={settings[key]}{ending}'
                seen.add(key)
        if not seen:
            raise SystemExit('No known Azimuth setting keys found')
        if settings.keys() - seen:
            print('skipped-removed-keys:', ','.join(sorted(settings.keys() - seen)))
        updated = ''.join(lines)
        if updated != text:
            path.write_bytes(updated.encode('utf-16'))
            print('azimuth-settings-changed')
      - "{{ dg_azimuth_install_dir }}/data/azimuth.ini"
      - "{{ dg_azimuth_resolution }}"
      - "{{ dg_azimuth_graphics }}"
      - "{{ dg_azimuth_frame_rate }}"
      - "{{ dg_azimuth_frame_pacing }}"
  register: _azimuth_display_tune
  changed_when: "'azimuth-settings-changed' in _azimuth_display_tune.stdout"
  when:
    - _azimuth_display_baseline.results[0].stat.exists
    - not _azimuth_display_baseline.results[1].stat.exists

- name: Remember that the Azimuth display baseline has been applied
  ansible.builtin.file:
    path: "{{ dg_azimuth_install_dir }}/.dg-display-baseline-applied"
    state: touch
    mode: "0644"
  when:
    - _azimuth_display_baseline.results[0].stat.exists
    - not _azimuth_display_baseline.results[1].stat.exists

- name: Check pinned Forza Horizon 2 mod archives
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
  loop:
    - { path: "{{ dg_azimuth_radio_zip }}", checksum: "{{ dg_azimuth_radio_sha256 }}" }
    - { path: "{{ dg_azimuth_infinity_zip }}", checksum: "{{ dg_azimuth_infinity_sha256 }}" }
  register: _azimuth_mod_archives

- name: Verify pinned Forza Horizon 2 mod archives
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.checksum | default('') == item.item.checksum
    fail_msg: "Missing or unexpected mod archive: {{ item.item.path }}"
  loop: "{{ _azimuth_mod_archives.results }}"

- name: Check installed radio version
  ansible.builtin.stat:
    path: "{{ dg_azimuth_install_dir }}/.dg-radio-{{ dg_azimuth_radio_version }}"
  register: _azimuth_radio_installed

- name: Install Spotify and local music radio without overwriting its settings
  when: not _azimuth_radio_installed.stat.exists
  block:
    - name: Create temporary radio staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: dg-azimuth-radio-
      register: _azimuth_radio_staging

    - name: Extract the radio archive to staging
      ansible.builtin.unarchive:
        src: "{{ dg_azimuth_radio_zip }}"
        dest: "{{ _azimuth_radio_staging.path }}"
        remote_src: true

    - name: Create the radio music directory
      ansible.builtin.file:
        path: "{{ dg_azimuth_install_dir }}/spotify-radio/MUSIC"
        state: directory
        mode: "0755"

    - name: Install radio runtime and documentation
      ansible.builtin.copy:
        src: "{{ _azimuth_radio_staging.path }}/{{ item }}"
        dest: "{{ dg_azimuth_install_dir }}/{{ item }}"
        remote_src: true
        mode: "0644"
      loop:
        - D3DCompiler_47.dll
        - spotify-radio/README.txt
        - spotify-radio/THIRD-PARTY-LICENSES.txt
        - spotify-radio/logo.swatchbin

    - name: Check for customized radio settings
      ansible.builtin.stat:
        path: "{{ dg_azimuth_install_dir }}/spotify-radio/config.ini"
      register: _azimuth_radio_settings

    - name: Install radio defaults when no settings exist
      ansible.builtin.copy:
        src: "{{ _azimuth_radio_staging.path }}/spotify-radio/config.ini"
        dest: "{{ dg_azimuth_install_dir }}/spotify-radio/config.ini"
        remote_src: true
        mode: "0644"
      when: not _azimuth_radio_settings.stat.exists

    - name: Record installed radio version
      ansible.builtin.file:
        path: "{{ dg_azimuth_install_dir }}/.dg-radio-{{ dg_azimuth_radio_version }}"
        state: touch
        mode: "0644"
  always:
    - name: Remove temporary radio staging directory
      ansible.builtin.file:
        path: "{{ _azimuth_radio_staging.path }}"
        state: absent
      when: _azimuth_radio_staging.path is defined

- name: Check the isolated ForzaInfinity install
  ansible.builtin.stat:
    path: "{{ dg_azimuth_infinity_install_dir }}/.dg-infinity-{{ dg_azimuth_infinity_version }}"
  register: _azimuth_infinity_installed

- name: Check the online client's persistent files
  ansible.builtin.stat:
    path: "{{ dg_azimuth_infinity_install_dir }}/{{ item }}"
  loop:
    - data/azimuth.ini
    - data/titles
    - data/bin/azimuth-tls.dll.stock
    - data/bin/FH2_ExtraOptions.ini
  register: _azimuth_infinity_persistent

- name: Install the isolated ForzaInfinity client
  when: not _azimuth_infinity_installed.stat.exists
  block:
    - name: Create isolated Azimuth directory
      ansible.builtin.file:
        path: "{{ dg_azimuth_infinity_install_dir }}"
        state: directory
        mode: "0755"

    - name: Extract a clean Azimuth wrapper for online use
      ansible.builtin.unarchive:
        src: "{{ dg_azimuth_zip }}"
        dest: "{{ dg_azimuth_infinity_install_dir }}"
        remote_src: true
      when: not _azimuth_infinity_persistent.results[0].stat.exists

    - name: Copy tuned display and game path settings to the online client
      ansible.builtin.copy:
        src: "{{ dg_azimuth_install_dir }}/data/azimuth.ini"
        dest: "{{ dg_azimuth_infinity_install_dir }}/data/azimuth.ini"
        remote_src: true
        mode: "0644"
      when: not _azimuth_infinity_persistent.results[0].stat.exists

    - name: Copy the existing offline save once for optional online profile creation
      ansible.builtin.copy:
        src: "{{ dg_azimuth_install_dir }}/data/titles/"
        dest: "{{ dg_azimuth_infinity_install_dir }}/data/titles/"
        remote_src: true
        mode: preserve
      when: not _azimuth_infinity_persistent.results[1].stat.exists

    - name: Create temporary ForzaInfinity staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: dg-forza-infinity-
      register: _azimuth_infinity_staging

    - name: Extract the ForzaInfinity release to staging
      ansible.builtin.unarchive:
        src: "{{ dg_azimuth_infinity_zip }}"
        dest: "{{ _azimuth_infinity_staging.path }}"
        remote_src: true

    - name: Keep the original Azimuth TLS helper for offline recovery
      ansible.builtin.copy:
        src: "{{ dg_azimuth_infinity_install_dir }}/data/bin/azimuth-tls.dll"
        dest: "{{ dg_azimuth_infinity_install_dir }}/data/bin/azimuth-tls.dll.stock"
        remote_src: true
        mode: "0644"
      when: not _azimuth_infinity_persistent.results[2].stat.exists

    - name: Install ForzaInfinity hook and hostable world server
      ansible.builtin.copy:
        src: "{{ _azimuth_infinity_staging.path }}/ForzaInfinity/{{ item }}"
        dest: "{{ dg_azimuth_infinity_install_dir }}/data/bin/{{ item }}"
        remote_src: true
        mode: "0644"
      loop:
        - azimuth-tls.dll
        - dedicated_server.exe

    - name: Configure the public ForzaInfinity server
      ansible.builtin.copy:
        src: "{{ _azimuth_infinity_staging.path }}/ForzaInfinity/FH2_ExtraOptions.template.ini"
        dest: "{{ dg_azimuth_infinity_install_dir }}/data/bin/FH2_ExtraOptions.ini"
        remote_src: true
        mode: "0644"
      when: not _azimuth_infinity_persistent.results[3].stat.exists

    - name: Set the ForzaInfinity server address
      ansible.builtin.replace:
        path: "{{ dg_azimuth_infinity_install_dir }}/data/bin/FH2_ExtraOptions.ini"
        regexp: __SERVER__
        replace: "{{ dg_azimuth_infinity_server }}"
      when: not _azimuth_infinity_persistent.results[3].stat.exists

    - name: Record installed ForzaInfinity version
      ansible.builtin.file:
        path: "{{ dg_azimuth_infinity_install_dir }}/.dg-infinity-{{ dg_azimuth_infinity_version }}"
        state: touch
        mode: "0644"
  always:
    - name: Remove temporary ForzaInfinity staging directory
      ansible.builtin.file:
        path: "{{ _azimuth_infinity_staging.path }}"
        state: absent
      when: _azimuth_infinity_staging.path is defined

- name: Install Azimuth launcher
  ansible.builtin.template:
    src: azimuth.sh.j2
    dest: "{{ dg_azimuth_launcher }}"
    mode: "0755"

- name: Check which Forza dumps are present
  ansible.builtin.stat:
    path: "{{ item.dir }}"
  loop: "{{ dg_azimuth_games }}"
  loop_control:
    label: "{{ item.slug }}"
  register: _azimuth_game_dirs

- name: Report missing dumps
  ansible.builtin.debug:
    msg: >-
      No dump at {{ item.item.dir }} — the {{ item.item.slug }} shortcut is
      skipped until it is placed there.
  loop: "{{ _azimuth_game_dirs.results }}"
  loop_control:
    label: "{{ item.item.slug }}"
  when: not item.stat.exists

- name: Collect the Forza games whose dumps are present
  ansible.builtin.set_fact:
    _azimuth_present: >-
      {{ _azimuth_game_dirs.results | selectattr('stat.exists')
         | map(attribute='item') | list }}

- name: Install the per-game shortcuts
  ansible.builtin.template:
    src: azimuth-game.sh.j2
    dest: "{{ dg_box_home }}/bin/azimuth-{{ item.slug }}"
    mode: "0755"
  loop: "{{ _azimuth_present }}"
  loop_control:
    label: "{{ item.slug }}"

- name: Install isolated ForzaInfinity launcher
  ansible.builtin.template:
    src: azimuth-fh2-infinity.sh.j2
    dest: "{{ dg_azimuth_infinity_launcher }}"
    mode: "0755"

- name: Render Azimuth desktop entry
  ansible.builtin.template:
    src: azimuth.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/gaming-azimuth.desktop"
    mode: "0644"

- name: Render the per-game desktop entries
  ansible.builtin.template:
    src: azimuth-game.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/gaming-azimuth-{{ item.slug }}.desktop"
    mode: "0644"
  loop: "{{ _azimuth_present }}"
  loop_control:
    label: "{{ item.slug }}"

- name: Render ForzaInfinity desktop entry
  ansible.builtin.template:
    src: azimuth-fh2-infinity.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/gaming-azimuth-fh2-infinity.desktop"
    mode: "0644"

- name: Install Azimuth host desktop entry
  ansible.builtin.command:
    cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  environment:
    DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
    DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
  register: _azimuth_host_launchers
  changed_when: >-
    'installed ' in _azimuth_host_launchers.stdout or
    'removed stale ' in _azimuth_host_launchers.stdout
