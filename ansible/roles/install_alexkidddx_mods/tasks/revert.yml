---
# Restore the stock Assembly-CSharp.dll and drop the marker.

- name: Check for the stock DLL backup
  ansible.builtin.stat:
    path: "{{ dg_alexkidddx_backup_dir }}/Assembly-CSharp.dll.stock"
  register: _akd_rv_backup

- name: Restore the stock Assembly-CSharp.dll
  ansible.builtin.copy:
    src: "{{ dg_alexkidddx_backup_dir }}/Assembly-CSharp.dll.stock"
    dest: "{{ dg_alexkidddx_managed_dir }}/Assembly-CSharp.dll"
    remote_src: true
    mode: "0644"
  when: _akd_rv_backup.stat.exists

- name: Warn when no backup exists
  ansible.builtin.debug:
    msg: >-
      No stock DLL backup at {{ dg_alexkidddx_backup_dir }} — use Steam ->
      Verify integrity of game files to restore Assembly-CSharp.dll.
  when: not _akd_rv_backup.stat.exists

- name: Remove the install marker
  ansible.builtin.file:
    path: "{{ dg_alexkidddx_game_dir }}/.dg-alexkidddx-mod-{{ item.id }}"
    state: absent
  loop: "{{ dg_alexkidddx_mods }}"
  loop_control:
    label: "{{ item.id }}"

- name: Report revert
  ansible.builtin.debug:
    msg: "Alex Kidd DX reverted: stock Assembly-CSharp.dll restored."
