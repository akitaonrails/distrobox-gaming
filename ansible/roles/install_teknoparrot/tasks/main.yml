---
# Install the Windows TeknoParrotUI (stable, .NET Framework) under Wine and
# configure the roms_rare/TeknoParrot collection. See docs/teknoparrot.md.
# The experimental native-Linux build is broken; this uses the Windows build,
# whose ParrotPatcher works under Wine — but we fetch the loaders directly from
# teknogods GitHub (more reliable than the in-app updater).

- name: Ensure TeknoParrot directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_teknoparrot_install }}"
    - "{{ dg_teknoparrot_cache }}"
    - "{{ dg_teknoparrot_launchers_dir }}"
    - "{{ dg_teknoparrot_archive_dir }}"

- name: Initialize the TeknoParrot Wine prefix
  ansible.builtin.shell: >-
    {{ dg_in_box }} env WINEPREFIX="{{ dg_teknoparrot_prefix }}" WINEARCH=win64
    WINEDEBUG=-all wineboot -i
  args:
    creates: "{{ dg_teknoparrot_prefix }}/system.reg"

- name: Install TeknoParrot winetricks components
  ansible.builtin.shell: >-
    {{ dg_in_box }} env WINEPREFIX="{{ dg_teknoparrot_prefix }}" WINEDEBUG=-all
    winetricks -q {{ item }}
  args:
    creates: "{{ dg_teknoparrot_prefix }}/.dg-winetricks-{{ item }}"
  register: _tp_wt
  changed_when: _tp_wt.rc == 0
  loop: "{{ dg_teknoparrot_winetricks }}"

- name: Mark installed winetricks components
  ansible.builtin.file:
    path: "{{ dg_teknoparrot_prefix }}/.dg-winetricks-{{ item }}"
    state: touch
    mode: "0644"
  loop: "{{ dg_teknoparrot_winetricks }}"

- name: Apply TeknoParrot prefix registry tweaks
  ansible.builtin.shell: >-
    {{ dg_in_box }} env WINEPREFIX="{{ dg_teknoparrot_prefix }}" WINEDEBUG=-all
    sh -c '{{ item }}'
  loop:
    - wine reg add "HKCU\\Software\\Wine\\X11 Driver" /v UseEGL /t REG_SZ /d N /f
    - wine reg add "HKCU\\Control Panel\\Desktop" /v LogPixels /t REG_DWORD /d 192 /f
    - wine reg add "HKCU\\Software\\Wine\\Explorer" /v Desktop /d Default /f
    - wine reg add "HKCU\\Software\\Wine\\Explorer\\Desktops" /v Default /d "{{ dg_teknoparrot_virtual_desktop }}" /f
    - wine reg add "HKCR\\teknoparrot" /ve /d "URL:teknoparrot Protocol" /f
    - wine reg add "HKCR\\teknoparrot" /v "URL Protocol" /d "" /f
    - wine reg add "HKCR\\teknoparrot\\shell\\open\\command" /ve /d "\"C:\\TeknoParrot\\TeknoParrotUi.exe\" \"%1\"" /f
  changed_when: false

- name: Download the TeknoParrotUI package
  ansible.builtin.get_url:
    url: "{{ dg_teknoparrot_ui_url }}"
    dest: "{{ dg_teknoparrot_cache }}/TeknoParrotUi.zip"
    mode: "0644"

- name: Extract TeknoParrotUI into the prefix
  ansible.builtin.unarchive:
    src: "{{ dg_teknoparrot_cache }}/TeknoParrotUi.zip"
    dest: "{{ dg_teknoparrot_install }}"
    remote_src: true
    creates: "{{ dg_teknoparrot_install }}/TeknoParrotUi.exe"

- name: Download + extract TeknoParrot game loaders
  ansible.builtin.shell: |
    {{ dg_in_box }} sh -lc '
      set -eu
      sub="{{ item.subdir }}"; dst="{{ dg_teknoparrot_install }}/$sub"
      [ -f "$dst/BudgieLoader.exe" ] || [ -f "$dst/OpenParrotLoader.exe" ] || [ -f "$dst/OpenParrotLoader64.exe" ] && exit 0
      mkdir -p "$dst" "{{ dg_teknoparrot_cache }}"
      cd "{{ dg_teknoparrot_cache }}"
      gh release download "{{ item.tag }}" --repo "{{ item.repo }}" {% if item.asset %}--pattern "{{ item.asset }}"{% endif %} --dir "loader-{{ item.subdir }}" --clobber
      z="$(ls loader-{{ item.subdir }}/*.zip | head -1)"
      unzip -oq "$z" -d "$dst"
      printf "%s\n" "loader-extracted {{ item.subdir }}"
    '
  register: _tp_loader
  changed_when: "'loader-extracted' in _tp_loader.stdout"
  loop: "{{ dg_teknoparrot_loaders }}"
  loop_control:
    label: "{{ item.subdir }}"

- name: Stage the profile generator in the install dir
  ansible.builtin.copy:
    src: tp_generate_profiles.py
    dest: "{{ dg_teknoparrot_install }}/tp_generate_profiles.py"
    mode: "0755"

- name: Generate UserProfiles + ES-DE launch stubs + archive console games
  ansible.builtin.shell: >-
    {{ dg_in_box }} python3 {{ dg_teknoparrot_install }}/tp_generate_profiles.py
    "{{ dg_teknoparrot_games_dir }}" "{{ dg_teknoparrot_install }}"
    "{{ dg_teknoparrot_launchers_dir }}" "{{ dg_teknoparrot_archive_dir }}"
  register: _tp_gen
  changed_when: "'UserProfiles written' in _tp_gen.stdout"

- name: Deploy the TeknoParrot launcher
  ansible.builtin.template:
    src: teknoparrot-launch.sh.j2
    dest: "{{ dg_box_home }}/bin/teknoparrot-launch"
    mode: "0755"

- name: Show TeknoParrot setup summary
  ansible.builtin.debug:
    msg: "{{ _tp_gen.stdout_lines | default(['(profiles unchanged)']) }}"
