---
# Red Dead Redemption (appid 2668510) mod set — loose game/*.rpf replacements.
# See group_vars/all/rdr_mods.yml and docs/nexusmods.md.

- name: Revert the RDR mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_rdr_revert | bool

- name: Install the RDR mod set
  when: not (dg_rdr_revert | bool)
  block:
    - name: Locate the RDR game/ dir
      ansible.builtin.stat:
        path: "{{ dg_rdr_game_dir }}/game"
      register: _rdr_game

    - name: Fail when RDR is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_rdr_game_dir }}/game not found (appid {{ dg_rdr_appid }}).
          Install RDR + mount the USB library, or override
          dg_rdr_steam_library_root. See docs/nexusmods.md.
      when: not _rdr_game.stat.exists

    - name: Download each RDR mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game reddeadredemption
          --mod {{ item.id }} --file {{ item.file }} --via api
          --dest {{ (dg_rdr_staging_root + '/' + item.id) | quote }}
      loop: "{{ dg_rdr_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _rdr_dl
      changed_when: "'saved' in _rdr_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Install each RDR .rpf replacement (backs up the original once)
      ansible.builtin.shell: |
        set -eu
        game_rpf="{{ dg_rdr_game_dir }}/game/{{ item.rpf }}"
        marker="{{ dg_rdr_game_dir }}/game/.dg-rdr-{{ item.id }}"
        [ -f "$marker" ] && { echo "skip"; exit 0; }
        arch="$(find {{ (dg_rdr_staging_root + '/' + item.id) | quote }} -type f \
          \( -name '*.rar' -o -name '*.zip' -o -name '*.7z' \) | head -1)"
        [ -n "$arch" ] || { echo "NO-ARCHIVE" >&2; exit 3; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" "$arch" >/dev/null
        src="$(find "$tmp" -type f -name {{ item.rpf | quote }} | head -1)"
        [ -n "$src" ] || { echo "NO-RPF-IN-ARCHIVE" >&2; exit 4; }
        [ -e "$game_rpf" ] && [ ! -e "$game_rpf.dg-orig" ] && cp -a "$game_rpf" "$game_rpf.dg-orig"
        cp -f "$src" "$game_rpf"
        echo "installed" > "$marker"
        echo "rdr-installed"
      loop: "{{ dg_rdr_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }} -> game/{{ item.rpf }}"
      register: _rdr_install
      changed_when: "'rdr-installed' in _rdr_install.stdout"

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "RDR: installed {{ dg_rdr_mods | map(attribute='name') | join(', ') }} (loose game/*.rpf swaps; originals kept as *.rpf.dg-orig)."
          - "Deferred (MagicRDR): 525 minimap, 66 SMIC, 303 fast-horse, 140 deadeye. Loaders: 719 RDRFix (.asi), 475 trainer (.red). ReShade dropped: 21. Saves manual: 114, 515."
          - "Revert: -e dg_rdr_revert=true."
