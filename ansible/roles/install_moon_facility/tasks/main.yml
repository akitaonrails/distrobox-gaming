---
# Sonic and the Moon Facility — Clickteam Fusion 2.5 exe under Wine (no
# Linux build). See group_vars/all/moon_facility.yml and docs/sonic-fan-pack.md.

- name: Revert Sonic and the Moon Facility when requested
  when: dg_moonfacility_revert | bool
  block:
    - name: Remove the Moon Facility launcher, install dir and prefix (registered saves kept)
      ansible.builtin.include_role:
        name: revert_guard
      vars:
        revert_paths:
          - "{{ dg_moonfacility_bin }}"
          - "{{ dg_moonfacility_install_dir }}"
          - "{{ dg_moonfacility_prefix }}"
    - name: Report Moon Facility reverted
      ansible.builtin.debug:
        msg: "Sonic and the Moon Facility removed. The NAS zip is untouched."

- name: Install Sonic and the Moon Facility
  when: not (dg_moonfacility_revert | bool)
  block:
    - name: Verify the NAS zip exists
      ansible.builtin.stat:
        path: "{{ dg_moonfacility_zip }}"
      register: _moonfacility_zip
      failed_when: not _moonfacility_zip.stat.exists

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dg_moonfacility_install_dir }}"
        - "{{ dg_box_home }}/bin"

    - name: Extract the game (once)
      ansible.builtin.shell: |
        set -eu
        [ -f "{{ dg_moonfacility_game_dir }}/{{ dg_moonfacility_exe }}" ] && exit 0
        unzip -oq "{{ dg_moonfacility_zip }}" -d "{{ dg_moonfacility_install_dir }}"
        echo extracted-moonfacility
      register: _moonfacility_extract
      changed_when: "'extracted-moonfacility' in _moonfacility_extract.stdout"

    - name: Initialize the Wine prefix
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          set -eu
          [ -d "{{ dg_moonfacility_prefix }}/drive_c" ] && exit 0
          export WINEPREFIX="{{ dg_moonfacility_prefix }}"
          "{{ dg_moonfacility_wine_bin_dir }}/wineboot" -i >/dev/null 2>&1 || true
          "{{ dg_moonfacility_wine_bin_dir }}/wineserver" -w || true
          echo prefix-created
        '
      register: _moonfacility_prefix
      changed_when: "'prefix-created' in _moonfacility_prefix.stdout"

    - name: Force the GLX OpenGL backend (wine 11 EGL -> iGPU regression)
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          export WINEPREFIX="{{ dg_moonfacility_prefix }}"
          W="{{ dg_moonfacility_wine_bin_dir }}"
          "$W/wine" reg query "HKCU\\Software\\Wine\\X11 Driver" /v UseEGL 2>/dev/null | grep -q N && exit 0
          "$W/wine" reg add "HKCU\\Software\\Wine\\X11 Driver" /v UseEGL /d N /f >/dev/null
          "$W/wineserver" -w || true
          echo egl-pinned
        '
      register: _moonfacility_egl
      changed_when: "'egl-pinned' in _moonfacility_egl.stdout"

    - name: Route controllers through SDL (winebus) so the 8BitDo reaches the game
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          export WINEPREFIX="{{ dg_moonfacility_prefix }}"
          W="{{ dg_moonfacility_wine_bin_dir }}"
          "$W/wine" reg add "HKCU\\Software\\Wine\\WineBus" /v "{{ item.name }}" /t REG_DWORD /d {{ item.value }} /f >/dev/null
          "$W/wineserver" -w || true
        '
      loop: "{{ dg_moonfacility_winebus_registry }}"
      loop_control:
        label: "{{ item.name }}={{ item.value }}"
      changed_when: true

    - name: Deploy the launcher
      ansible.builtin.template:
        src: moon-facility.sh.j2
        dest: "{{ dg_moonfacility_bin }}"
        mode: "0755"

    - name: Render the desktop entry
      ansible.builtin.template:
        src: gaming-moon-facility.desktop.j2
        dest: "{{ dg_desktop_render_dir }}/gaming-moon-facility.desktop"
        mode: "0644"

    - name: Install the desktop entry into the host applications dir
      ansible.builtin.command:
        cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
      environment:
        DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
        DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
      register: _moonfacility_host_launchers
      changed_when: >-
        'installed ' in _moonfacility_host_launchers.stdout or
        'removed stale ' in _moonfacility_host_launchers.stdout

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Sonic and the Moon Facility {{ dg_moonfacility_version }} under Wine at
          {{ dg_moonfacility_install_dir }}; launcher {{ dg_moonfacility_bin }}
          (fullscreen via gamescope). Revert: -e dg_moonfacility_revert=true.
