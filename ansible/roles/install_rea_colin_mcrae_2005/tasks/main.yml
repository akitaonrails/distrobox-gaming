---
# akitaonrails/rea-colin-mcrae-2005 ships a self-contained AppImage: its own
# Wine (WoW64) + DXVK, the registry fix for the "Wine dead-end" crash, bundled
# innoextract to unpack the GOG installer, a settings window then the game in
# gamescope, and a window-close quit hook. The role stages the pinned AppImage,
# seeds the launcher's own launcher.cfg (4K/widescreen/vsync pointing at the
# owned GOG source), publishes the launcher + desktop entry, and removes the
# retired dead-end experiment Wine prefixes. The launcher unpacks the game into
# a private copy on first start and never changes the owned source.

- name: Check the owned Colin McRae Rally 2005 GOG installer
  ansible.builtin.stat:
    path: "{{ dg_cmr2005_setup_exe }}"
    checksum_algorithm: sha256
  register: _cmr2005_setup

- name: Require the supported GOG v1.1 offline installer
  ansible.builtin.assert:
    that:
      - _cmr2005_setup.stat.exists
      - _cmr2005_setup.stat.checksum == dg_cmr2005_setup_sha256
    fail_msg: >-
      Need the GOG v1.1 offline installer (setup_colin2005.exe sha256
      690a5e3f… plus its two .bin parts) at {{ dg_cmr2005_source_dir }}; the
      retail DVD (StarForce) is not supported. See docs/rea-colin-mcrae-2005.md.

- name: Check for a running Colin McRae Rally 2005 session before install
  ansible.builtin.command: pgrep -x cmr5.exe
  register: _cmr2005_running
  failed_when: false
  changed_when: false

- name: Require Colin McRae Rally 2005 to be closed
  ansible.builtin.assert:
    that: _cmr2005_running.rc == 1
    fail_msg: "Close Colin McRae Rally 2005 before re-running the installer."

- name: Create the REA CMR2005 directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_cmr2005_root }}"
    - "{{ dg_cmr2005_settings_dir }}"
    - "{{ dg_box_home }}/bin"

- name: Stage the pinned REA CMR2005 launcher AppImage
  ansible.builtin.include_role:
    name: stage_rea_appimage
  vars:
    dg_rea_stage_asset_url: "{{ dg_cmr2005_asset_url }}"
    dg_rea_stage_asset_name: "{{ dg_cmr2005_asset_name }}"
    dg_rea_stage_asset_sha256: "{{ dg_cmr2005_asset_sha256 }}"
    dg_rea_stage_install_dir: "{{ dg_cmr2005_root }}"
    dg_rea_stage_retired_names:
      - CMR2005Launcher-v0.1.0-x86_64.AppImage
      - CMR2005Launcher-v0.2.0-x86_64.AppImage
      - CMR2005Launcher-v0.2.1-x86_64.AppImage

# The Widescreen look fills the resolution from the screen when it is unset;
# seeding the maxed-out values pins a headless --play to native 4K. force:
# false — once the launcher or the player writes the file, it is theirs. Only
# `game` is kept in sync below.
- name: Seed the REA CMR2005 launcher settings
  ansible.builtin.copy:
    dest: "{{ dg_cmr2005_settings_dir }}/launcher.cfg"
    mode: "0644"
    force: false
    content: |
      # Colin McRae Rally 2005 launcher settings (seeded by install_rea_colin_mcrae_2005).
      game = {{ dg_cmr2005_win_source }}
      {% for key, value in dg_cmr2005_settings.items() %}
      {{ key }} = {{ value }}
      {% endfor %}

- name: Remember the game folder on an already-written config
  ansible.builtin.lineinfile:
    path: "{{ dg_cmr2005_settings_dir }}/launcher.cfg"
    regexp: "^game *="
    line: "game = {{ dg_cmr2005_win_source }}"
    insertbefore: BOF

- name: Install the reentrant REA CMR2005 launcher
  ansible.builtin.template:
    src: rea-colin-mcrae-2005.sh.j2
    dest: "{{ dg_cmr2005_launcher }}"
    mode: "0755"

- name: Render the REA CMR2005 desktop entry
  ansible.builtin.template:
    src: rea-colin-mcrae-2005.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/rea-colin-mcrae-2005.desktop"
    mode: "0644"

- name: Publish the REA CMR2005 desktop entry
  ansible.builtin.command: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  changed_when: false

# Retire the dead-end experiment prefixes from the earlier failed attempts. The
# game crashed at startup then, so these prefixes hold no saves; the owned GOG
# source on the NAS is untouched.
- name: Find the retired dead-end CMR2005 Wine prefixes
  ansible.builtin.find:
    paths: "{{ dg_cmr2005_old_prefix_root }}"
    patterns: "{{ dg_cmr2005_old_prefix_glob }}"
    file_type: directory
    recurse: false
  register: _cmr2005_old_prefixes

- name: Remove the retired dead-end CMR2005 Wine prefixes
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _cmr2005_old_prefixes.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
