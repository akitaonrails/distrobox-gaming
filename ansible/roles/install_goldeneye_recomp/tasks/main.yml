---
# Build GoldenEye 007: Recompiled (N64Recomp + RT64) natively. See
# docs/goldeneye-recomp.md. Needs the user's NTSC-U GoldenEye ROM (converted to
# the z64 baserom the build expects). Encodes the fixes needed on the current
# Arch toolchain (CMake 4 / GCC 15) — the upstream build_linux.sh alone fails.

- name: Clone/update GoldenEye64Recomp with submodules
  ansible.builtin.git:
    repo: "{{ dg_ge64_repo }}"
    dest: "{{ dg_ge64_src }}"
    depth: 1
    version: main
    recursive: true
    force: true

- name: Verify the GoldenEye source ROM exists
  ansible.builtin.stat:
    path: "{{ dg_ge64_rom_src }}"
  register: _ge64_rom
  failed_when: not _ge64_rom.stat.exists

- name: Produce baserom.u.z64 (byteswap the v64 dump to z64) + verify sha1
  ansible.builtin.shell: |
    {{ dg_in_box }} python3 - <<'PY'
    import hashlib
    src = "{{ dg_ge64_rom_src }}"; dst = "{{ dg_ge64_src }}/baserom.u.z64"
    d = open(src, 'rb').read()
    m = d[:4]
    if m == b'\x80\x37\x12\x40': z = d                                   # z64 (BE)
    elif m == b'\x37\x80\x40\x12':                                       # v64 (16-bit swap)
        b = bytearray(d); b[0::2], b[1::2] = d[1::2], d[0::2]; z = bytes(b)
    elif m == b'\x40\x12\x37\x80':                                       # n64 (32-bit word rev)
        b = bytearray(len(d))
        for i in range(0, len(d) & ~3, 4): b[i:i+4] = d[i:i+4][::-1]
        z = bytes(b)
    else: raise SystemExit("unknown ROM byte order: " + m.hex())
    h = hashlib.sha1(z).hexdigest()
    if h != "{{ dg_ge64_rom_sha1_z64 }}": raise SystemExit("ROM sha1 mismatch: got " + h)
    open(dst, 'wb').write(z); print("baserom.u.z64 ok (" + h + ")")
    PY
  args:
    creates: "{{ dg_ge64_src }}/baserom.u.z64"

- name: Build GoldenRecomp (generate aspMain.cpp — the standard-build gap — then build)
  ansible.builtin.shell: |
    {{ dg_in_box }} bash -lc '
      set -eu
      cd "{{ dg_ge64_src }}"
      export CMAKE_POLICY_VERSION_MINIMUM="{{ dg_ge64_build_env.CMAKE_POLICY_VERSION_MINIMUM }}"
      export CFLAGS="{{ dg_ge64_build_env.CFLAGS }}"
      export CXXFLAGS="{{ dg_ge64_build_env.CXXFLAGS }}"
      # rsp/aspMain.cpp is required by the main CMakeLists but only generated by
      # the clean-build path upstream; generate it here for the standard build.
      if [ ! -f rsp/aspMain.cpp ]; then
        [ -f ge007.tlbfree.z64 ] || xdelta3 -d -s baserom.u.z64 vanilla_to_tlbfree.xdelta ge007.tlbfree.z64
        if [ ! -f ./RSPRecomp ]; then
          cmake -S n64recomp-src -B n64recomp-src/build -G Ninja -DCMAKE_BUILD_TYPE=Release >/dev/null
          ninja -C n64recomp-src/build RSPRecomp
          cp n64recomp-src/build/RSPRecomp ./RSPRecomp
        fi
        ./RSPRecomp aspMain.us.toml
      fi
      ./build_linux.sh
    '
  register: _ge64_build
  changed_when: "'Done!' in _ge64_build.stdout"

- name: Assert the GoldenRecomp binary was produced
  ansible.builtin.stat:
    path: "{{ dg_ge64_bin }}"
  register: _ge64_bin
  failed_when: not _ge64_bin.stat.exists

- name: Deploy the GoldenEye launcher
  ansible.builtin.template:
    src: goldeneye-launch.sh.j2
    dest: "{{ dg_box_home }}/bin/goldeneye-launch"
    mode: "0755"

- name: Render the GoldenEye desktop entry
  ansible.builtin.template:
    src: goldeneye.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/gaming-goldeneye.desktop"
    mode: "0644"

- name: Install the GoldenEye desktop file into the host applications dir
  ansible.builtin.command:
    cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  environment:
    DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
    DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
  register: _ge64_host_launchers
  changed_when: >-
    'installed ' in _ge64_host_launchers.stdout or
    'removed stale ' in _ge64_host_launchers.stdout
