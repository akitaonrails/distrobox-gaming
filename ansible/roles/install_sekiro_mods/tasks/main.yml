---
# Sekiro (appid 814380) mod set — self-contained dinput8 mods into the game root.
# See group_vars/all/sekiro_mods.yml and docs/nexusmods.md.

- name: Revert the Sekiro mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_sekiro_revert | bool

- name: Install the Sekiro mod set
  when: not (dg_sekiro_revert | bool)
  block:
    - name: Locate the Sekiro game dir
      ansible.builtin.stat:
        path: "{{ dg_sekiro_game_dir }}/sekiro.exe"
      register: _sk_game

    - name: Fail when Sekiro is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_sekiro_game_dir }} not found (appid {{ dg_sekiro_appid }}).
          Install Sekiro + mount the USB library, or override
          dg_sekiro_steam_library_root. See docs/nexusmods.md.
      when: not _sk_game.stat.exists

    - name: Download each Sekiro mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game sekiro
          --mod {{ item.id }} --file {{ item.file }} --via api
          --dest {{ (dg_sekiro_staging_root + '/' + item.id) | quote }}
      loop: "{{ dg_sekiro_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _sk_dl
      changed_when: "'saved' in _sk_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Install each mod into the game root (records a manifest)
      ansible.builtin.shell: |
        set -eu
        game={{ dg_sekiro_game_dir | quote }}
        manifest="$game/.dg-sekiro-{{ item.id }}.manifest"
        [ -f "$manifest" ] && { echo "skip"; exit 0; }
        arch="$(find {{ (dg_sekiro_staging_root + '/' + item.id) | quote }} -type f \
          \( -name '*.zip' -o -name '*.rar' -o -name '*.7z' \) | head -1)"
        [ -n "$arch" ] || { echo "NO-ARCHIVE" >&2; exit 3; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" "$arch" >/dev/null
        # Back up a pre-existing dinput8.dll once (vanilla Sekiro has none).
        if [ -e "$tmp/dinput8.dll" ] && [ -e "$game/dinput8.dll" ] && [ ! -e "$game/dinput8.dll.dg-orig" ]; then
          cp -a "$game/dinput8.dll" "$game/dinput8.dll.dg-orig"
        fi
        ( cd "$tmp" && find . -type f | sed 's|^\./||' ) > "$manifest.tmp"
        rsync -a "$tmp/" "$game/"
        mv "$manifest.tmp" "$manifest"
        echo "sekiro-installed"
      loop: "{{ dg_sekiro_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _sk_install
      changed_when: "'sekiro-installed' in _sk_install.stdout"

    # --- Steam launch options (dinput8 override) ---
    - name: Auto-discover the in-box Steam localconfig.vdf
      ansible.builtin.find:
        paths: "{{ dg_sekiro_steam_root }}/userdata"
        patterns: localconfig.vdf
        recurse: true
      register: _sk_localconfigs
      when: dg_sekiro_steam_localconfig | length == 0

    - name: Resolve the effective localconfig path
      ansible.builtin.set_fact:
        _sk_localconfig: >-
          {{ dg_sekiro_steam_localconfig if (dg_sekiro_steam_localconfig | length > 0)
             else (_sk_localconfigs.files | map(attribute='path') | list | first
                   if (_sk_localconfigs.files | default([]) | length == 1) else '') }}

    - name: Check if Steam is running
      ansible.builtin.shell: |
        pgrep -u "$(id -u)" -x steam >/dev/null || pgrep -u "$(id -u)" -f '/steam(webhelper)?( |$)' >/dev/null
      register: _sk_steam_running
      changed_when: false
      failed_when: false
      check_mode: false
      when: _sk_localconfig | length > 0

    - name: Warn that launch options were not set (Steam running)
      ansible.builtin.debug:
        msg: >-
          Steam is running; the dinput8 override was NOT set. Set it manually
          (Sekiro -> Launch Options -> {{ dg_sekiro_launch_options }}) or close
          Steam and re-run. The mod is installed.
      when:
        - _sk_localconfig | length > 0
        - _sk_steam_running.rc == 0

    - name: Set the Sekiro Steam launch options (dinput8 override)
      ansible.builtin.command: >-
        {{ dg_project_root }}/scripts/set-steam-launch-options.py
        --localconfig {{ _sk_localconfig | quote }}
        --set {{ dg_sekiro_appid | quote }} {{ dg_sekiro_launch_options | quote }}
      register: _sk_launch
      changed_when: "'changed: true' in _sk_launch.stdout"
      when:
        - _sk_localconfig | length > 0
        - _sk_steam_running.rc != 0

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "Sekiro: installed {{ dg_sekiro_mods | map(attribute='name') | join(', ') }} (bundled dinput8 hook)."
          - "{{ 'Launch override set.' if (_sk_localconfig | length > 0 and _sk_steam_running.rc != 0) else 'Set launch option manually: ' + dg_sekiro_launch_options }}"
          - "Deferred 418 The Easy (Mod Engine; conflicts with the weapon-wheel dinput8). Revert: -e dg_sekiro_revert=true."
