---
# Donkey Kong Land Remake (DKLR) — Unity Windows fangame under Wine + DXVK,
# integer-scaled via gamescope, with an evsieve pad->keyboard bridge. See
# group_vars/all/dklr.yml and docs/dklr.md.

- name: Revert the DKLR install when requested
  when: dg_dklr_revert | bool
  block:
    - name: Remove the DKLR launcher, prefix and install
      ansible.builtin.shell: "{{ dg_in_box }} rm -rf {{ item | quote }}"
      loop:
        - "{{ dg_dklr_bin }}"
        - "{{ dg_dklr_prefix }}"
        - "{{ dg_dklr_install_root }}"
      changed_when: true
    - name: Report DKLR reverted
      ansible.builtin.debug:
        msg: "DKLR removed (launcher, prefix, install). Source on the NAS is untouched."

- name: Install the DKLR fangame
  when: not (dg_dklr_revert | bool)
  block:
    - name: Assert the DKLR source + exe exist
      ansible.builtin.stat:
        path: "{{ dg_dklr_source_dir }}/{{ dg_dklr_exe }}"
      register: _dklr_src

    - name: Fail when DKLR source is missing
      ansible.builtin.fail:
        msg: >-
          Missing {{ dg_dklr_source_dir }}/{{ dg_dklr_exe }}. Stage the Donkey
          Kong Land Remake build there, or override dg_dklr_source_dir.
      when: not _dklr_src.stat.exists

    - name: Create DKLR directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dg_dklr_prefix }}"
        - "{{ dg_box_home }}/bin"

    - name: Create DKLR install root inside the box
      ansible.builtin.shell: "{{ dg_in_box }} mkdir -p {{ dg_dklr_install_root | quote }}"
      changed_when: false

    - name: Install DKLR runtime packages inside the box
      ansible.builtin.shell: >-
        {{ dg_in_box }} sudo pacman -Sy --needed --noconfirm
        {{ dg_dklr_packages | join(' ') }}
      register: _dklr_pacman
      changed_when: "'installing' in _dklr_pacman.stdout"

    - name: Copy the DKLR game files into the box (writable local copy for saves)
      ansible.builtin.shell: >-
        {{ dg_in_box }} rsync -a --no-perms --no-owner --no-group
        --omit-dir-times --itemize-changes
        {{ (dg_dklr_source_dir + '/') | quote }}
        {{ (dg_dklr_install_root + '/') | quote }}
      register: _dklr_copy
      changed_when: _dklr_copy.stdout | length > 0

    - name: Check DKLR Wine prefix initialization
      ansible.builtin.stat:
        path: "{{ dg_dklr_prefix }}/system.reg"
      register: _dklr_prefix

    - name: Initialize the DKLR Wine prefix
      ansible.builtin.shell: |
        {{ dg_in_box }} sh -lc '
          set -eu
          export WINEPREFIX="{{ dg_dklr_prefix }}"
          export WINEARCH="{{ dg_dklr_winearch }}"
          export WINEDEBUG=-all
          export WINEDLLOVERRIDES=winemenubuilder.exe=d
          export WINEESYNC="{{ dg_dklr_wine_esync }}"
          export WINEFSYNC="{{ dg_dklr_wine_fsync }}"
          timeout 90 env -u PYTHONHOME -u PYTHONPATH "{{ dg_dklr_wineboot_bin }}" -u
          timeout 60 env -u PYTHONHOME -u PYTHONPATH "{{ dg_dklr_wineserver_bin }}" -w
        '
      when: not _dklr_prefix.stat.exists

    - name: Check DKLR winetricks component markers
      ansible.builtin.stat:
        path: "{{ dg_dklr_prefix }}/.dg-winetricks-{{ item }}"
      loop: "{{ dg_dklr_winetricks_components }}"
      register: _dklr_wt_markers

    - name: Install DKLR winetricks components (DXVK)
      ansible.builtin.shell: |
        {{ dg_in_box }} sh -lc '
          set -eu
          export WINEPREFIX="{{ dg_dklr_prefix }}"
          export WINEARCH="{{ dg_dklr_winearch }}"
          export WINEDEBUG=-all
          export WINEDLLOVERRIDES=winemenubuilder.exe=d
          timeout 300 env -u PYTHONHOME -u PYTHONPATH winetricks -q "{{ item.item }}"
          printf "%s\n" "{{ item.item }}" > "{{ dg_dklr_prefix }}/.dg-winetricks-{{ item.item }}"
        '
      loop: "{{ _dklr_wt_markers.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists

    - name: Deploy the DKLR launcher wrapper
      ansible.builtin.template:
        src: dklr.sh.j2
        dest: "{{ dg_dklr_bin }}"
        mode: "0755"

    - name: Refresh desktop launchers
      ansible.builtin.include_role:
        name: desktop_apps

    - name: Report DKLR setup
      ansible.builtin.debug:
        msg:
          - "DKLR installed at {{ dg_dklr_install_root }}; launcher {{ dg_dklr_bin }}."
          - "Keyboard-only game; the launcher bridges the pad to its SNES keys via evsieve (D-pad + ABXY + LR + Start/Select)."
          - "Run scripts/install-host-launchers.sh on the host to refresh the menu entry. Revert: -e dg_dklr_revert=true."
