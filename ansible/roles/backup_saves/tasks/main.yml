---
# Deploys the save-data backup/restore tooling: renders the manifest of save
# sets (from dg_save_sets) + the backup-root env on the host, deploys the
# backup-saves / restore-saves helpers there, and ensures the NAS root exists.
# Optionally restores saves on a fresh setup (dg_restore_saves_on_setup=true).
# See group_vars/all/backups.yml and docs/save-backups.md.

- name: Require the save-backup NAS mount before touching its root
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ dg_save_backup_nas_mount }}"]
  changed_when: false

- name: Ensure the NAS save-backup root exists
  ansible.builtin.file:
    path: "{{ dg_backup_root }}"
    state: directory
    mode: "0755"

- name: Ensure the host config and binary directories for save backups exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts.env.HOME }}/.config/distrobox-gaming"
    - "{{ ansible_facts.env.HOME }}/.local/bin"

- name: Render the save-set manifest
  ansible.builtin.template:
    src: save-manifest.tsv.j2
    dest: "{{ ansible_facts.env.HOME }}/.config/distrobox-gaming/save-manifest.tsv"
    mode: "0644"

- name: Render the backup-root env
  ansible.builtin.template:
    src: backup.env.j2
    dest: "{{ ansible_facts.env.HOME }}/.config/distrobox-gaming/backup.env"
    mode: "0644"

- name: Deploy the backup-saves / restore-saves helpers
  ansible.builtin.copy:
    src: "{{ dg_project_root }}/scripts/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }}"
    mode: "0755"
  loop:
    - backup-saves
    - restore-saves

- name: Remove retired in-box save helpers and configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ dg_box_home }}/bin/backup-saves"
    - "{{ dg_box_home }}/bin/restore-saves"
    - "{{ dg_box_home }}/.config/distrobox-gaming/backup.env"
    - "{{ dg_box_home }}/.config/distrobox-gaming/save-manifest.tsv"

- name: Restore saves from the NAS backup (opt-in, fresh remount)
  when: dg_restore_saves_on_setup | bool
  ansible.builtin.command:
    cmd: "{{ ansible_facts.env.HOME }}/.local/bin/restore-saves"
  register: _restore_saves
  changed_when: "'restored,' in _restore_saves.stdout"

- name: Show restore result
  when: dg_restore_saves_on_setup | bool
  ansible.builtin.debug:
    var: _restore_saves.stdout_lines
