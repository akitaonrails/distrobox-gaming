---
# Daytona USA 2 Power Edition — Web: a static WASM/WebGPU cabinet served from
# 127.0.0.1 and played in the host's Chromium app window, with the owned
# dayto2pe MAME set preloaded. See group_vars/all/daytona2_web.yml and
# docs/daytona2-web.md.

- name: Revert Daytona USA 2 Web when requested
  when: dg_daytona2_web_revert | bool
  block:
    - name: Remove the Daytona launcher, desktop entry + install dir (registered saves kept)
      ansible.builtin.include_role:
        name: revert_guard
      vars:
        revert_paths:
          - "{{ dg_daytona2_web_launcher }}"
          - "{{ dg_daytona2_web_root }}"
          - "{{ dg_daytona2_web_data }}"
          - "{{ dg_desktop_render_dir }}/gaming-daytona2-web.desktop"
    - name: Refresh host launchers after removing Daytona USA 2 Web
      ansible.builtin.command:
        cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
      environment:
        DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
        DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
      changed_when: true
    - name: Report Daytona USA 2 Web reverted
      ansible.builtin.debug:
        msg: "Daytona USA 2 Web removed. The owned dayto2pe.zip is untouched; the cabinet NVRAM backup is kept."

- name: Install Daytona USA 2 Web
  when: not (dg_daytona2_web_revert | bool)
  block:
    - name: Verify the owned dayto2pe MAME set
      ansible.builtin.stat:
        path: "{{ dg_daytona2_web_rom }}"
      register: _dtw_rom

    - name: Require the owned dayto2pe MAME set
      ansible.builtin.assert:
        that: _dtw_rom.stat.exists | default(false) and _dtw_rom.stat.size | int > 0
        fail_msg: >-
          Missing {{ dg_daytona2_web_rom }}. This install needs your own
          non-merged dayto2pe ZIP (Daytona USA 2 Power Edition); the page
          verifies every chip before it runs.
        quiet: true

    - name: Create the Daytona directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dg_daytona2_web_root }}"
        - "{{ dg_daytona2_web_root }}/roms"
        - "{{ dg_daytona2_web_data }}"
        - "{{ dg_daytona2_web_archive | dirname }}"
        - "{{ dg_daytona2_web_launcher | dirname }}"
        - "{{ dg_desktop_render_dir }}"

    - name: Stage the pinned Daytona USA 2 Web site
      ansible.builtin.get_url:
        url: "{{ dg_daytona2_web_asset_url }}"
        dest: "{{ dg_daytona2_web_archive }}"
        checksum: "sha256:{{ dg_daytona2_web_asset_sha256 }}"
        mode: "0644"

    - name: Read the installed site version
      ansible.builtin.slurp:
        src: "{{ dg_daytona2_web_root }}/.dg-version"
      register: _dtw_installed
      failed_when: false

    - name: Unpack the pinned site
      when: (_dtw_installed.content | default('') | b64decode | trim) != dg_daytona2_web_version
      ansible.builtin.unarchive:
        src: "{{ dg_daytona2_web_archive }}"
        dest: "{{ dg_daytona2_web_root }}"
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Record the installed site version
      ansible.builtin.copy:
        dest: "{{ dg_daytona2_web_root }}/.dg-version"
        content: "{{ dg_daytona2_web_version }}\n"
        mode: "0644"

    - name: Check the unpacked cabinet
      ansible.builtin.stat:
        path: "{{ dg_daytona2_web_root }}/{{ item }}"
      loop:
        - index.html
        - daytona2.wasm
        - daytona2.js
        - main.js
      register: _dtw_files
      failed_when: false

    - name: Require the unpacked cabinet
      ansible.builtin.assert:
        that: item.stat.exists | default(false)
        fail_msg: "{{ item.item }} is missing after unpacking {{ dg_daytona2_web_asset_name }}."
        quiet: true
      loop: "{{ _dtw_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Point the cabinet at the owned dayto2pe set
      ansible.builtin.file:
        src: "{{ dg_daytona2_web_rom }}"
        dest: "{{ dg_daytona2_web_rom_link }}"
        state: link
        force: true

    # The upstream page asks the player to pick a ZIP. This block lets the
    # launcher pass ?rom=1 and import the served copy through the same
    # chip-checking path as a manual pick, without copying 85 MB into the
    # browser profile.
    - name: Load the served ROM automatically with ?rom=1
      ansible.builtin.blockinfile:
        path: "{{ dg_daytona2_web_root }}/main.js"
        marker: "// {mark} dg-local-rom (install_daytona2_web)"
        block: |
          // ?rom=1 imports the owned dayto2pe ZIP served beside the app, so the
          // cabinet starts straight from the launcher. The ZIP is read by this
          // page only (nothing is uploaded) and is not stored in the browser
          // profile; the profile keeps the cabinet's NVRAM backup.
          if (new URLSearchParams(location.search).get('rom') === '1') {
            (async () => {
              try {
                const r = await fetch('./roms/dayto2pe.zip', { cache: 'no-store' });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const file = new File([await r.blob()], 'dayto2pe.zip', { type: 'application/zip' });
                const res = await importZip(file);
                if (!res || !res.ok) throw new Error('the cabinet rejected the chip set');
              } catch (e) {
                console.warn('[dg] local ROM:', e);
                status('Local ROM unavailable — choose your dayto2pe.zip.');
              }
            })();
          }

    - name: Deploy the Daytona USA 2 Web launcher
      ansible.builtin.template:
        src: daytona2-web.sh.j2
        dest: "{{ dg_daytona2_web_launcher }}"
        mode: "0755"

    - name: Render the Daytona USA 2 Web desktop entry
      ansible.builtin.template:
        src: daytona2-web.desktop.j2
        dest: "{{ dg_desktop_render_dir }}/gaming-daytona2-web.desktop"
        mode: "0644"

    - name: Install the desktop file into the host applications dir
      ansible.builtin.command:
        cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
      environment:
        DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
        DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
      register: _dtw_host_launchers
      changed_when: >-
        'installed ' in _dtw_host_launchers.stdout or
        'removed stale ' in _dtw_host_launchers.stdout

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Daytona USA 2 Power Edition (Web) {{ dg_daytona2_web_version }} served
          from {{ dg_daytona2_web_root }} on 127.0.0.1:{{ dg_daytona2_web_port }};
          launcher {{ dg_daytona2_web_launcher }}. Plays in Chromium with the
          owned dayto2pe set preloaded (WebGPU + WASM JSPI; Chrome/Edge 137+).
          Cabinet NVRAM backups are in {{ dg_daytona2_web_data }}.
          Revert: -e dg_daytona2_web_revert=true.