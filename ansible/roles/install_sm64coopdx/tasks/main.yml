---
# sm64coopdx prebuilt Linux binary + Last Impact Coop mod.
# See group_vars/all/sm64coopdx.yml and docs/sm64coopdx.md.

- name: Revert sm64coopdx when requested
  when: dg_sm64coopdx_revert | bool
  block:
    - name: Remove the sm64coopdx launcher + tool tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ dg_sm64coopdx_bin }}"
        - "{{ dg_sm64coopdx_root }}"
    - name: Report sm64coopdx reverted
      ansible.builtin.debug:
        msg: >-
          sm64coopdx removed. Your SM64 baserom on the NAS and the in-game
          config under ~/.local/share/sm64coopdx are untouched.

- name: Install sm64coopdx
  when: not (dg_sm64coopdx_revert | bool)
  block:
    - name: Create sm64coopdx directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dg_sm64coopdx_root }}"
        - "{{ dg_sm64coopdx_cache_dir }}"
        - "{{ dg_sm64coopdx_install_dir }}"
        - "{{ dg_box_home }}/bin"

    - name: Install sm64coopdx runtime packages inside box
      ansible.builtin.shell: >-
        {{ dg_in_box }} sudo pacman -S --needed --noconfirm
        {{ dg_sm64coopdx_packages | join(' ') }}
      register: _coopdx_pacman
      changed_when: "'installing' in _coopdx_pacman.stdout or 'upgrading' in _coopdx_pacman.stdout"

    - name: Download the pinned sm64coopdx Linux build
      ansible.builtin.get_url:
        url: "{{ dg_sm64coopdx_asset_url }}"
        dest: "{{ dg_sm64coopdx_cache_dir }}/{{ dg_sm64coopdx_asset_name }}"
        checksum: "sha256:{{ dg_sm64coopdx_asset_sha256 }}"
        mode: "0644"

    - name: Extract sm64coopdx into the install dir
      ansible.builtin.unarchive:
        src: "{{ dg_sm64coopdx_cache_dir }}/{{ dg_sm64coopdx_asset_name }}"
        dest: "{{ dg_sm64coopdx_install_dir }}"
        remote_src: true
        creates: "{{ dg_sm64coopdx_exe }}"

    - name: Ensure the sm64coopdx binary is executable
      ansible.builtin.file:
        path: "{{ dg_sm64coopdx_exe }}"
        mode: "0755"

    - name: Prepare verified SM64 US baserom next to the binary
      ansible.builtin.include_role:
        name: n64_rom_prepare
      vars:
        n64_rom_label: Super Mario 64 US (Coop DX)
        n64_rom_src: "{{ dg_sm64coopdx_rom_source }}"
        n64_rom_dst: "{{ dg_sm64coopdx_baserom }}"
        n64_rom_sha1: "{{ dg_sm64coopdx_baserom_sha1 }}"

    - name: Download the pinned Last Impact Coop mod
      ansible.builtin.get_url:
        url: "{{ dg_sm64coopdx_li_url }}"
        dest: "{{ dg_sm64coopdx_cache_dir }}/{{ dg_sm64coopdx_li_asset_name }}"
        checksum: "sha256:{{ dg_sm64coopdx_li_sha256 }}"
        mode: "0644"

    - name: Ensure the Last Impact mod dir exists
      ansible.builtin.file:
        path: "{{ dg_sm64coopdx_li_mod_dir }}"
        state: directory
        mode: "0755"

    - name: Install the Last Impact Coop mod into the mods dir
      ansible.builtin.unarchive:
        src: "{{ dg_sm64coopdx_cache_dir }}/{{ dg_sm64coopdx_li_asset_name }}"
        dest: "{{ dg_sm64coopdx_li_mod_dir }}"
        remote_src: true
        creates: "{{ dg_sm64coopdx_li_mod_dir }}/main.lua"

    - name: Deploy the sm64coopdx launcher
      ansible.builtin.template:
        src: sm64coopdx.sh.j2
        dest: "{{ dg_sm64coopdx_bin }}"
        mode: "0755"

    - name: Refresh desktop launchers
      ansible.builtin.include_role:
        name: desktop_apps

    - name: Report sm64coopdx setup
      ansible.builtin.debug:
        msg:
          - "sm64coopdx {{ dg_sm64coopdx_version }} installed at {{ dg_sm64coopdx_install_dir }}; launcher {{ dg_sm64coopdx_bin }}."
          - "First launch extracts assets from baserom.us.z64 (already placed next to the binary). Enable 'SM64 Last Impact' in the in-game Mods menu, then host/play. 8BitDo works natively (SDL2)."
          - "Run scripts/install-host-launchers.sh to refresh the menu. Revert: -e dg_sm64coopdx_revert=true."
