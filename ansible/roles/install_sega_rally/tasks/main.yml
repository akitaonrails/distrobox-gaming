---
# Sega Rally Championship (Wanszai HD PC wrapper). Mirrors
# install_model1 but with a single Wine backend. See
# group_vars/all/sega_rally.yml and docs/sega-arcade.md.

- name: Create Sega Rally persistent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_sega_rally_root }}"
    - "{{ dg_sega_rally_cache_dir }}"
    - "{{ dg_sega_rally_root }}/releases"
    - "{{ dg_sega_rally_prefix }}"
    - "{{ dg_box_home }}/bin"

- name: Warn if the required MAME Sega Rally ROM is missing
  ansible.builtin.debug:
    msg: >-
      Required MAME srallyc set absent: {{ dg_sega_rally_rom_source }}
      (Sega Rally Championship Twin/DX Rev C, MAME parent set). The
      wrapper installs but will not boot a race without it. NOTE: the
      Model 2 Emulator srallyc in roms_rare/model2 is the WRONG format
      for this MAME-core wrapper.
  when: not (dg_sega_rally_rom_source is file)

- name: Install Sega Rally runtime packages inside box
  ansible.builtin.shell: >-
    {{ dg_in_box }} sudo pacman -S --needed --noconfirm
    {{ dg_sega_rally_packages | join(' ') }}
  register: _sega_rally_pacman
  changed_when: "'installing' in _sega_rally_pacman.stdout"

- name: Install Sega Rally AUR runtime packages inside box
  # Tolerate a transient AUR build failure and report genuinely-missing
  # packages instead of aborting (same pattern as bootstrap_packages).
  ansible.builtin.shell: >-
    {{ dg_in_box }} yay -S --needed --noconfirm
    --answerclean None --answerdiff None
    {{ dg_sega_rally_aur_packages | join(' ') }}
  register: _sega_rally_yay
  changed_when: "'installing' in _sega_rally_yay.stdout"
  failed_when: false

- name: Detect missing Sega Rally AUR packages
  ansible.builtin.shell: >-
    {{ dg_in_box }} bash -lc 'm=""; for p in {{ dg_sega_rally_aur_packages | join(" ") }};
    do pacman -Q "$p" >/dev/null 2>&1 || m="$m $p"; done; echo "$m" | xargs'
  register: _sega_rally_aur_missing
  changed_when: false

- name: Warn about missing Sega Rally AUR packages
  ansible.builtin.debug:
    msg: >-
      Sega Rally AUR package(s) did not install: {{ _sega_rally_aur_missing.stdout | trim }}.
      Re-run to retry (evsieve, the exit-chord dep, is also in the core AUR set).
  when: _sega_rally_aur_missing.stdout | trim | length > 0

- name: Download pinned Sega Rally PC release
  ansible.builtin.get_url:
    url: "{{ dg_sega_rally_url }}"
    dest: "{{ dg_sega_rally_archive }}"
    checksum: "{{ dg_sega_rally_checksum }}"
    mode: "0644"
  when: not ansible_check_mode

- name: Create immutable Sega Rally release directory
  ansible.builtin.file:
    path: "{{ dg_sega_rally_release_dir }}"
    state: directory
    mode: "0755"

- name: Extract immutable Sega Rally release
  ansible.builtin.unarchive:
    src: "{{ dg_sega_rally_archive }}"
    dest: "{{ dg_sega_rally_release_dir }}"
    remote_src: true
    creates: "{{ dg_sega_rally_release_dir }}/{{ dg_sega_rally_release_subdir }}/{{ dg_sega_rally_exe }}"
  when: not ansible_check_mode

- name: Refresh Wanszai application files while preserving generated state
  # A new pinned release replaces the exe/assets, but nvram, settings and
  # any user soundtrack are written at runtime and must never be
  # overwritten or deleted. Guarded by a per-version marker.
  ansible.builtin.shell: >-
    rsync -a --itemize-changes
    --exclude=nvram/ --exclude=soundtrack/
    --exclude='settings.ini' --exclude='*.cfg' --exclude='*.sav'
    '{{ dg_sega_rally_release_dir }}/{{ dg_sega_rally_release_subdir }}/'
    '{{ dg_sega_rally_work_dir }}/'
    && touch '{{ dg_sega_rally_work_dir }}/.dg-release-{{ dg_sega_rally_version }}'
  args:
    creates: "{{ dg_sega_rally_work_dir }}/.dg-release-{{ dg_sega_rally_version }}"
  when: not ansible_check_mode

- name: Create wrapper-local ROM, soundtrack and nvram directories
  # nvram/ is excluded from the release rsync (it is runtime state), so
  # create it fresh — the game expects the dir to exist to persist saves.
  ansible.builtin.file:
    path: "{{ dg_sega_rally_work_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - roms
    - soundtrack
    - nvram

- name: Link the MAME Sega Rally ROM into the wrapper roms directory
  # Symlink, never copy — the NAS ROM stays the single source of truth.
  # The wrapper needs the file named srallyc.zip; the source is the MAME
  # parent set (possibly a dedup-renamed *_dup1.zip on the NAS).
  ansible.builtin.file:
    src: "{{ dg_sega_rally_rom_source }}"
    dest: "{{ dg_sega_rally_work_dir }}/roms/{{ dg_sega_rally_required_rom }}"
    state: link
    force: true
    follow: false
  when: dg_sega_rally_rom_source is file

- name: Initialize Sega Rally Wine prefix
  ansible.builtin.shell: |
    {{ dg_in_box }} sh -lc 'export WINEPREFIX="{{ dg_sega_rally_prefix }}" WINEARCH="{{ dg_sega_rally_winearch }}" WINEDEBUG=-all; env -u PYTHONHOME -u PYTHONPATH wineboot -u'
  args:
    creates: "{{ dg_sega_rally_prefix }}/system.reg"

- name: Force the GLX OpenGL backend (wine 11 EGL regression)
  # See roles/install_pc_racing/tasks/main.yml for the full rationale:
  # wine 10.17+ defaults winex11.drv to EGL, which resolves to Mesa
  # llvmpipe / the AMD iGPU instead of the RTX 5090 on this box.
  ansible.builtin.shell: |
    {{ dg_in_box }} sh -lc '
      set -eu
      export WINEPREFIX="{{ dg_sega_rally_prefix }}"
      export WINEARCH="{{ dg_sega_rally_winearch }}"
      export WINEDEBUG=-all
      key="HKCU\\Software\\Wine\\X11 Driver"

      if env -u PYTHONHOME -u PYTHONPATH wine reg query "$key" /v UseEGL 2>/dev/null | grep -Eiq "REG_SZ[[:space:]]+N[[:space:]]*$"; then
        exit 0
      fi

      env -u PYTHONHOME -u PYTHONPATH wine reg add "$key" /v UseEGL /t REG_SZ /d N /f
      printf "%s\n" "forced-glx"
    '
  register: _sega_rally_force_glx
  changed_when: "'forced-glx' in _sega_rally_force_glx.stdout"
  when: dg_wine_force_glx | default(true)

- name: Install Sega Rally Visual C++ runtime
  ansible.builtin.shell: |
    {{ dg_in_box }} sh -lc 'export WINEPREFIX="{{ dg_sega_rally_prefix }}" WINEARCH="{{ dg_sega_rally_winearch }}" WINEDEBUG=-all; timeout 300 env -u PYTHONHOME -u PYTHONPATH winetricks -q vcrun2022; touch "{{ dg_sega_rally_prefix }}/.dg-winetricks-vcrun2022"'
  args:
    creates: "{{ dg_sega_rally_prefix }}/.dg-winetricks-vcrun2022"

- name: Configure Sega Rally WineBus controller policy
  ansible.builtin.shell: |
    {{ dg_in_box }} sh -lc 'export WINEPREFIX="{{ dg_sega_rally_prefix }}" WINEARCH="{{ dg_sega_rally_winearch }}"; wine reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\winebus" /v "{{ item.name }}" /t REG_DWORD /d "{{ item.value }}" /f'
  changed_when: false
  loop: "{{ dg_sega_rally_winebus_registry }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy Sega Rally launcher
  ansible.builtin.template:
    src: sega-rally-launch.sh.j2
    dest: "{{ dg_box_home }}/bin/sega-rally-launch"
    mode: "0755"

- name: Render Sega Rally desktop entry
  ansible.builtin.template:
    src: sega-rally-hd.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/sega-rally-hd.desktop"
    mode: "0644"

- name: Install rendered Sega Rally desktop file into host applications dir
  ansible.builtin.command:
    cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  environment:
    DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
    DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
  register: _sega_rally_host_launchers
  changed_when: >-
    'installed ' in _sega_rally_host_launchers.stdout or
    'removed stale ' in _sega_rally_host_launchers.stdout

- name: Report Sega Rally setup
  ansible.builtin.debug:
    msg: >-
      Sega Rally (Wanszai) ready: {{ dg_box_home }}/bin/sega-rally-launch status.
      Launch via ES-DE (Model 2 → "Sega Rally HD (Wanszai)") or the
      "Sega Rally Championship HD" desktop entry.
