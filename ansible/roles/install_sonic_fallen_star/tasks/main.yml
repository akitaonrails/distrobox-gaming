---
# Sonic and the Fallen Star — Clickteam Fusion 2.5 Windows game under Wine
# (no Linux build). See group_vars/all/sonic_fallen_star.yml and
# docs/sonic-fan-pack.md. Modeled on install_sonic_sms_remake.

- name: Revert Sonic and the Fallen Star when requested
  when: dg_fs_revert | bool
  block:
    - name: Remove the Fallen Star launcher, install dir, prefix + desktop entry
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ dg_fs_bin }}"
        - "{{ dg_fs_install_dir }}"
        - "{{ dg_fs_prefix }}"
        - "{{ dg_desktop_render_dir }}/gaming-sonic-fallen-star.desktop"
    - name: Refresh host launchers after removing Fallen Star
      ansible.builtin.command:
        cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
      environment:
        DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
        DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
      changed_when: true
    - name: Report Fallen Star reverted
      ansible.builtin.debug:
        msg: "Sonic and the Fallen Star removed. The NAS zip is untouched."

- name: Install Sonic and the Fallen Star
  when: not (dg_fs_revert | bool)
  block:
    - name: Verify the NAS zip exists
      ansible.builtin.stat:
        path: "{{ dg_fs_zip }}"
      register: _fs_zip
      failed_when: not _fs_zip.stat.exists

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dg_fs_install_dir }}"
        - "{{ dg_box_home }}/bin"

    - name: Extract the game (once)
      ansible.builtin.shell: |
        set -eu
        [ -f "{{ dg_fs_gamedir }}/{{ dg_fs_exe }}" ] && exit 0
        unzip -oq "{{ dg_fs_zip }}" -d "{{ dg_fs_install_dir }}"
        echo extracted-fs
      register: _fs_extract
      changed_when: "'extracted-fs' in _fs_extract.stdout"

    - name: Initialize the Wine prefix
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          set -eu
          [ -d "{{ dg_fs_prefix }}/drive_c" ] && exit 0
          export WINEPREFIX="{{ dg_fs_prefix }}"
          "{{ dg_fs_wine_bin_dir }}/wineboot" -i >/dev/null 2>&1 || true
          "{{ dg_fs_wine_bin_dir }}/wineserver" -w || true
          echo prefix-created
        '
      register: _fs_prefix
      changed_when: "'prefix-created' in _fs_prefix.stdout"

    - name: Force the GLX OpenGL backend (wine 11 EGL -> iGPU regression)
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          export WINEPREFIX="{{ dg_fs_prefix }}"
          W="{{ dg_fs_wine_bin_dir }}"
          "$W/wine" reg query "HKCU\\Software\\Wine\\X11 Driver" /v UseEGL 2>/dev/null | grep -q N && exit 0
          "$W/wine" reg add "HKCU\\Software\\Wine\\X11 Driver" /v UseEGL /d N /f >/dev/null
          "$W/wineserver" -w || true
          echo egl-pinned
        '
      register: _fs_egl
      changed_when: "'egl-pinned' in _fs_egl.stdout"

    - name: Route controllers through SDL (winebus) so the 8BitDo reaches the game
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          export WINEPREFIX="{{ dg_fs_prefix }}"
          W="{{ dg_fs_wine_bin_dir }}"
          "$W/wine" reg add "HKCU\\Software\\Wine\\WineBus" /v "{{ item.name }}" /t REG_DWORD /d {{ item.value }} /f >/dev/null
          "$W/wineserver" -w || true
        '
      loop: "{{ dg_fs_winebus_registry }}"
      loop_control:
        label: "{{ item.name }}={{ item.value }}"
      changed_when: true

    - name: Deploy the launcher
      ansible.builtin.template:
        src: sonic-fallen-star.sh.j2
        dest: "{{ dg_fs_bin }}"
        mode: "0755"

    - name: Render the desktop entry
      ansible.builtin.template:
        src: gaming-sonic-fallen-star.desktop.j2
        dest: "{{ dg_desktop_render_dir }}/gaming-sonic-fallen-star.desktop"
        mode: "0644"

    - name: Install the desktop entry into the host applications dir
      ansible.builtin.command:
        cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
      environment:
        DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
        DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
      register: _fs_host_launchers
      changed_when: >-
        'installed ' in _fs_host_launchers.stdout or
        'removed stale ' in _fs_host_launchers.stdout

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Sonic and the Fallen Star {{ dg_fs_version }} under wine-11.8 at
          {{ dg_fs_gamedir }}; launcher {{ dg_fs_bin }} (gamescope integer
          fullscreen @60, 8BitDo via WineBus SDL). Revert: -e dg_fs_revert=true.
