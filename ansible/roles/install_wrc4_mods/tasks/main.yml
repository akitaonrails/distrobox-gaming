---
# WRC 4 (appid 256330) mod set — replaces DATA.MIX with the loose-camera /
# realistic-tyres mod (backup + marker-gated + reversible). See
# group_vars/all/wrc4_mods.yml and docs/wrc4-mods.md.

- name: Revert the WRC 4 mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_wrc4_revert | bool

- name: Install the WRC 4 mod set
  when: not (dg_wrc4_revert | bool)
  block:
    - name: Locate the WRC 4 game exe
      ansible.builtin.stat:
        path: "{{ dg_wrc4_game_dir }}/WRC4.exe"
      register: _wrc4_exe

    - name: Fail when WRC 4 is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_wrc4_game_dir }} not found (appid {{ dg_wrc4_appid }}).
          Mount the USB Steam library / install WRC 4, or override
          dg_wrc4_steam_library_root. See docs/wrc4-mods.md.
      when: not _wrc4_exe.stat.exists

    - name: Assert the WRC 4 exe version
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/pe-version.py
          {{ (dg_wrc4_game_dir + '/WRC4.exe') | quote }}
          --expect {{ dg_wrc4_required_version }}
      register: _wrc4_ver
      changed_when: false
      failed_when: _wrc4_ver.rc != 0

    - name: Download the WRC 4 mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py
          --game wrc4fiaworldrallychampionship
          --mod {{ item.id }} --file {{ item.file }} --via api
          --dest {{ (dg_wrc4_staging_root + '/' + item.id) | quote }}
      loop: "{{ dg_wrc4_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _wrc4_dl
      changed_when: "'saved' in _wrc4_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Find each staged archive
      ansible.builtin.find:
        paths: "{{ dg_wrc4_staging_root }}/{{ item.id }}"
        patterns: ["*.zip", "*.7z", "*.rar", "*.mix"]
      loop: "{{ dg_wrc4_mods }}"
      loop_control:
        label: "{{ item.id }}"
      register: _wrc4_staged

    - name: Fail with a manifest when the mod is not staged
      ansible.builtin.fail:
        msg: |
          Stage the WRC 4 mod (set NEXUS_MODS_API_KEY or download it manually):
          {% for r in _wrc4_staged.results %}
          {% if r.matched == 0 %}  - {{ r.item.id }} {{ r.item.name }} — https://www.nexusmods.com/wrc4fiaworldrallychampionship/mods/{{ r.item.id }} (file {{ r.item.file }}) -> {{ dg_wrc4_staging_root }}/{{ r.item.id }}/
          {% endif %}
          {% endfor %}
      when: _wrc4_staged.results | selectattr('matched', 'equalto', 0) | list | length > 0

    - name: Back up the stock DATA.MIX + install the mod (marker-gated)
      ansible.builtin.shell: |
        set -eu
        game={{ dg_wrc4_game_dir | quote }}
        target="$game/{{ item.target }}"
        marker="$game/.dg-wrc4-{{ item.id }}"
        [ -f "$marker" ] && { echo "skip {{ item.id }}"; exit 0; }
        arch="$(find {{ (dg_wrc4_staging_root + '/' + item.id) | quote }} -maxdepth 1 -type f \
          \( -name '*.zip' -o -name '*.7z' -o -name '*.rar' -o -iname '*.mix' \) | head -1)"
        [ -n "$arch" ] || { echo "NO-ARCHIVE" >&2; exit 3; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        case "$arch" in
          *.zip|*.7z|*.rar) 7z x -y -o"$tmp" "$arch" >/dev/null ;;
          *)                cp "$arch" "$tmp/{{ item.target }}" ;;
        esac
        src="$(find "$tmp" -type f -iname '{{ item.target }}' | head -1)"
        [ -n "$src" ] || { echo "NO-{{ item.target }}-IN-ARCHIVE" >&2; exit 4; }
        if [ -f "$target" ] && [ ! -f "$target.dg-orig" ]; then cp -a "$target" "$target.dg-orig"; fi
        cp -f "$src" "$target"
        printf '%s\n' "{{ item.name }}" > "$marker"
        echo "wrc4-installed {{ item.id }}"
      loop: "{{ dg_wrc4_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _wrc4_install
      changed_when: "'wrc4-installed' in _wrc4_install.stdout"

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "WRC 4: installed {{ dg_wrc4_mods | map(attribute='name') | join(', ') }}."
          - "DATA.MIX replaced; stock backed up to DATA.MIX.dg-orig. Variant: file 2 = loose cam 0.7 (default), file 4 = 0.78 stricter."
          - "Revert (restore stock DATA.MIX): -e dg_wrc4_revert=true."
