---
# akitaonrails/rea-colin-mcrae-4 ships a self-contained AppImage: its own Wine
# (WoW64), DXVK and dgVoodoo, the 16:9 Low aspect patch applied to a private
# copy, the largest-landscape-monitor pick, the Alt+F4/Super+W close hook and a
# proper Xidi analogue-pedal gamepad, plus a settings window then the game in
# gamescope. The role stages the pinned AppImage, seeds the launcher's own
# launcher.cfg, publishes the launcher + desktop entry, and removes the retired
# pc-racing CMR04 install. The owned source's cmr4.exe is the un-patched
# original; the launcher applies its own patch to its private runtime copy, and
# CMR04's loose save files (persistent) live in that runtime copy.

- name: Check the owned Colin McRae Rally 04 source executable
  ansible.builtin.stat:
    path: "{{ dg_cmr4_exe }}"
    checksum_algorithm: sha256
  register: _cmr4_exe

- name: Require the original (un-patched) CMR04 executable
  ansible.builtin.assert:
    that:
      - _cmr4_exe.stat.exists
      - _cmr4_exe.stat.checksum == dg_cmr4_exe_sha256
    fail_msg: >-
      Need a clean Colin McRae Rally 04 install (original un-patched cmr4.exe
      sha256 7dca9f4c… next to Data/fonts/shaders) at {{ dg_cmr4_source_dir }};
      see docs/rea-colin-mcrae-4.md.

- name: Check for a running Colin McRae Rally 04 session before migration
  ansible.builtin.command: pgrep -x cmr4.exe
  register: _cmr4_running
  failed_when: false
  changed_when: false

- name: Require Colin McRae Rally 04 to be closed for migration
  ansible.builtin.assert:
    that: _cmr4_running.rc == 1
    fail_msg: "Close Colin McRae Rally 04 before replacing the pc-racing install."

- name: Create the REA CMR04 directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_cmr4_root }}"
    - "{{ dg_cmr4_settings_dir }}"
    - "{{ dg_box_home }}/bin"

- name: Stage the pinned REA CMR04 launcher AppImage
  ansible.builtin.include_role:
    name: stage_rea_appimage
  vars:
    dg_rea_stage_asset_url: "{{ dg_cmr4_asset_url }}"
    dg_rea_stage_asset_name: "{{ dg_cmr4_asset_name }}"
    dg_rea_stage_asset_sha256: "{{ dg_cmr4_asset_sha256 }}"
    dg_rea_stage_install_dir: "{{ dg_cmr4_root }}"
    dg_rea_stage_retired_names:
      - CMR4Launcher-v0.3.1-x86_64.AppImage
      - CMR4Launcher-v0.4.0-x86_64.AppImage
      - CMR4Launcher-v0.4.1-x86_64.AppImage

# The settings window fills resolution from the screen when unset; seeding the
# maxed-out values keeps a headless --play on the 4K panel. force: false — once
# the launcher or the player writes the file, it is theirs.
- name: Seed the REA CMR04 launcher settings
  ansible.builtin.copy:
    dest: "{{ dg_cmr4_settings_dir }}/launcher.cfg"
    mode: "0644"
    force: false
    content: |
      # Colin McRae Rally 04 launcher settings (seeded by install_rea_colin_mcrae_4).
      game = {{ dg_cmr4_win_source }}
      {% for key, value in dg_cmr4_settings.items() %}
      {{ key }} = {{ value }}
      {% endfor %}

- name: Remember the game folder on an already-written config
  ansible.builtin.lineinfile:
    path: "{{ dg_cmr4_settings_dir }}/launcher.cfg"
    regexp: "^game *="
    line: "game = {{ dg_cmr4_win_source }}"
    insertbefore: BOF

- name: Install the reentrant REA CMR04 launcher
  ansible.builtin.template:
    src: rea-colin-mcrae-4.sh.j2
    dest: "{{ dg_cmr4_launcher }}"
    mode: "0755"

- name: Render the REA CMR04 desktop entry
  ansible.builtin.template:
    src: rea-colin-mcrae-4.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/rea-colin-mcrae-4.desktop"
    mode: "0644"

- name: Publish the REA CMR04 desktop entry
  ansible.builtin.command: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  changed_when: false

# Retire the pc-racing CMR04 install: launchers, entries, the box copy of the
# game (now staged clean on the NAS) and its per-game Wine prefix.
- name: Remove the retired pc-racing CMR04 launchers and desktop entry
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ dg_cmr4_old_bin + [dg_desktop_render_dir ~ '/' ~ dg_cmr4_old_desktop,
                               dg_host_applications_dir ~ '/' ~ dg_cmr4_old_desktop] }}"

- name: Remove the retired pc-racing CMR04 install and prefix
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ dg_cmr4_old_install }}"
    - "{{ dg_cmr4_old_prefix }}"
