---
- name: Require the owned GT3 NTSC-U disc image
  ansible.builtin.stat:
    path: "{{ dg_gt3pc_disc }}"
  register: _gt3pc_disc
- name: Fail without the disc the one-time install needs
  ansible.builtin.assert:
    that: _gt3pc_disc.stat.isreg | default(false)
    fail_msg: >-
      GT3 PC Enhanced installs its game files from an NTSC-U GT3 disc image at
      dg_gt3pc_disc (SCUS-97102 or PBPX-95503). Only needed once, for
      "Install game files...". See docs/gt3-pc-enhanced.md.
    quiet: true

- name: Create GT3 PC Enhanced directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_gt3pc_archive | dirname }}"
    - "{{ dg_gt3pc_root }}"
    - "{{ dg_gt3pc_bin }}"
    - "{{ dg_gt3pc_staging }}"
    - "{{ dg_gt3pc_dxvk_extract }}"
    - "{{ dg_gt3pc_prefix }}"
    - "{{ dg_box_home }}/bin"

- name: Ensure Wine is installed in the gaming box
  ansible.builtin.shell: "{{ dg_in_box }} sudo pacman -S --needed --noconfirm wine"
  register: _gt3pc_packages
  changed_when: "'installing' in _gt3pc_packages.stdout"

- name: Stage the pinned GT3 PC Enhanced release
  ansible.builtin.get_url:
    url: "{{ dg_gt3pc_asset_url }}"
    dest: "{{ dg_gt3pc_archive }}"
    checksum: "sha256:{{ dg_gt3pc_asset_sha256 }}"
    mode: "0644"

- name: Extract the release into staging
  ansible.builtin.unarchive:
    src: "{{ dg_gt3pc_archive }}"
    dest: "{{ dg_gt3pc_staging }}"
    remote_src: true
    creates: "{{ dg_gt3pc_staging }}/bin/gt3pc.exe"

- name: Install only the runtime files (exclude .pdb/.ilk debug artifacts)
  ansible.builtin.copy:
    src: "{{ dg_gt3pc_staging }}/bin/{{ item }}"
    dest: "{{ dg_gt3pc_bin }}/{{ item }}"
    remote_src: true
    mode: "0644"
  loop: "{{ dg_gt3pc_runtime_files }}"

- name: Initialize the dedicated GT3 PC Enhanced Wine prefix
  ansible.builtin.shell: >-
    {{ dg_in_box }} sh -lc 'WINEPREFIX="{{ dg_gt3pc_prefix }}" WINEDEBUG=-all
    env -u PYTHONHOME -u PYTHONPATH wineboot -u'
  args:
    creates: "{{ dg_gt3pc_prefix }}/system.reg"

- name: Stage native D3D shader compiler DLLs for Wine
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ dg_roms_final_root }}/PC/releases/GT3PC-d3dcompiler_47-{{ item.name }}.dll"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0644"
  loop: "{{ dg_gt3pc_compiler_dlls }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install native D3D shader compiler DLLs in the prefix
  ansible.builtin.copy:
    src: "{{ dg_roms_final_root }}/PC/releases/GT3PC-d3dcompiler_47-{{ item.name }}.dll"
    dest: "{{ item.dest }}"
    remote_src: true
    mode: "0644"
  loop: "{{ dg_gt3pc_compiler_dlls }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stage the pinned DXVK release
  ansible.builtin.get_url:
    url: "{{ dg_gt3pc_dxvk_url }}"
    dest: "{{ dg_gt3pc_dxvk_archive }}"
    checksum: "sha256:{{ dg_gt3pc_dxvk_sha256 }}"
    mode: "0644"

- name: Extract the pinned DXVK release
  ansible.builtin.unarchive:
    src: "{{ dg_gt3pc_dxvk_archive }}"
    dest: "{{ dg_gt3pc_dxvk_extract }}"
    remote_src: true
    creates: "{{ dg_gt3pc_dxvk_extract }}/dxvk-{{ dg_gt3pc_dxvk_version }}/x32/d3d11.dll"

- name: Install DXVK DLLs into both Wine architectures
  # The game is 32-bit (loads d3d11 from syswow64); x64 covers the launcher
  # and any 64-bit helper.
  ansible.builtin.copy:
    src: "{{ dg_gt3pc_dxvk_extract }}/dxvk-{{ dg_gt3pc_dxvk_version }}/{{ item.0 }}/{{ item.1 }}.dll"
    dest: "{{ dg_gt3pc_prefix }}/drive_c/windows/{{ 'system32' if item.0 == 'x64' else 'syswow64' }}/{{ item.1 }}.dll"
    remote_src: true
    mode: "0644"
  loop: "{{ ['x32', 'x64'] | product(dg_gt3pc_dxvk_dlls) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"

- name: Pin GLX, native DXVK/compiler, and SDL controller mapping
  # Wine 10.17+ EGL picks the iGPU/llvmpipe instead of the RTX, so the game
  # renders on software without the GLX pin (UseEGL=N). DXVK + d3dcompiler are
  # forced native so WineD3D/vkd3d never take over; winebus drives the pad
  # through SDL so the 8BitDo maps as an Xbox controller.
  ansible.builtin.shell: |
    {{ dg_in_box }} sh -lc '
      set -eu
      export WINEPREFIX="{{ dg_gt3pc_prefix }}" WINEDEBUG=-all
      key="HKCU\\Software\\Wine\\X11 Driver"
      if ! wine reg query "$key" /v UseEGL 2>/dev/null | grep -Eiq "REG_SZ[[:space:]]+N[[:space:]]*$"; then
        wine reg add "$key" /v UseEGL /t REG_SZ /d N /f >/dev/null
        echo changed
      fi
      key="HKCU\\Software\\Wine\\DllOverrides"
      for name in d3dcompiler_47 {{ dg_gt3pc_dxvk_dlls | join(' ') }}; do
        if ! wine reg query "$key" /v "$name" 2>/dev/null | grep -Eiq "REG_SZ[[:space:]]+native[[:space:]]*$"; then
          wine reg add "$key" /v "$name" /t REG_SZ /d native /f >/dev/null
          echo changed
        fi
      done
      key="HKLM\\System\\CurrentControlSet\\Services\\winebus"
      for pair in "DisableHidraw:1" "DisableInput:1" "Enable SDL:1" "Map Controllers:1"; do
        name=${pair%:*}; value=${pair#*:}
        if ! wine reg query "$key" /v "$name" 2>/dev/null | grep -Eiq "REG_DWORD[[:space:]]+0x$value[[:space:]]*$"; then
          wine reg add "$key" /v "$name" /t REG_DWORD /d "$value" /f >/dev/null
          echo changed
        fi
      done
    '
  register: _gt3pc_registry
  changed_when: "'changed' in _gt3pc_registry.stdout"

- name: "Map Wine drive D: to the disc folder for the install picker"
  ansible.builtin.file:
    src: "{{ dg_gt3pc_disc_dir }}"
    dest: "{{ dg_gt3pc_prefix }}/dosdevices/d:"
    state: link
    force: true
    follow: false

- name: Install the GT3 PC Enhanced launcher
  ansible.builtin.template:
    src: gt3-pc-enhanced.sh.j2
    dest: "{{ dg_gt3pc_launcher }}"
    mode: "0755"

- name: Render the GT3 PC Enhanced desktop entry
  ansible.builtin.template:
    src: gt3-pc-enhanced.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/gaming-gt3-pc-enhanced.desktop"
    mode: "0644"

- name: Publish the GT3 PC Enhanced desktop entry
  ansible.builtin.command:
    cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  environment:
    DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
    DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
  register: _gt3pc_host_launchers
  changed_when: >-
    'installed ' in _gt3pc_host_launchers.stdout or
    'removed stale ' in _gt3pc_host_launchers.stdout

- name: Check whether the game files have been installed from the disc
  ansible.builtin.stat:
    path: "{{ dg_gt3pc_data }}"
  register: _gt3pc_data

- name: Require the one-time game-file install
  ansible.builtin.assert:
    that: _gt3pc_data.stat.isdir | default(false)
    fail_msg: >-
      The launcher is installed but the game files are not. Run
      {{ dg_gt3pc_launcher }} build, click Start, then "Install game files..."
      and pick the GT3 disc from drive D: (its Play tab). See
      docs/gt3-pc-enhanced.md.
    quiet: true

- name: Check whether the 4K / max-graphics defaults have been seeded
  ansible.builtin.stat:
    path: "{{ dg_gt3pc_bin }}/.dg-gt3pc-settings-v1"
  register: _gt3pc_settings_seeded

- name: Seed 4K fullscreen and max-graphics defaults once
  # Set once so later in-game changes win. 4K fullscreen (DXVK presents
  # borderless, no modeset), 16x AF, full reflection detail/resolution, all
  # car reflections.
  community.general.ini_file:
    path: "{{ dg_gt3pc_bin }}/gt3pc.ini"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - { section: Display, option: Mode, value: fullscreen }
    - { section: Display, option: Width, value: "{{ dg_gt3pc_display_width }}" }
    - { section: Display, option: Height, value: "{{ dg_gt3pc_display_height }}" }
    - { section: Display, option: Refresh, value: "0" }
    - { section: Graphics, option: AnisotropicFiltering, value: "16" }
    - { section: Graphics, option: Lod, value: "off" }
    - { section: Graphics, option: ReflectionDetail, value: "full" }
    - { section: Graphics, option: ReflectionResolution, value: "full" }
    - { section: Graphics, option: CarReflections, value: "all" }
  when: not _gt3pc_settings_seeded.stat.exists

- name: Record first-run graphics setup
  ansible.builtin.file:
    path: "{{ dg_gt3pc_bin }}/.dg-gt3pc-settings-v1"
    state: touch
    mode: "0644"
  when: not _gt3pc_settings_seeded.stat.exists
