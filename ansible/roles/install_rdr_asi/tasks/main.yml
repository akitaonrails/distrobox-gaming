---
# Red Dead Redemption (appid 2668510) ASI mods — Ultimate ASI Loader + RDRFix.
# See group_vars/all/rdr_asi.yml and docs/nexusmods.md.

- name: Revert the RDR ASI set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_rdr_asi_revert | bool

- name: Install the RDR ASI set
  when: not (dg_rdr_asi_revert | bool)
  block:
    - name: Locate RDR.exe
      ansible.builtin.stat:
        path: "{{ dg_rdr_asi_game_dir }}/RDR.exe"
      register: _rdra_game

    - name: Fail when RDR is not found
      ansible.builtin.fail:
        msg: "{{ dg_rdr_asi_game_dir }}/RDR.exe not found (appid {{ dg_rdr_asi_appid }}). See docs/nexusmods.md."
      when: not _rdra_game.stat.exists

    - name: Ensure the Ultimate ASI Loader staging dir exists
      ansible.builtin.file:
        path: "{{ dg_rdr_asi_ual_staging_root }}"
        state: directory
        mode: "0755"

    - name: Check the staged Ultimate ASI Loader zip
      ansible.builtin.stat:
        path: "{{ dg_rdr_asi_ual_staging_root }}/{{ dg_rdr_asi_ual_asset }}"
      register: _rdra_ual_zip

    - name: Download Ultimate ASI Loader (reused from the NAS if present)
      ansible.builtin.get_url:
        url: "{{ dg_rdr_asi_ual_url }}"
        dest: "{{ dg_rdr_asi_ual_staging_root }}/{{ dg_rdr_asi_ual_asset }}"
        mode: "0644"
        timeout: 120
      when: not _rdra_ual_zip.stat.exists

    - name: Install the ASI loader ({{ dg_rdr_asi_ual_dll }}) next to RDR.exe
      ansible.builtin.shell: |
        set -eu
        game={{ dg_rdr_asi_game_dir | quote }}
        dll="{{ dg_rdr_asi_ual_dll }}"
        marker="$game/.dg-rdr-asi-loader"
        [ -f "$marker" ] && { echo "skip"; exit 0; }
        [ -e "$game/$dll" ] && [ ! -e "$game/$dll.dg-orig" ] && cp -a "$game/$dll" "$game/$dll.dg-orig"
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" {{ (dg_rdr_asi_ual_staging_root + '/' + dg_rdr_asi_ual_asset) | quote }} >/dev/null
        src="$(find "$tmp" -name "$dll" | head -1)"
        [ -n "$src" ] || { echo "NO-LOADER-DLL" >&2; exit 4; }
        cp -f "$src" "$game/$dll"
        echo "installed" > "$marker"
        echo "loader-installed"
      register: _rdra_loader
      changed_when: "'loader-installed' in _rdra_loader.stdout"

    - name: Download each RDR ASI mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game reddeadredemption
          --mod {{ item.id }} --file {{ item.file }} --via api
          --dest {{ (dg_rdr_asi_staging_root + '/' + item.id + '/' + item.file) | quote }}
      loop: "{{ dg_rdr_asi_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _rdra_dl
      changed_when: "'saved' in _rdra_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Install each ASI mod into the game root (records a manifest)
      ansible.builtin.shell: |
        set -eu
        game={{ dg_rdr_asi_game_dir | quote }}
        manifest="$game/.dg-rdr-asi-{{ item.id }}.manifest"
        [ -f "$manifest" ] && { echo "skip"; exit 0; }
        arch="$(find {{ (dg_rdr_asi_staging_root + '/' + item.id + '/' + item.file) | quote }} -type f \
          \( -name '*.zip' -o -name '*.7z' -o -name '*.rar' \) | head -1)"
        [ -n "$arch" ] || { echo "NO-ARCHIVE" >&2; exit 3; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" "$arch" >/dev/null
        # Copy the .asi and its .ini/.log config next to RDR.exe (preserve any user .ini once).
        : > "$manifest.tmp"
        find "$tmp" -type f \( -name '*.asi' -o -name '*.ini' \) > "$tmp/.files"
        [ -s "$tmp/.files" ] || { echo "NO-ASI" >&2; exit 4; }
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          name="$(basename "$f")"
          case "$name" in
            *.ini) [ -e "$game/$name" ] && [ ! -e "$game/$name.dg-orig" ] && cp -a "$game/$name" "$game/$name.dg-orig" || true ;;
          esac
          cp -f "$f" "$game/$name"
          echo "$name" >> "$manifest.tmp"
        done < "$tmp/.files"
        mv "$manifest.tmp" "$manifest"
        echo "asi-installed"
      loop: "{{ dg_rdr_asi_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _rdra_install
      changed_when: "'asi-installed' in _rdra_install.stdout"

    # --- Steam launch override (dinput8) ---
    - name: Auto-discover the in-box Steam localconfig.vdf
      ansible.builtin.find:
        paths: "{{ dg_rdr_asi_steam_root }}/userdata"
        patterns: localconfig.vdf
        recurse: true
      register: _rdra_localconfigs
      when: dg_rdr_asi_steam_localconfig | length == 0

    - name: Resolve the localconfig path
      ansible.builtin.set_fact:
        _rdra_localconfig: >-
          {{ dg_rdr_asi_steam_localconfig if (dg_rdr_asi_steam_localconfig | length > 0)
             else (_rdra_localconfigs.files | map(attribute='path') | list | first
                   if (_rdra_localconfigs.files | default([]) | length == 1) else '') }}

    - name: Check if Steam is running
      ansible.builtin.shell: |
        pgrep -u "$(id -u)" -x steam >/dev/null || pgrep -u "$(id -u)" -f '/steam(webhelper)?( |$)' >/dev/null
      register: _rdra_steam_running
      changed_when: false
      failed_when: false
      check_mode: false
      when: _rdra_localconfig | length > 0

    - name: Warn that the launch override was not set (Steam running)
      ansible.builtin.debug:
        msg: >-
          Steam is running; the dinput8 override was NOT set. Set it manually
          (RDR -> Launch Options -> {{ dg_rdr_asi_launch_options }}) or close Steam
          and re-run. The ASI mod is installed.
      when:
        - _rdra_localconfig | length > 0
        - _rdra_steam_running.rc == 0

    - name: Set the RDR Steam launch options (dinput8 override)
      ansible.builtin.command: >-
        {{ dg_project_root }}/scripts/set-steam-launch-options.py
        --localconfig {{ _rdra_localconfig | quote }}
        --set {{ dg_rdr_asi_appid | quote }} {{ dg_rdr_asi_launch_options | quote }}
      register: _rdra_launch
      changed_when: "'changed: true' in _rdra_launch.stdout"
      when:
        - _rdra_localconfig | length > 0
        - _rdra_steam_running.rc != 0

    - name: Report
      ansible.builtin.debug:
        msg:
          - "RDR ASI: Ultimate ASI Loader + {{ dg_rdr_asi_mods | map(attribute='name') | join(', ') }} installed next to RDR.exe."
          - "{{ 'Launch override set.' if (_rdra_localconfig | length > 0 and _rdra_steam_running.rc != 0) else 'Set launch option manually: ' + dg_rdr_asi_launch_options }}"
          - "Edit RDRFix.ini to toggle features. Revert: -e dg_rdr_asi_revert=true."
