---
# Resident Evil Village (appid 1196590) mod set — Fluffy natives/ + patch .pak.
# See group_vars/all/revillage_mods.yml and docs/nexusmods.md.

- name: Revert the RE Village mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_revillage_revert | bool

- name: Install the RE Village mod set
  when: not (dg_revillage_revert | bool)
  block:
    - name: Locate the RE Village game dir
      ansible.builtin.stat:
        path: "{{ dg_revillage_game_dir }}"
      register: _rev_game

    - name: Fail when RE Village is not found
      ansible.builtin.fail:
        msg: >-
          {{ dg_revillage_game_dir }} not found (appid {{ dg_revillage_appid }}).
          Install RE Village, or override dg_revillage_steam_library_root.
          See docs/nexusmods.md.
      when: not _rev_game.stat.exists

    - name: Download each RE Village mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game residentevilvillage
          --mod {{ item.id }} --file {{ item.file }} --via api
          --dest {{ (dg_revillage_staging_root + '/' + item.id) | quote }}
      loop: "{{ dg_revillage_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _rev_dl
      changed_when: "'saved' in _rev_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Install each Fluffy overlay (natives/ tree or patch .pak)
      ansible.builtin.shell: |
        set -eu
        game={{ dg_revillage_game_dir | quote }}
        manifest="$game/.dg-revillage-{{ item.id }}.manifest"
        [ -f "$manifest" ] && { echo "skip"; exit 0; }
        arch="$(find {{ (dg_revillage_staging_root + '/' + item.id) | quote }} -type f \
          \( -name '*.zip' -o -name '*.rar' -o -name '*.7z' \) | head -1)"
        [ -n "$arch" ] || { echo "NO-ARCHIVE" >&2; exit 3; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" "$arch" >/dev/null
        variant={{ item.variant | quote }}
        if [ -n "$variant" ]; then
          mi="$(find "$tmp" -path "*$variant/modinfo.ini" | head -1)"
        else
          mi="$(find "$tmp" -name modinfo.ini | head -1)"
        fi
        [ -n "$mi" ] || { echo "NO-MODINFO" >&2; exit 4; }
        src="$(dirname "$mi")"
        if [ -d "$src/natives" ]; then
          ( cd "$src" && find natives -type f ) > "$manifest.tmp"
          rsync -a "$src/natives/" "$game/natives/"
        elif ls "$src"/*.pak >/dev/null 2>&1; then
          slot={{ (item.pak_slot | default('900')) | quote }}
          pak="$(ls "$src"/*.pak | head -1)"
          rel="re_chunk_000.pak.patch_${slot}.pak"
          cp -f "$pak" "$game/$rel"
          echo "$rel" > "$manifest.tmp"
        else
          echo "NO-PAYLOAD" >&2; exit 5
        fi
        mv "$manifest.tmp" "$manifest"
        echo "revillage-installed"
      loop: "{{ dg_revillage_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}{{ ' [' + item.variant + ']' if item.variant else '' }}"
      register: _rev_install
      changed_when: "'revillage-installed' in _rev_install.stdout"

    - name: Report completion
      ansible.builtin.debug:
        msg:
          - "RE Village: installed {{ dg_revillage_mods | map(attribute='name') | join(', ') }} (Fluffy natives/stm)."
          - "Deferred 651 Infinite Ammo (REFramework Lua); manual 184 Newgame Plus (save files). Revert: -e dg_revillage_revert=true."
