[package]
name = "daytona-headless"
version = "0.0.0"
edition = "2021"

# Only the patcher's own modules are used; the Tauri GUI (and its Windows-only
# build) is not part of this crate.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
