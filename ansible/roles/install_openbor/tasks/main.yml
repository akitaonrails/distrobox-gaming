---
# OpenBOR (native Linux engine) + data-driven fan-game installs. Pins the
# official OpenBOR 4.0 AppImage, extracts it (its bundled libs are required —
# libSDL2_gfx / libvpx.so.5 aren't available from Arch), deploys a wrapper that
# runs a .pak natively on the RTX + DP-1, stages each game's .pak into the
# ES-DE openbor ROM dir, and renders desktop entries. See docs/openbor.md.

- name: Create OpenBOR directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_openbor_cache_dir }}"
    - "{{ dg_openbor_data_dir }}"
    - "{{ dg_openbor_roms_dir }}"
    - "{{ dg_box_home }}/bin"

- name: Download the pinned OpenBOR AppImage
  ansible.builtin.get_url:
    url: "{{ dg_openbor_asset_url }}"
    dest: "{{ dg_openbor_cache_dir }}/{{ dg_openbor_asset_name }}"
    checksum: "sha256:{{ dg_openbor_asset_sha256 }}"
    mode: "0755"

- name: Extract the OpenBOR AppImage (ref-gated; bundled libs are needed)
  ansible.builtin.shell: |
    set -eu
    eng="{{ dg_openbor_engine_dir }}"
    if [ -x "$eng/usr/bin/OpenBOR" ] && grep -qx "{{ dg_openbor_version }}" "$eng/.dg-installed-ref" 2>/dev/null; then
      exit 0
    fi
    tmp="$(mktemp -d -p "{{ dg_openbor_root }}")"
    cd "$tmp"
    "{{ dg_openbor_cache_dir }}/{{ dg_openbor_asset_name }}" --appimage-extract >/dev/null
    rm -rf "$eng"
    mv "$tmp/squashfs-root" "$eng"
    rm -rf "$tmp"
    chmod 0755 "$eng/usr/bin/OpenBOR"
    printf '%s\n' "{{ dg_openbor_version }}" > "$eng/.dg-installed-ref"
    printf '%s\n' "extracted-openbor"
  register: _openbor_extract
  changed_when: "'extracted-openbor' in _openbor_extract.stdout"

- name: Assert the native engine links cleanly inside the box
  ansible.builtin.shell: >-
    {{ dg_in_box }} sh -c 'LD_LIBRARY_PATH="{{ dg_openbor_engine_dir }}/usr/lib"
    ldd "{{ dg_openbor_engine_dir }}/usr/bin/OpenBOR" | grep -c "not found" || true'
  register: _openbor_ldd
  changed_when: false
  failed_when: (_openbor_ldd.stdout | trim) != "0"

- name: Deploy the OpenBOR wrapper
  ansible.builtin.template:
    src: openbor.sh.j2
    dest: "{{ dg_openbor_bin }}"
    mode: "0755"

- name: Assert each game's staged archive exists
  ansible.builtin.stat:
    path: "{{ item.archive }}"
  loop: "{{ dg_openbor_games }}"
  loop_control:
    label: "{{ item.name }}"
  register: _openbor_archives
  failed_when: not _openbor_archives.stat.exists

- name: Stage each game's .pak into the OpenBOR ROM dir (extract only the pak)
  # bsdtar (libarchive) reads .rar/.zip/.7z alike; strip the member's dirs.
  ansible.builtin.shell: >-
    bsdtar -xf {{ item.archive | quote }} -C {{ dg_openbor_roms_dir | quote }}
    --strip-components {{ (item.pak_member | dirname | length > 0) | ternary(1, 0) }}
    {{ item.pak_member | quote }}
  args:
    creates: "{{ dg_openbor_roms_dir }}/{{ item.pak }}"
  loop: "{{ dg_openbor_games }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy the OpenBOR 8BitDo pad-bind helper
  ansible.builtin.copy:
    src: "{{ dg_project_root }}/scripts/openbor-bind-8bitdo.py"
    dest: "{{ dg_openbor_bind_helper }}"
    mode: "0755"

- name: Bake 8BitDo -> Player 1 into each game's control cfg
  # OpenBOR defaults Player 1 to the keyboard and Player 2 to joystick index 1,
  # so a single controller (js0) is bound to nobody and the game ignores it.
  # Generate the cfg headlessly (SDL dummy driver — no window flashes during a
  # rebuild) if it does not exist yet, then bind js0 to Player 1. Idempotent and
  # leaves a user's manual in-game rebind alone; the wrapper also self-heals.
  ansible.builtin.shell: |
    set -eu
    cfg="{{ dg_openbor_data_dir }}/Saves/{{ item.pak | regex_replace('\\.pak$', '') }}.cfg"
    if [ ! -f "$cfg" ]; then
      {{ dg_in_box }} sh -c 'cd "{{ dg_openbor_data_dir }}" && \
        LD_LIBRARY_PATH="{{ dg_openbor_engine_dir }}/usr/lib" \
        SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
        timeout 12 "{{ dg_openbor_engine_dir }}/usr/bin/OpenBOR" \
        "{{ dg_openbor_roms_dir }}/{{ item.pak }}"' >/dev/null 2>&1 || true
    fi
    python3 "{{ dg_project_root }}/scripts/openbor-bind-8bitdo.py" "$cfg"
  register: _openbor_bind
  changed_when: "'bound 8BitDo' in _openbor_bind.stdout"
  loop: "{{ dg_openbor_games }}"
  loop_control:
    label: "{{ item.name }}"

- name: Render per-game desktop entries
  ansible.builtin.template:
    src: openbor-game.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/gaming-openbor-{{ item.slug }}.desktop"
    mode: "0644"
  loop: "{{ dg_openbor_games | selectattr('desktop', 'defined') | selectattr('desktop') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install desktop entries into the host applications dir
  ansible.builtin.command:
    cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  environment:
    DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
    DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
  register: _openbor_host_launchers
  changed_when: >-
    'installed ' in _openbor_host_launchers.stdout or
    'removed stale ' in _openbor_host_launchers.stdout

- name: Report
  ansible.builtin.debug:
    msg: >-
      OpenBOR {{ dg_openbor_version }} native at {{ dg_openbor_engine_dir }}; wrapper
      {{ dg_openbor_bin }} <game.pak>. Paks in {{ dg_openbor_roms_dir }} (ES-DE
      'openbor' system — regenerate with: ansible-playbook reset-configs.yml --tags esde).
