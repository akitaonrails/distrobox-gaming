---
# Art of Rally (appid 550320) Unity Mod Manager mod set. See
# group_vars/all/artofrally_mods.yml and docs/nexusmods.md.
#
# Option A (headless UMM): the Doorstop setup is reproduced by this role, not
# generated by UMM's own installer — so VERIFY in-game with Ctrl+F10. If UMM
# doesn't appear, run UnityModManager.exe under Proton once (writes the correct
# config), then re-run for the mods.

- name: Revert the Art of Rally mod set when requested
  ansible.builtin.include_tasks: revert.yml
  when: dg_artofrally_revert | bool

- name: Install the Art of Rally mod set
  when: not (dg_artofrally_revert | bool)
  block:
    - name: Locate the Art of Rally install
      ansible.builtin.stat:
        path: "{{ dg_artofrally_game_dir }}/artofrally_Data"
      register: _aor_game

    - name: Fail when Art of Rally is not found
      ansible.builtin.fail:
        msg: >-
          Art of Rally not found at {{ dg_artofrally_game_dir }} (appid
          {{ dg_artofrally_appid }}). It's on the external USB library here —
          set dg_external_usb_games_root to that drive (and mount it), or
          override dg_artofrally_steam_library_root. See docs/nexusmods.md.
      when: not _aor_game.stat.exists

    - name: Remind to switch Art of Rally to Proton
      ansible.builtin.debug:
        msg: >-
          UMM/Doorstop needs the Windows build: set Art of Rally to run under
          Proton (Steam → Properties → Compatibility → Force Proton) so the
          winhttp shim loads. Native-Linux Doorstop is untested by the authors.

    # --- Unity Mod Manager (DoorstopProxy) ---

    - name: Ensure the UMM staging dir exists
      ansible.builtin.file:
        path: "{{ dg_artofrally_staging_root }}/{{ dg_artofrally_umm_dir }}"
        state: directory
        mode: "0755"

    - name: Download Unity Mod Manager via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game site
          --mod {{ dg_artofrally_umm_mod }} --file {{ dg_artofrally_umm_file }}
          --via api --dest {{ (dg_artofrally_staging_root + '/' + dg_artofrally_umm_dir) | quote }}
      register: _aor_umm_dl
      changed_when: "'saved' in _aor_umm_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Find the staged UMM archive
      ansible.builtin.find:
        paths: "{{ dg_artofrally_staging_root }}/{{ dg_artofrally_umm_dir }}"
        patterns: ["*.zip"]
      register: _aor_umm_staged

    - name: Fail when UMM is not staged
      ansible.builtin.fail:
        msg: >-
          Unity Mod Manager not staged. Set NEXUS_MODS_API_KEY (Premium) or
          download site/mods/21 into
          {{ dg_artofrally_staging_root }}/{{ dg_artofrally_umm_dir }}/.
      when: _aor_umm_staged.matched == 0

    - name: Check the UMM install marker
      ansible.builtin.stat:
        path: "{{ dg_artofrally_game_dir }}/.dg-umm-{{ dg_artofrally_umm_file }}"
      register: _aor_umm_marker

    - name: Deploy UMM (winhttp shim + runtime) into the game dir
      ansible.builtin.shell: |
        set -eu
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        7z x -y -o"$tmp" {{ _aor_umm_staged.files[0].path | quote }} >/dev/null
        src="$tmp/UnityModManagerInstaller"
        game={{ dg_artofrally_game_dir | quote }}
        cp -f "$src/winhttp_x64.dll" "$game/winhttp.dll"
        mkdir -p "$game/UnityModManager" "$game/Mods"
        {% for f in dg_artofrally_umm_runtime %}
        cp -f "$src/{{ f }}" "$game/UnityModManager/{{ f }}"
        {% endfor %}
        [ -d "$src/Harmony" ] && cp -rf "$src/Harmony" "$game/UnityModManager/" || true
        echo "umm-deployed"
      register: _aor_umm_deploy
      changed_when: "'umm-deployed' in _aor_umm_deploy.stdout"
      when: not _aor_umm_marker.stat.exists

    - name: Write the Doorstop config
      ansible.builtin.copy:
        dest: "{{ dg_artofrally_game_dir }}/doorstop_config.ini"
        content: "{{ dg_artofrally_doorstop_config }}"
        mode: "0644"
        backup: true

    - name: Write the UMM install marker
      ansible.builtin.copy:
        dest: "{{ dg_artofrally_game_dir }}/.dg-umm-{{ dg_artofrally_umm_file }}"
        content: "Unity Mod Manager file {{ dg_artofrally_umm_file }} (DoorstopProxy)\n"
        mode: "0644"
      when: not _aor_umm_marker.stat.exists

    # --- The mods ---

    - name: Download each mod via the Nexus API (Premium key)
      ansible.builtin.command:
        cmd: >-
          {{ dg_project_root }}/scripts/nexus-download.py --game artofrally
          --mod {{ item.id }} --via api
          --dest {{ (dg_artofrally_staging_root + '/' + item.dir) | quote }}
      loop: "{{ dg_artofrally_mods }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: _aor_dl
      changed_when: "'saved' in _aor_dl.stdout"
      failed_when: false
      no_log: true
      when: lookup('ansible.builtin.env', 'NEXUS_MODS_API_KEY') | length > 0

    - name: Find each staged mod archive
      ansible.builtin.find:
        paths: "{{ dg_artofrally_staging_root }}/{{ item.dir }}"
        patterns: ["*.zip", "*.7z", "*.rar"]
      loop: "{{ dg_artofrally_mods }}"
      loop_control:
        label: "{{ item.id }}"
      register: _aor_staged

    - name: Fail with a manifest when mods are not staged
      ansible.builtin.fail:
        msg: |
          Stage these Art of Rally mods (set NEXUS_MODS_API_KEY or download):
          {% for r in _aor_staged.results %}
          {% if r.matched == 0 %}  - {{ r.item.id }} {{ r.item.name }} — {{ r.item.url }} -> {{ dg_artofrally_staging_root }}/{{ r.item.dir }}/
          {% endif %}
          {% endfor %}
      when: _aor_staged.results | selectattr('matched', 'equalto', 0) | list | length > 0

    - name: Install each mod into Mods/ (per dest rule)
      ansible.builtin.shell: |
        set -eu
        marker="{{ dg_artofrally_game_dir }}/.dg-aor-mod-{{ item.id }}"
        [ -f "$marker" ] && { echo "skip {{ item.id }}"; exit 0; }
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        arch="$(find {{ (dg_artofrally_staging_root + '/' + item.dir) | quote }} -maxdepth 1 -type f \( -name '*.zip' -o -name '*.7z' -o -name '*.rar' \) | head -1)"
        7z x -y -o"$tmp" "$arch" >/dev/null
        mkdir -p {{ (dg_artofrally_game_dir + '/' + item.dest) | quote }}
        rsync -a "$tmp"/ {{ (dg_artofrally_game_dir + '/' + item.dest) | quote }}
        printf '%s\n' "{{ item.name }} ({{ item.url }})" > "$marker"
        echo "installed {{ item.id }}"
      loop: "{{ dg_artofrally_mods }}"
      loop_control:
        label: "{{ item.id }} -> {{ item.dest }}"
      register: _aor_install
      changed_when: "'installed' in _aor_install.stdout"

    # --- Steam launch options (winhttp override) ---

    - name: Auto-discover the in-box Steam localconfig.vdf
      ansible.builtin.find:
        paths: "{{ dg_artofrally_steam_root }}/userdata"
        patterns: localconfig.vdf
        recurse: true
      register: _aor_localconfigs
      when: dg_artofrally_steam_localconfig | length == 0

    - name: Resolve the effective localconfig path
      ansible.builtin.set_fact:
        _aor_localconfig: >-
          {{ dg_artofrally_steam_localconfig if (dg_artofrally_steam_localconfig | length > 0)
             else (_aor_localconfigs.files | map(attribute='path') | list | first
                   if (_aor_localconfigs.files | default([]) | length == 1) else '') }}

    - name: Check if Steam is running
      ansible.builtin.shell: |
        pgrep -u "$(id -u)" -x steam >/dev/null || pgrep -u "$(id -u)" -f '/steam(webhelper)?( |$)' >/dev/null
      register: _aor_steam_running
      changed_when: false
      failed_when: false
      check_mode: false
      when: _aor_localconfig | length > 0

    - name: Refuse to edit launch options while Steam is running
      ansible.builtin.fail:
        msg: "Steam is running. Close it or set dg_artofrally_stop_steam=true."
      when:
        - _aor_localconfig | length > 0
        - not (dg_artofrally_stop_steam | bool)
        - _aor_steam_running.rc == 0

    - name: Stop Steam before editing launch options
      ansible.builtin.command: steam -shutdown
      changed_when: true
      failed_when: false
      when:
        - _aor_localconfig | length > 0
        - dg_artofrally_stop_steam | bool
        - _aor_steam_running.rc == 0

    - name: Wait for Steam to exit
      ansible.builtin.shell: |
        for _ in $(seq 1 30); do
          pgrep -u "$(id -u)" -x steam >/dev/null || exit 0; sleep 1
        done; exit 1
      changed_when: false
      when:
        - _aor_localconfig | length > 0
        - dg_artofrally_stop_steam | bool
        - _aor_steam_running.rc == 0

    - name: Set the Art of Rally Steam launch options (winhttp override)
      ansible.builtin.command: >-
        {{ dg_project_root }}/scripts/set-steam-launch-options.py
        --localconfig {{ _aor_localconfig | quote }}
        --set {{ dg_artofrally_appid | quote }} {{ dg_artofrally_launch_options | quote }}
      register: _aor_launch
      changed_when: "'changed: true' in _aor_launch.stdout"
      when: _aor_localconfig | length > 0

    - name: Report completion + verify step
      ansible.builtin.debug:
        msg:
          - "Art of Rally mods installed into {{ dg_artofrally_game_dir }}/Mods/."
          - "VERIFY: launch under Proton, press Ctrl+F10 — the UMM overlay should list Camera Mod / Real car names / FASTER / era sponsorship."
          - "If UMM does NOT appear: run UnityModManager.exe under Proton once (writes the correct Doorstop config), then re-run."
          - "{{ 'Launch options set.' if (_aor_localconfig | length > 0) else 'Set launch options manually: ' + dg_artofrally_launch_options }}"
          - "Revert: ansible-playbook install-artofrally-mods.yml -e dg_artofrally_revert=true"
