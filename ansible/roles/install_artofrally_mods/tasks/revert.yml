---
# Uninstall the Art of Rally mod set: remove UMM (winhttp shim + Doorstop config
# + runtime), the Mods/ tree, and markers; clear the launch option. Steam →
# Verify integrity restores anything base. Close Steam first.

- name: Remove UMM + Doorstop + mods
  ansible.builtin.file:
    path: "{{ dg_artofrally_game_dir }}/{{ item }}"
    state: absent
  loop:
    - winhttp.dll
    - doorstop_config.ini
    - UnityModManager
    - Mods

- name: Remove UMM + per-mod markers
  ansible.builtin.file:
    path: "{{ dg_artofrally_game_dir }}/.dg-umm-{{ dg_artofrally_umm_file }}"
    state: absent

- name: Remove per-mod markers
  ansible.builtin.file:
    path: "{{ dg_artofrally_game_dir }}/.dg-aor-mod-{{ item.id }}"
    state: absent
  loop: "{{ dg_artofrally_mods }}"
  loop_control:
    label: "{{ item.id }}"

- name: Auto-discover the in-box Steam localconfig.vdf (revert)
  ansible.builtin.find:
    paths: "{{ dg_artofrally_steam_root }}/userdata"
    patterns: localconfig.vdf
    recurse: true
  register: _aor_rv_localconfigs
  when: dg_artofrally_steam_localconfig | length == 0

- name: Resolve localconfig for revert
  ansible.builtin.set_fact:
    _aor_rv_localconfig: >-
      {{ dg_artofrally_steam_localconfig if (dg_artofrally_steam_localconfig | length > 0)
         else (_aor_rv_localconfigs.files | map(attribute='path') | list | first
               if (_aor_rv_localconfigs.files | default([]) | length == 1) else '') }}

- name: Clear the Art of Rally launch options (best effort)
  ansible.builtin.command: >-
    {{ dg_project_root }}/scripts/set-steam-launch-options.py
    --localconfig {{ _aor_rv_localconfig | quote }}
    --set {{ dg_artofrally_appid | quote }} ""
  register: _aor_rv_launch
  changed_when: "'changed: true' in _aor_rv_launch.stdout"
  failed_when: false
  when: _aor_rv_localconfig | length > 0

- name: Report revert
  ansible.builtin.debug:
    msg: "Art of Rally mods reverted (UMM + Mods/ removed, launch options cleared). Set the game back off Proton in Steam if desired."
